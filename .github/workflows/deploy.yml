name: Deploy to Cloudflare Workers

# main 브랜치에 푸시되면 자동으로 라이브에 배포합니다.
on:
  push:
    branches: [main]
  workflow_dispatch: {}   # 필요하면 Actions 탭에서 수동 실행도 가능

# 동시에 여러 배포가 겹치지 않도록(마지막 푸시만 반영).
concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # 프로젝트에 설치된 wrangler(v4)로 배포. ADMIN_PASSWORD 등 Worker 시크릿은
      # 워커에 이미 저장돼 있어 배포 때 건드리지 않습니다.
      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # 토큰이 여러 계정에 걸쳐 있을 때만 필요(선택). 없으면 무시됩니다.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
