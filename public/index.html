<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>실시간 경매</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A1017; --panel:#141C26; --panel2:#1B2733; --line:#26343F; --line2:#3A4B59;
  --gold:#D4A94E; --gold-soft:rgba(212,169,78,.14);
  --text:#E6ECF2; --muted:#93A6B8; --body2:#A9B8C6; --danger:#E06A64; --danger-bg:#3A1F1E; --danger-bd:#7A3531; --danger-solid:#B23B36; --ok:#5FA86B;
  --top:#E07A5F; --jgl:#7BB661; --mid:#6FA8DC; --adc:#E0B04A; --sup:#B58ADB; --none:#7E90A2;
  --sans:'IBM Plex Sans KR',system-ui,sans-serif; --num:'Bebas Neue','IBM Plex Sans KR',sans-serif;
  /* 스케일 토큰 — 간격은 4px 배수, 라운드 4단계, 글자 8단계. 새 스타일은 이 토큰만 쓴다. */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px;
  --r-sm:6px; --r-md:8px; --r-lg:12px; --r-pill:999px;
  --fs-2xs:11px; --fs-xs:12px; --fs-sm:13px; --fs-base:14px; --fs-md:15px; --fs-lg:17px; --fs-xl:22px; --fs-2xl:28px;
  /* 클랜티어 구간색(1~5 → 챌·그마·마스터·다이아·에메) — JS GRADE_COLORS와 단일 소스 */
  --grade0:#e6c14a; --grade1:#e0554f; --grade2:#b06fe0; --grade3:#4aa3e0; --grade4:#2fae5f;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:var(--sans)}
/* 배경은 단색이 아니라 상단 골드 여광 + 모서리 비네트 두 겹 — 화면에 깊이가 생기고
   '기본값 그대로'라는 인상이 사라집니다. 본문 대비에 영향 없게 아주 옅게만. */
body{padding:18px;min-height:100vh;background:
  radial-gradient(1100px 480px at 50% -8%, rgba(212,169,78,.055), transparent 62%),
  radial-gradient(900px 640px at 108% 108%, rgba(20,28,38,.9), transparent 58%),
  var(--bg);background-attachment:fixed}
/* 다크 테마에 맞춘 스크롤바 — 기본 회색 스크롤바가 남아 있으면 손대지 않은 화면처럼 보입니다 */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--line2)}
::-webkit-scrollbar-track{background:transparent}
*{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
button,input,textarea,select{font-family:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
::selection{background:var(--gold);color:#0A1017}
.wrap{max-width:1440px;margin:0 auto}
.num{font-family:var(--num);letter-spacing:.02em;font-variant-numeric:tabular-nums}
/* 한국어 안내문은 어절 단위로 끊는다. keep-all이 없으면 '지명합니다'가 '지/명합니다'로 갈린다. */
.hint{font-size:var(--fs-xs);color:var(--body2);line-height:1.65;word-break:keep-all}
/* 윗변에만 1px 밝은 안쪽 하이라이트 — 면이 위에서 빛을 받는 듯한 미세한 깊이. */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;
  box-shadow:inset 0 1px 0 rgba(230,236,242,.035)}
.lbl{font-size:var(--fs-2xs);font-weight:600;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-bottom:8px;display:block}
input[type=text],input[type=number],input[type=password],textarea,select{width:100%;background:var(--bg);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:9px 11px;font-size:var(--fs-base);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--gold)}
textarea{resize:vertical;line-height:1.65;font-size:var(--fs-sm)}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 15px;
  font-size:var(--fs-sm);font-weight:500;transition:.13s}
.btn:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
/* 누르는 감각 — 클릭 순간 1px 가라앉습니다. 전 버튼 공통의 마이크로 인터랙션. */
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#0A1017;font-weight:700}
.btn.gold:hover:not(:disabled){filter:brightness(1.12);color:#0A1017}
.btn.ghost{background:none}
.btn.danger{background:var(--danger-solid);border-color:var(--danger-solid);color:#fff;font-weight:700}
.btn.danger:hover:not(:disabled){filter:brightness(1.12);color:#fff;border-color:var(--danger-solid)}
.btn.danger-soft{background:var(--danger-bg);border-color:var(--danger-bd);color:#E88A85;font-weight:600}
.btn.danger-soft:hover:not(:disabled){border-color:var(--danger);color:#E88A85}
.skl{display:block;border-radius:var(--r-sm);background:linear-gradient(90deg,#1B2733 25%,#243240 50%,#1B2733 75%);background-size:200% 100%;animation:skl 1.4s infinite}
@keyframes skl{0%{background-position:200% 0}100%{background-position:-200% 0}}
.btn:disabled{opacity:.32;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}
/* 반복 인라인 스타일 흡수용 유틸 — 치수는 토큰만 사용 */
.btn.sm{font-size:var(--fs-xs);padding:6px 12px}
.mt-2{margin-top:var(--sp-2)}.mt-3{margin-top:var(--sp-3)}
.row.end{justify-content:flex-end}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.tag{display:inline-block;font-size:var(--fs-2xs);font-weight:700;letter-spacing:.1em;padding:3px 7px;border-radius:4px;border:1px solid currentColor}
.t-TOP{color:var(--top)}.t-JGL{color:var(--jgl)}.t-MID{color:var(--mid)}
.t-ADC{color:var(--adc)}.t-SUP{color:var(--sup)}.t-{color:var(--none)}

/* 상단바 */
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);
  padding-bottom:14px;margin-bottom:18px}
.brand{font-weight:700;font-size:var(--fs-lg);letter-spacing:-.02em}
.brand span{color:var(--gold)}
.brand .live{font-size:var(--fs-2xs);font-weight:800;letter-spacing:.08em;color:var(--danger);border:1px solid var(--danger);border-radius:4px;padding:1px 6px;vertical-align:2px;margin-left:4px;animation:livePulse 2.4s ease-in-out infinite}
@keyframes livePulse{0%,100%{opacity:1}50%{opacity:.5}}
.code{font-family:var(--num);font-size:var(--fs-xl);color:var(--text);letter-spacing:.14em}
.who{font-size:var(--fs-xs);color:var(--muted);border:1px solid var(--line);border-radius:var(--r-pill);padding:4px 11px}
.conn{margin-left:auto;display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end;
  font-size:var(--fs-xs);color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--danger)}
.dot.on{background:var(--ok)}
/* 접속 현황 — 미접속은 위험이 아니라 '아직'이므로 danger 빨강을 쓰지 않습니다.
   전원 접속(full)일 때만 초록으로 바뀌어, 시작해도 되는 순간이 한눈에 보입니다. */
.pres{display:inline-flex;align-items:center;gap:4px;font:inherit;font-size:var(--fs-xs);line-height:1;
  padding:4px 9px;border-radius:var(--r-pill);border:1px solid var(--line);background:none;color:var(--muted);white-space:nowrap}
.pres.full{color:var(--ok);border-color:rgba(95,168,107,.45)}
.pres.warn{color:var(--gold);border-color:rgba(212,169,78,.45)}
button.pres{cursor:pointer}
button.pres:hover{background:rgba(255,255,255,.05)}
.pdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#46545F;margin-right:5px;vertical-align:middle}
.team-nm .pdot{width:7px;height:7px}
.pdot.idle{visibility:hidden}   /* presence 도착 전: 자리만 잡고 그리지 않음 */
.pdot.on{background:var(--ok);box-shadow:0 0 5px rgba(95,168,107,.8)}
.poff{margin-left:7px;font-size:var(--fs-2xs);font-weight:500;color:var(--gold);opacity:.85;vertical-align:middle}

/* 랜딩 */
.landing{max-width:560px;margin:8vh auto;text-align:center}
.landing h1{font-size:34px;font-weight:700;letter-spacing:-.03em;margin-bottom:10px}
.landing .hint{margin-bottom:28px}
.join{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}
.join input{font-family:var(--num);font-size:24px;text-align:center;letter-spacing:.24em;text-transform:uppercase}

/* 설정 */
.setup{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
/* 좁은 화면에서 '드래프트 (순서 지명)'이 '지/명'으로 잘리는 것을 막는다. */
.modesel .btn{word-break:keep-all}
/* 드래프트 규칙 — 켤 수 있는 규칙만 체크박스로 두고, 지금 어떤 드래프트가 되는지는
   아래 결과 줄이 이름과 함께 알려준다. 자유는 세 번째 규칙이 아니라 둘 다 꺼진 상태라
   체크칸을 따로 두지 않는다(자유 ☑ + 클랜티어 ☑ 같은 불가능한 조합이 생긴다).
   네이티브 체크박스라 선택 상태·키보드 조작은 브라우저가 맡는다. */
.rulechk{display:flex;align-items:center;gap:9px;padding:8px 11px;cursor:pointer;transition:.13s;
  background:var(--bg);border:1px solid var(--line);border-radius:var(--r-md);
  font-size:var(--fs-sm);color:var(--body2);word-break:keep-all}
.rulechk:hover{border-color:var(--line2)}
.rulechk.on{border-color:var(--gold);background:var(--gold-soft);color:var(--text)}
.rulechk input{width:16px;height:16px;margin:0;flex:none;accent-color:var(--gold)}
.rulechk i{font-style:normal;margin-left:auto;font-size:var(--fs-2xs);color:var(--muted)}
.rulechk.on i{color:var(--gold)}
.rulegrp{display:flex;flex-direction:column;gap:6px}
/* 결과 줄 — 체크 조합이 어떤 드래프트인지 이름과 순서·제약·필요로 확인해 준다.
   앱이 진행 중 방에 쓰는 왼쪽 골드 띠(.room.st-live)를 그대로 쓴다. */
.ruleout{margin-top:9px;padding:10px 12px;background:var(--bg);border:1px solid var(--gold);
  border-radius:var(--r-md);box-shadow:inset 3px 0 0 var(--gold);word-break:keep-all}
.ruleout>b{display:block;font-size:var(--fs-sm);color:var(--gold);margin-bottom:5px}
/* 요약 배지 — 조합이 뭘 하는지 한 줄로 먼저 말해 준다 */
.rule-sum{margin:0 0 9px;padding:8px 10px;background:rgba(212,169,78,.10);
  border-radius:var(--r-sm);font-size:var(--fs-xs);line-height:1.55;color:var(--text);word-break:keep-all}
.rule-sum b{color:var(--gold);font-weight:600}
/* .hint와 같은 크기·행간 */
.ruleout>span{display:grid;grid-template-columns:24px 1fr;gap:8px;font-size:var(--fs-xs);line-height:1.6;color:var(--body2)}
.ruleout>span+span{margin-top:3px}
.ruleout>span>i{font-style:normal;font-size:var(--fs-2xs);color:var(--muted)}
.ruleout>span b{font-weight:600;color:var(--text)}
/* 방을 만들 수 없는 이유 목록 */
.blockbox{margin-top:12px;padding:10px 13px;background:var(--danger-bg);border:1px solid var(--danger-bd);
  border-radius:var(--r-md);font-size:var(--fs-xs);color:#E88A85;line-height:1.7;word-break:keep-all}
.blockbox b{display:block;font-size:var(--fs-sm);margin-bottom:3px}
.blockbox ul{margin:0;padding-left:17px}
/* 꼭 읽어야 할 안내(경고가 아님) — 방을 만든 직후 '진행자 링크 저장' 안내에 씁니다 */
.notebox{padding:10px 13px;background:var(--gold-soft);border:1px solid var(--gold);
  border-radius:var(--r-md);font-size:var(--fs-xs);color:var(--text);line-height:1.7;word-break:keep-all}
.notebox .nb-hd{display:block;font-size:var(--fs-sm);color:var(--gold);margin-bottom:3px}
.notebox ul{margin:0;padding-left:17px}
/* 고정값 표시(수정 불가) — input과 같은 높이로 맞춰 나란히 놓인다. */
.fixedval{background:var(--bg);border:1px dashed var(--line);border-radius:var(--r-sm);padding:9px 11px;
  font-size:var(--fs-base);color:var(--body2)}
.fixedval i{font-style:normal;font-size:var(--fs-2xs);color:var(--muted);margin-left:4px}
/* 값 칸 수에 따라 세 가지: 없음(자유) 1개(기본) 2개(클랜티어+클랜점수) */
.leader-row{display:grid;grid-template-columns:1fr 76px 76px 34px;gap:8px;margin-bottom:8px}
.leader-row.none{grid-template-columns:1fr 76px 34px}
.leader-row.two{grid-template-columns:1fr 66px 66px 66px 34px}
@media(max-width:640px){
  /* 폭이 좁으면 닉네임+삭제만 한 줄에 두고 나머지는 아래로 쌓는다.
     삭제 버튼은 (1,2)로 못박아야 자동배치가 그것을 맨 아래 행으로 밀지 않는다. */
  .leader-row,.leader-row.none,.leader-row.two{grid-template-columns:1fr 34px;gap:6px}
  .leader-row>button{grid-row:1;grid-column:2}
  .leader-row>select,.leader-row>input:not([data-f="name"]){grid-column:1/-1}
  /* 헤더 행은 span만이라 위 규칙이 안 걸려 어긋난다. 각 칸의 placeholder가 대신 설명한다. */
  #leaderList>.leader-row:first-child{display:none}
}
.leader-row input[type=number]{font-family:var(--num);font-size:16px;text-align:center;padding:6px}
.leader-row input[type=number]::placeholder{font-family:var(--sans);font-size:var(--fs-xs)}
.leader-row button{color:var(--muted);font-size:18px;border:1px solid var(--line);border-radius:var(--r-sm)}
.leader-row button:hover{color:var(--danger);border-color:var(--danger)}

/* 관리자 */
.rooms{display:flex;flex-direction:column;gap:9px}
.room{display:grid;grid-template-columns:96px 1fr auto;gap:14px;align-items:center;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px}
.room .rc{font-family:var(--num);font-size:26px;color:var(--text);letter-spacing:.12em}
.room .rt{font-weight:600;font-size:var(--fs-base);margin-bottom:3px}
.room .rs{font-size:var(--fs-xs);color:var(--muted);display:flex;gap:9px;flex-wrap:wrap}
.pill{font-size:var(--fs-2xs);font-weight:700;letter-spacing:.06em;padding:2px 8px;border-radius:var(--r-pill);border:1px solid currentColor}
.p-ready{color:var(--muted)} .p-live{color:var(--gold)} .p-done{color:var(--ok)} .p-gone{color:var(--danger)}
.mode-auction{color:var(--gold)} .mode-draft{color:#6fa8dc}
/* 관리자: 경매방 요약 바 · 코드별 그룹 · 카드 상태 강조 */
.room-sum{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.room-sum .s{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:6px 12px;font-size:var(--fs-xs);color:var(--muted)}
.room-sum .s b{font-family:var(--num);font-size:var(--fs-lg);margin-left:4px;color:var(--text)}
.room-sum .s.live b{color:var(--gold)} .room-sum .s.done b{color:var(--ok)} .room-sum .s.warn{color:var(--danger)} .room-sum .s.warn b{color:var(--danger)}
/* 내가 만든 방 (첫 화면) — 폭이 좁아 관리자 카드(.room)의 3열 대신 위아래로 쌓습니다 */
.myrooms{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.myroom{display:flex;flex-direction:column;gap:7px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px}
.myroom.st-live{box-shadow:inset 4px 0 0 var(--gold)} .myroom.st-done{box-shadow:inset 4px 0 0 var(--ok)}
.myroom.st-ready{box-shadow:inset 4px 0 0 var(--muted)}
.myroom .mr-hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.myroom .rc{font-family:var(--num);font-size:18px;letter-spacing:.1em;color:var(--text)}
.myroom .rt{font-weight:600;font-size:var(--fs-base);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.myroom .rs{font-size:var(--fs-xs);color:var(--muted);display:flex;gap:9px;flex-wrap:wrap}
.myroom .rs .warn{color:var(--danger)}
.myroom .row{gap:6px;flex-wrap:wrap}
.room.st-live{box-shadow:inset 4px 0 0 var(--gold)} .room.st-done{box-shadow:inset 4px 0 0 var(--ok)}
.room.st-ready{box-shadow:inset 4px 0 0 var(--muted)} .room.st-gone{box-shadow:inset 4px 0 0 var(--danger);opacity:.6}
.room .rbar{height:4px;background:var(--panel2);border-radius:2px;overflow:hidden;margin-top:7px;max-width:200px}
.room .rbar i{display:block;height:100%;background:var(--ok)}
.room .rs .warn{color:var(--danger)}
.rgrp{margin-bottom:14px}
.rgrp>summary{display:flex;align-items:baseline;gap:10px;cursor:pointer;padding:4px 2px 8px;list-style:none;border-bottom:1px solid var(--line);margin-bottom:9px}
.rgrp>summary::-webkit-details-marker{display:none}
.rgrp>summary::before{content:'▾';color:var(--muted);font-size:var(--fs-xs)}
.rgrp:not([open])>summary::before{content:'▸'}
.rgrp>summary b{font-size:var(--fs-base)}
.rgrp>summary span{font-size:var(--fs-xs);color:var(--muted)} .rgrp>summary i{font-style:normal;color:var(--gold)}
.rgrp.nogrp>summary b{color:var(--muted);font-weight:500}
.src{display:inline-block;font:inherit;font-size:var(--fs-xs);font-weight:500;line-height:1.5;padding:1px 8px;border-radius:999px;cursor:pointer;vertical-align:middle;
  color:hsl(var(--h) 55% 72%);background:hsl(var(--h) 45% 50% / .14);border:1px solid hsl(var(--h) 45% 55% / .35)}
.src.admin{cursor:default;color:var(--muted);background:transparent;border-color:var(--line)}
.srcbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:var(--fs-xs);color:var(--muted);margin:-4px 0 12px}
.srcbar b{color:var(--text)}
.pill.p-grp{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.grpchips{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:6px;font-size:var(--fs-xs);color:var(--muted)}
.grpchip{font:inherit;font-size:var(--fs-xs);color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:2px 9px;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grpchip:hover,.grpchip:focus-visible{border-color:var(--gold);color:var(--gold)}
label .opt{font-style:normal;font-weight:400;color:var(--muted);margin-left:4px}
.empty{text-align:center;padding:44px 20px;color:var(--muted);font-size:var(--fs-sm);line-height:1.9}

/* 참가자 목록 */
.drop{border:1.5px dashed var(--line);border-radius:var(--r-lg);padding:22px 16px;text-align:center;
  transition:.15s;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--gold);background:var(--gold-soft)}
/* 자식 선택자여야 한다. 후손 선택자면 아래 안내문의 인라인 <b>까지 블록이 되어
   "위 / 양식 다운로드 / 로 받아 채운 뒤…"로 문장이 갈라진다. */
.drop>b{display:block;font-size:var(--fs-base);font-weight:600;margin-bottom:5px}
.plist{display:flex;flex-direction:column;gap:5px;max-height:340px;overflow-y:auto;margin-top:12px}
.prow{display:grid;grid-template-columns:1fr 62px 84px 1fr 40px;gap:9px;align-items:center;
  background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 10px;font-size:var(--fs-xs)}
.prow .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .nm i{font-style:normal;color:var(--muted);font-weight:400;font-size:var(--fs-2xs)}
.prow .tr{font-size:var(--fs-2xs);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .ch{color:var(--muted);font-size:var(--fs-2xs);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow button{color:var(--muted);font-size:16px;line-height:1;min-width:40px;min-height:36px}
.prow button:hover{color:var(--danger)}
.prow.dup{border-color:var(--danger)}
.psum{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.psum b{font-family:var(--num);font-size:20px;color:var(--text)}

/* 링크 배포 */
.link-row{display:grid;grid-template-columns:130px 1fr auto;gap:9px;align-items:center;margin-bottom:8px}
.link-row code{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;
  font-size:var(--fs-2xs);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:ui-monospace,monospace}
.link-row b{font-size:var(--fs-sm);font-weight:600}

/* 경매장
   면 위계 규칙(2계층+영웅): elev-0 = 배경면(진행 기록·풀 등 조연, 배경 없음/얇은 테두리),
   elev-1 = 기본 패널(.panel), hero = 지금 이 순간의 주인공(타이머·현재 입찰·지명 차례).
   hero만 --panel2 배경과 큰 숫자를 가질 수 있습니다 — 골드는 '중요'의 뜻을 지키기 위해 아껴 씁니다. */
.stage{display:grid;grid-template-columns:minmax(320px,410px) 1fr;gap:16px;align-items:start}
/* overflow:hidden이면 모바일 sticky 타이머가 동작하지 않습니다. 플래시 모서리는 radius 상속으로 해결. */
.lot{position:relative}
/* 무대의 서명 — 경매/드래프트가 벌어지는 패널에만 골드 헤어라인을 얹습니다.
   이 앱 고유의 모티프이므로 다른 패널에는 쓰지 않습니다. */
.lot::before{content:'';position:absolute;top:0;left:16px;right:16px;height:2px;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--gold) 30%,var(--gold) 70%,transparent);opacity:.75}
.lot-empty{text-align:center;padding:54px 20px;color:var(--muted);font-size:var(--fs-base);line-height:1.85}
.lot-no{font-family:var(--num);font-size:var(--fs-sm);color:var(--muted);letter-spacing:.2em}
/* 소개 카드(글자가 든 이미지)라 자르지 않고 전체를 보여줍니다. 누르면 크게 보기. */
.lot-img{display:block;width:100%;height:auto;max-height:340px;object-fit:contain;cursor:zoom-in;
  border-radius:var(--r-lg);border:1px solid var(--line);margin-bottom:14px;background:var(--panel2)}
.lot-name{font-size:clamp(30px,4.6vw,50px);font-weight:700;letter-spacing:-.035em;line-height:1.05;
  margin:10px 0 12px;word-break:keep-all}
.lot-meta{display:flex;align-items:center;gap:10px;margin-bottom:18px}

.tier{font-size:var(--fs-xs);font-weight:600;color:var(--gold);border:1px solid var(--gold);
  border-radius:4px;padding:2px 8px}
.champs{display:flex;gap:5px;flex-wrap:wrap;margin:-4px 0 12px}
.champs span{font-size:var(--fs-2xs);color:var(--muted);background:var(--panel2);
  border-radius:var(--r-sm);padding:4px 9px}
/* 한마디 — 선수 본인의 목소리. 무대의 골드 모티프를 왼쪽 헤어라인으로 이어받되,
   입찰 정보와 헷갈리지 않게 배경은 낮추고 서체만 살짝 기울입니다. */
.lot-msg{font-size:var(--fs-sm);font-style:italic;color:var(--body2);background:var(--panel2);
  border-left:3px solid var(--gold);border-radius:var(--r-sm);padding:8px 12px;
  margin:0 0 14px;word-break:keep-all;overflow-wrap:anywhere}
/* hero: 현재 최고 입찰 — 화면에서 가장 무거운 면. 패널보다 밝은 배경 + 큰 숫자. */
.high{background:var(--panel2);border:1px solid var(--line2);border-radius:var(--r-lg);padding:15px;margin-bottom:12px}
.high.mine{border-color:var(--gold);background:var(--gold-soft)}
.high .who-bid{font-size:var(--fs-sm);font-weight:600;margin-bottom:3px}
.high .amt{font-family:var(--num);font-size:clamp(36px,5vw,52px);line-height:1;color:var(--gold)}
.high .none{font-size:var(--fs-base);color:var(--muted);padding:6px 0}
/* 입찰 수신 직후 한 번만 얹는 펄스(재렌더마다 반복되지 않게 이벤트에서 클래스를 붙입니다) */
.high.pulse{animation:highPulse .45s ease-out}
@keyframes highPulse{0%{border-color:var(--gold);box-shadow:0 0 20px -4px var(--gold)}100%{box-shadow:0 0 0 0 transparent}}

/* hero: 타이머 */
.clock{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.clock b{font-family:var(--num);font-size:clamp(48px,6vw,64px);line-height:1;min-width:80px}
.clock.hot b{color:var(--danger)}
.bar{flex:1;height:5px;background:var(--panel2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);transition:width .25s linear}
.clock.hot .bar i{background:var(--danger)}

.bidpad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:9px}
.bidpad button{padding:13px 0;font-size:var(--fs-base);font-weight:700;background:var(--panel2);
  border:1px solid var(--line);border-radius:var(--r-md)}
.bidpad button:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
.bidpad button:disabled{opacity:.3;cursor:not-allowed}
.custom{display:grid;grid-template-columns:1fr auto;gap:6px}
.custom input{font-family:var(--num);font-size:20px;text-align:center}

/* 팀 보드 */
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:12px}
.team{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;
  display:flex;flex-direction:column;gap:11px;transition:.15s}
.team.me{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.my-badge{display:inline-block;margin-left:6px;background:var(--gold);color:#0A1017;font-size:var(--fs-2xs);font-weight:800;letter-spacing:.06em;padding:1px 7px;border-radius:var(--r-pill);vertical-align:middle;box-shadow:0 0 6px -1px var(--gold)}
.team.top{border-color:var(--ok);background:linear-gradient(rgba(95,168,107,.10),var(--panel))}
.team.turn{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold),0 0 22px -2px var(--gold)}
/* 입찰/턴 변경 순간의 카드 연출 — onEvent가 paint 직후 rAF로 클래스를 얹습니다 */
.team.pulse{animation:cardPulse .5s ease-out}
@keyframes cardPulse{0%{box-shadow:0 0 0 0 rgba(95,168,107,.45)}100%{box-shadow:0 0 0 12px rgba(95,168,107,0)}}
.team.turn.anim-turn{animation:turnGlow .6s ease-out}
@keyframes turnGlow{0%{box-shadow:0 0 0 8px rgba(212,169,78,.4),0 0 34px -2px var(--gold)}
  100%{box-shadow:0 0 0 3px var(--gold),0 0 22px -2px var(--gold)}}
.turn-badge{display:inline-block;margin-left:6px;background:var(--gold);color:#0A1017;font-size:var(--fs-2xs);font-weight:800;padding:1px 6px;border-radius:var(--r-pill);vertical-align:middle}
.tierrow{display:flex;gap:4px;flex-wrap:wrap;margin:2px 0}
.tchip{font-size:var(--fs-2xs);font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:var(--r-sm);padding:2px 6px}
.tchip.on{color:#0A1017;background:var(--gold);border-color:var(--gold)}
.tchip i{font-style:normal;font-size:var(--fs-2xs);opacity:.75}
.ttag{display:inline-block;min-width:17px;text-align:center;font-size:var(--fs-2xs);font-weight:800;color:#000;border-radius:3px;padding:1px 4px;margin-right:5px;vertical-align:middle}
.posic{width:17px;height:17px;vertical-align:middle;margin-left:3px}
.treqrow{display:flex;gap:6px;flex-wrap:wrap}
.treq{font-size:var(--fs-xs);color:var(--muted);border:1px solid var(--line);border-radius:var(--r-sm);padding:4px 9px}
.treq b{font-family:var(--num);color:var(--text)}
.treq.bad{color:var(--danger);border-color:var(--danger)}
.treq.bad b{color:var(--danger)}
/* 순서 칩(점수 드래프트 첫 라운드) — 번호는 흐리게, 팀장은 밝고 굵게, 총점은 골드로 세 층을 나눕니다. */
.ordchip{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-xs);font-weight:700;color:var(--text);
  border:1px solid var(--line);border-radius:var(--r-sm);padding:4px 9px}
.ordchip i{font-style:normal;font-family:var(--num);font-size:var(--fs-sm);font-weight:400;color:var(--muted)}
.ordchip b{font-family:var(--num);font-size:var(--fs-sm);font-weight:400;color:var(--gold)}
.ord-list{display:flex;flex-direction:column;gap:6px}
.ord-row{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-md);padding:8px 12px}
/* 동점 정리 목록에서 내 팀 행 강조 */
.ord-row.me{border-color:var(--gold);background:var(--gold-soft)}
/* 점수 모드 준비 화면: 동점 그룹 행(왼쪽 골드 브래킷) + 총점 표시 */
.ord-row.tied{box-shadow:inset 3px 0 0 var(--gold)}
.ord-pt{font-family:var(--num);font-size:var(--fs-lg);color:var(--gold);min-width:34px;text-align:right}
.tie-badge{font-size:var(--fs-2xs);font-weight:800;letter-spacing:.06em;color:var(--gold);border:1px solid var(--gold);border-radius:4px;padding:1px 5px;white-space:nowrap}
/* 번호는 흐리고 크게(색인), 이름은 밝고 굵게(주인공) — 둘이 같은 층으로 읽히지 않게 위계를 벌립니다. */
.ord-n{font-family:var(--num);font-size:19px;color:var(--muted);min-width:22px;text-align:center}
.ord-nm{flex:1;font-weight:700;letter-spacing:-.02em;color:var(--text)}
.ord-btns{display:flex;gap:4px}
.ord-btns button{padding:10px 14px;font-size:var(--fs-base);min-width:44px}
/* 진행 중 지명 차례 띠 — 현재 픽부터 다음 라운드까지 전부 보여주고, 좁으면 줄바꿈합니다.
   (숨김·페이드·가로 스크롤 없음: 몇 팀이 남았는지가 항상 눈에 보여야 합니다)
   주의: 항목 클래스는 .turn-item 입니다. .turn 은 팀 카드(.team.turn)가 이미 쓰고 있어 충돌합니다. */
.turnbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:12px;padding:9px 11px;
  background:var(--bg);border:1px solid var(--line);border-radius:var(--r-md)}
.turn-lb{font-size:var(--fs-2xs);color:var(--muted);letter-spacing:.12em;flex-shrink:0;margin-right:2px}
.turn-item{display:inline-flex;align-items:center;gap:6px;
  background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-pill);
  padding:5px 11px;font-size:var(--fs-xs);font-weight:600;white-space:nowrap}
/* 지금 지명 중인 팀: 골드 솔리드. 내 팀: 골드 테두리 + '나' 뱃지. */
.turn-item.now{background:var(--gold);border-color:var(--gold);color:#0A1017;font-weight:800}
.turn-item.mine{border-color:var(--gold);box-shadow:0 0 10px -4px var(--gold)}
.turn-me{font-style:normal;font-size:var(--fs-2xs);font-weight:800;color:#0A1017;background:var(--gold);
  border-radius:var(--r-pill);padding:1px 6px}
.turn-item.now .turn-me{background:#0A1017;color:var(--gold)}
.turn-more{font-size:var(--fs-2xs);color:var(--muted);flex-shrink:0}
.pcard.pick{cursor:pointer}
.pcard.pick:hover{border-color:var(--gold);background:var(--gold-soft)}
.team.full{opacity:.55}
/* 드래그 배정: 드래그 중 드롭 가능한 팀 강조 */
button.pcard[draggable]{cursor:grab}
button.pcard[draggable]:active{cursor:grabbing}
body.dragging .team[data-team-drop]{outline:2px dashed var(--line);outline-offset:2px}
.team.drop-ok{outline:2px solid var(--gold)!important;outline-offset:2px;background:var(--gold-soft)}
.team-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.team-hd>div:first-child{min-width:0;flex:1}
/* 배지(MY·지명중·최고 NP)와 미접속이 겹쳐 붙어도 줄이 접히지 않게 합니다 — 카드 한 장이
   두 줄이 되면 격자 한 행 전체가 커지고, 그 일이 지명 차례마다 반복됩니다. */
.team-nm{display:flex;align-items:center;gap:6px;min-width:0;
  font-weight:700;font-size:var(--fs-md);letter-spacing:-.02em;line-height:1.3}
.team-nm>.tn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.team-nm>*:not(.tn){flex:none;margin-left:0;margin-right:0}
/* 부제가 빈 카드와 아닌 카드의 높이를 정확히 같게 — 라인박스가 min-height보다 크면
   그 1px 차이가 아래 게이지·자리·명단을 전부 밀어 이웃 카드와 어긋납니다. */
.team-lead{font-size:var(--fs-2xs);line-height:1.2;min-height:1.2em;color:var(--muted);margin-top:2px}
.team-pt{text-align:right;flex-shrink:0}
.team-pt b{font-family:var(--num);font-size:29px;color:var(--gold);line-height:1}
.team-pt i{display:block;font-style:normal;font-size:var(--fs-2xs);color:var(--muted);letter-spacing:.1em;margin-top:1px}
.gauge{height:6px;background:var(--bg);border-radius:3px;overflow:hidden}
.gauge i{display:block;height:100%;background:var(--gold);transition:width .35s ease}
.slots{display:flex;gap:4px}
.slot{flex:1;height:26px;border-radius:var(--r-sm);border:1px dashed var(--line);display:grid;place-items:center;
  font-size:var(--fs-2xs);color:var(--muted);letter-spacing:.06em}
.slot.on{border:1px solid transparent;background:var(--panel2);color:var(--text)}
.roster{display:flex;flex-direction:column;gap:4px;font-size:var(--fs-xs)}
.roster div{display:flex;justify-content:space-between;gap:8px;color:var(--muted)}
.roster div b{font-weight:500;color:var(--text)}
.roster div span{font-family:var(--num);font-size:var(--fs-base);color:var(--body2)}
.roster .lead b{color:var(--gold)}
/* 팀장 표시 ★ — 결과 이미지(canvas)와 같은 표기를 씁니다. */
.lead-star{font-style:normal;margin-right:4px}

/* 조연 패널(elev-0): 진행 기록처럼 참고용 정보 — 배경·하이라이트 없이 테두리만 둬 무게를 낮춥니다 */
.panel.sub{background:transparent;box-shadow:none}
.log-list{display:flex;flex-direction:column;gap:6px;max-height:190px;overflow-y:auto;font-size:var(--fs-xs)}
.log-list div{color:var(--muted);display:flex;gap:9px;flex-wrap:wrap}
/* 동점 주사위 기록 — 팀마다 한 줄씩 값, 마지막 줄에 확정 순서.
   선택자에 .log-list를 붙이는 이유: 아래 .log-list div b(0,1,2)보다 특이도가 낮으면
   확정 순서 줄의 font-weight:600이 500으로 덮입니다. */
.log-list .lr{align-items:flex-start;flex-wrap:nowrap}
.lr-b{display:flex;flex-direction:column;gap:2px}
.lr-b>span{color:var(--muted)}
.log-list .lr-b>span .num{color:var(--gold);font-size:var(--fs-base)}
.log-list .lr-b>b{color:var(--text);font-weight:600;margin-top:2px}
.log-list div b{font-weight:500;color:var(--text)}
.log-list em{font-family:var(--num);font-size:var(--fs-base);color:var(--body2);font-style:normal}

/* 남은 매물 — 균일 그리드. 모든 칩이 같은 폭이고, 같은 줄의 칩은 같은 높이(grid stretch). */
.pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:7px}
/* 빈 풀 힌트는 첫 칸(152px)에 갇히지 않게 전체 폭으로 */
.pool>.hint{grid-column:1/-1}
/* 남은 매물 칩. 기본 2줄(이름·값/라인·티어), 방에 챔피언·한마디 데이터가 있으면 그 줄이 전 칩에 깔림.
   테두리 색 = 등급 구간(롤 티어색). 라인 색은 없음. */
.pcard{display:flex;flex-direction:column;gap:4px;width:100%;height:100%;background:var(--bg);
  border:1.5px solid var(--line);border-radius:var(--r-md);padding:7px 10px;line-height:1.2;color:var(--text);text-align:left}
button.pcard{cursor:pointer;transition:.12s}
button.pcard:hover:not(:disabled){background:var(--panel2)}
button.pcard:disabled{opacity:.45;cursor:not-allowed}
.pc-top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.pc-nm{font-weight:600;font-size:var(--fs-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-gr{font-family:var(--num);font-weight:700;font-size:var(--fs-md);flex:none}
.pc-pass{font-size:var(--fs-2xs);font-weight:700;color:#E88A85;background:#2C1817;border-radius:4px;padding:1px 6px;flex:none}
.pc-bot{display:flex;justify-content:space-between;align-items:center;gap:6px;border-top:1px solid var(--line);padding-top:5px;font-size:var(--fs-xs);color:var(--muted)}
.pc-line{font-weight:700;letter-spacing:.03em}
.pc-sub{font-weight:400;color:var(--muted);font-size:var(--fs-2xs)}
.pc-tier{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:72px}
/* 모스트 챔피언 줄 — 가운데, 한 줄 말줄임(전문은 툴팁). 비어도 자리를 유지해 카드 크기 통일. */
.pc-ch{border-top:1px solid var(--line);padding-top:5px;font-size:var(--fs-2xs);color:var(--muted);
  text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 한마디 줄 — 2줄 고정. 20자 전문이 대부분 다 보이고(최소 폭에선 끝이 …·전문은 title),
   짧거나 비어도 2줄 높이를 유지해 카드 크기가 같음. */
.pc-msg{border-top:1px solid var(--line);padding-top:5px;font-size:var(--fs-2xs);font-style:italic;color:var(--body2);
  line-height:1.45;min-height:calc(2*1.45em + 5px);word-break:keep-all;overflow-wrap:anywhere;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* 정렬/그룹 토글 */
.psort{display:inline-flex;gap:2px;margin-left:auto;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:2px}
.psort button{font-size:var(--fs-xs);padding:9px 13px;border-radius:var(--r-sm);color:var(--muted);letter-spacing:0}
.psort button.on{background:var(--panel2);color:var(--text);font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}
.pgroup{font-size:var(--fs-2xs);font-weight:700;letter-spacing:.08em;color:var(--muted);margin:10px 0 5px}
/* 실력 등급 뱃지 (등급 1~5 → 색인덱스 gr0~gr4) — 롤 티어색(챌·그마·마스터·다이아·에메) */
.gr{display:inline-block;font-size:var(--fs-2xs);font-weight:800;letter-spacing:.02em;padding:2px 6px;border-radius:4px;color:#0A1017;white-space:nowrap}
.gr0{background:var(--grade0)}.gr1{background:var(--grade1)}.gr2{background:var(--grade2)}.gr3{background:var(--grade3)}.gr4{background:var(--grade4)}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:99;background:var(--gold);
  color:#0A1017;font-weight:600;font-size:var(--fs-sm);padding:11px 20px;border-radius:var(--r-md);opacity:0;
  pointer-events:none;transition:.25s;max-width:90vw;text-align:center;white-space:pre-line}
.toast.on{opacity:1;bottom:34px}
/* 토스트 자체는 클릭을 통과시키고(입찰 탭을 가로채지 않도록) 떠 있는 동안의 되돌리기 버튼만 받습니다. */
.toast.on #tUndo{pointer-events:auto}
.toast.bad{background:var(--danger);color:#fff}

.flash{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;
  background:rgba(10,16,23,.92);opacity:0;border-radius:inherit}
.flash b{font-family:var(--num);font-size:56px;color:var(--gold);border:4px solid var(--gold);
  padding:6px 24px;transform:rotate(-8deg);letter-spacing:.06em;text-align:center}
.flash.go{animation:st 1.2s ease-out forwards}
@keyframes st{0%{opacity:0;transform:scale(1.4)}16%{opacity:1;transform:scale(1)}78%{opacity:1}100%{opacity:0}}
.sfx-btn{background:none;border:1px solid var(--line);border-radius:var(--r-sm);padding:2px 8px;font-size:var(--fs-base);line-height:1.4;cursor:pointer}
.sfx-btn.off{opacity:.45}
/* 음량 슬라이더. 🔊 버튼 옆이라 '전체 소리'로 읽히기 쉬워서 🎵·🔔 라벨을 앞에 둡니다.
   좁은 화면에서는 이들을 담은 .conn의 flex-wrap이 아래 줄로 접습니다
   (.topbar의 flex-wrap은 .conn 덩어리 자체만 옮길 뿐 그 안을 쪼개지 못합니다). */
.vollb{font-size:var(--fs-xs);opacity:.7;margin-left:2px}
.vollb.off{opacity:.3}
.volsl{-webkit-appearance:none;appearance:none;width:72px;height:4px;padding:0;border:none;
  border-radius:var(--r-pill);background:var(--line2);cursor:pointer;vertical-align:middle}
.volsl.off{opacity:.45}
.volsl::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:12px;height:12px;
  border-radius:50%;background:var(--gold);border:none;cursor:pointer}
.volsl::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--gold);border:none;cursor:pointer}
.volsl:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.62);display:grid;place-items:center;z-index:200;padding:20px}
/* 소개 카드 관리 창 */
.cm-help{margin:0;padding-left:18px;display:grid;gap:5px}
.cm-help code,.cm-report code{font-size:var(--fs-2xs);background:var(--panel2);border:1px solid var(--line);padding:0 5px;border-radius:4px;word-break:break-all}
.cm-report{background:var(--panel2);border-radius:var(--r-md);padding:10px 12px;font-size:var(--fs-xs);line-height:1.7;margin:0 0 10px;display:grid;gap:4px}
.cm-report code{background:var(--panel)}
.cm-list{display:grid;gap:6px}
.cm-row{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 8px 6px 6px;border:1px solid var(--line);border-radius:var(--r-md)}
.cm-th{display:block;width:72px;height:41px;object-fit:contain;background:var(--panel2);border-radius:4px;cursor:zoom-in}
.cm-th.none{display:grid;place-items:center;font-size:var(--fs-2xs);color:var(--muted);cursor:default;border:1px dashed var(--line2)}
.cm-nm{min-width:0;display:flex;flex-direction:column}
.cm-nm>b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm-act{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media(max-width:640px){ .cm-entry{display:none} }   /* 소개 카드 올리기·관리는 PC 전용 — 휴대폰은 보기만 */
.img-lb{position:fixed;inset:0;background:rgba(5,9,13,.9);display:grid;place-items:center;z-index:210;padding:16px;cursor:zoom-out;outline:none}
.img-lb img{max-width:100%;max-height:calc(100vh - 32px);border-radius:var(--r-lg);border:1px solid var(--line)}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;max-width:660px;width:100%;max-height:85vh;overflow:auto}
.modal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.modal-hd b{font-size:var(--fs-md)}

/* 대진표 — 종료 후 무작위 1:1 매칭. 등장 연출(.anim)은 추첨 이벤트 직후에만 붙습니다. */
.match-row{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);
  border-radius:var(--r-md);padding:10px 14px;margin-bottom:6px}
.match-row.anim{animation:matchIn .4s both;animation-delay:calc(var(--i,0)*.12s)}
.match-no{font-family:var(--num);font-size:var(--fs-lg);color:var(--muted);min-width:20px;text-align:center}
.match-t{flex:1;font-weight:700;letter-spacing:-.02em;text-align:right}
.match-t.r{text-align:left}
.match-t.me{color:var(--gold)}
.match-vs{font-family:var(--num);font-size:var(--fs-sm);color:var(--gold);border:1px solid var(--gold);
  border-radius:var(--r-sm);padding:2px 8px;letter-spacing:.08em}
.match-row.bye .match-t{text-align:left}
.match-row.bye .match-vs{color:var(--muted);border-color:var(--line2)}
@keyframes matchIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* 모바일 라이브 화면 — 팀장이 폰으로 입찰하는 상황이 기본값입니다.
   타이머는 스크롤해도 보이게 상단 고정, 입찰 패드는 엄지 크기, 사진은 줄여 패드가 첫 화면에 들어오게. */
@media(max-width:640px){
  .lot-img{max-height:190px}   /* 16:9 카드가 폰 폭에서 약 184px — 잘리지 않으면서 입찰 패드가 첫 화면에 남게 */
  .clock{position:sticky;top:0;z-index:5;background:var(--panel);padding:8px 0;margin-bottom:10px}
  .bidpad button{min-height:52px}
  .custom input{min-height:48px}
  .custom .btn{min-height:48px}
}
@media(max-width:900px){.stage{grid-template-columns:1fr}body{padding:12px}}
/* 설정 화면은 1100px 아래에서 1열로 둔다. 900px에서 2열로 갈리면 왼쪽 열이 417px로 좁아져
   규칙 카드의 줄 수가 늘고, 창을 넓혔는데 입력칸이 오히려 화면 밖으로 나간다. */
@media(max-width:1100px){.setup{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script>
const LINES=['TOP','JGL','MID','ADC','SUP'];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// CSS 변수 → JS. 색·치수의 단일 소스는 :root 토큰이다(캔버스 결과 이미지 포함).
const cssVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* 티어 색·순위, 등급 뱃지 — 목록에서 실력대를 한눈에 보게 합니다.
   각 티어는 한글·영문·흔한 약어/오탈자 키워드로 인식하고, 숫자는:
   마스터~챌린저는 LP(클수록 상위), 그 외는 단수(작을수록 상위)로 정렬에 반영. */
const TIERS=[
  {k:['챌린저','챌','challenger','chall'],c:'#e6c14a',apex:1},
  {k:['그랜드마스터','그마','grandmaster'],c:'#e0554f',apex:1},   // 'gm'은 아래 /^gm/ 앵커로만(부분일치 오탐 방지)
  {k:['마스터','master','마스타'],c:'#b06fe0',apex:1},
  {k:['다이아몬드','다이아','다야','diamond','dia'],c:'#4aa3e0'},
  {k:['에메랄드','에메','emerald','emer'],c:'#2fae5f'},
  {k:['플래티넘','플래','플랫','플레','platinum','plat'],c:'#3fb6a6'},
  {k:['골드','gold'],c:'#e0b04a'},
  {k:['실버','silver'],c:'#9fb0c0'},
  {k:['브론즈','bronze'],c:'#b07b4a'},
  {k:['아이언','iron'],c:'#8a8f96'}
];
const tierColor=t=>{ const i=tierIdx(t); return i<0?'':TIERS[i].c; };
// 축약형 첫 글자 → TIERS 인덱스 (GM은 별도 처리). 예: M7·G3·S4·D1·C·E2
const TIER_ABBR={c:0,m:2,d:3,e:4,p:5,g:6,s:7,b:8,i:9};
const tierIdx=t=>{
  const s=String(t||'').trim().toLowerCase();
  if(!s) return -1;
  for(let i=0;i<TIERS.length;i++) if(TIERS[i].k.some(k=>s.includes(k))) return i;  // 한글·영문 전체 표기
  if(/^gm/.test(s)) return 1;                                                       // 그랜드마스터
  return (s[0] in TIER_ABBR) ? TIER_ABBR[s[0]] : -1;                                // 축약형(M7/G3/S4…)
};
// 티어순 정렬용 순위(높을수록 상위). 마스터~챌린저는 LP(축약형 한 자리는 100단위=M7→700),
// 그 외는 단수(작을수록 상위). 오직 정렬에만 쓰이고 화면 색은 쓰지 않음.
function tierRank(t){
  const i=tierIdx(t); if(i<0) return -1;
  const base=(TIERS.length-i)*1000;
  const n=parseInt((String(t).match(/\d+/)||[])[0]);
  if(!Number.isFinite(n)) return base;
  if(!TIERS[i].apex) return base - Math.min(n,9);
  return base + Math.min(n<10 ? n*100 : n, 999);   // M7=700, 마스터700=700, M100=100
}
// 등급 구간 색 — 롤 티어색(1~1.9 챌린저 … 5~5.9 에메랄드). 없으면 빈값.
// 색 인덱스는 정수부-1 (등급 1→색0=챌린저 … 5→색4=에메).
const GRADE_COLORS=[0,1,2,3,4].map(i=>cssVar('--grade'+i));
const gradeBand=g=>{ const n=Number(g); return (g==null||g===''||!Number.isFinite(n)||n<1)?-1:Math.min(4,Math.floor(n)-1); };
const gradeColor=g=>{ const b=gradeBand(g); return b<0?'':GRADE_COLORS[b]; };
// 등급: 1~5 정수 + 소수점 첫째자리(예 1.2, 3.4). 색은 정수부 구간, 숫자는 소수까지 표시.
function gradeBadge(g){
  const b=gradeBand(g); if(b<0) return '';
  return `<span class="gr gr${b}">${Math.round(Number(g)*10)/10}</span>`;
}

let actx;
const SFX_MAX=2.5;   // 연출음 음량 상한(슬라이더 100%). 리미터가 있어 이 위로는 커져도 의미가 없습니다.
/* 연출음(낙찰·입찰·초읽기) 음량. 1.0이 원래 크기입니다.
   개별 소리마다 곱하지 않고 믹서 노드 하나를 거칩니다 — 그래야 슬라이더를 움직인 순간
   이미 예약된 소리까지 같이 바뀌고, 값을 흩뿌리지 않아도 됩니다. */
let sfxVol=(()=>{ try{ const v=parseFloat(localStorage.getItem('sfxVol')); return v>=0&&v<=SFX_MAX?v:1.4; }catch{ return 1.4; } })();
let sfxBusNode=null, sfxLimiter=null;
/* 연출음이 모두 지나가는 지점. 낙찰음은 네 음이 겹쳐서 나기 때문에 음량을 올리면
   합이 1을 넘어 찢어집니다. 리미터를 뒤에 달아 그 지점을 눌러줍니다. */
function sfxBus(){
  if(!sfxBusNode){
    sfxBusNode=actx.createGain();
    sfxBusNode.gain.value=sfxVol;
    sfxLimiter=actx.createDynamicsCompressor();
    sfxLimiter.threshold.value=-3; sfxLimiter.knee.value=0; sfxLimiter.ratio.value=20;
    sfxLimiter.attack.value=.002; sfxLimiter.release.value=.12;
    sfxBusNode.connect(sfxLimiter); sfxLimiter.connect(actx.destination);
  }
  return sfxBusNode;
}
function sfxSetVol(v){
  sfxVol=Math.min(SFX_MAX,Math.max(0,v));
  if(sfxBusNode) sfxBusNode.gain.value=sfxVol;
  try{ localStorage.setItem('sfxVol',String(sfxVol)); }catch{}
  sfxPreview();
}
let sfxPreviewT=null;
/* 브금과 달리 연출음은 낙찰이 나야 들립니다. 맞추는 동안 들려줄 게 필요해서
   슬라이더를 움직이면 실제 낙찰음을 그대로 들려줍니다(연타는 마지막 것만). */
function sfxPreview(){
  if(sfxMuted||!me||me.role!=='host') return;
  clearTimeout(sfxPreviewT);
  // tone()은 컨텍스트가 running이 아니면 예약을 건너뜁니다. resume()을 기다렸다가 울려야
  // 페이지를 연 직후 슬라이더를 만졌을 때 아무 소리도 안 나는 일이 없습니다.
  sfxPreviewT=setTimeout(()=>{
    try{
      actx=actx||new (window.AudioContext||window.webkitAudioContext)();
      actx.state==='running'?soldChime():actx.resume().then(soldChime).catch(()=>{});
    }catch{}
  },140);
}
function beep(){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();   // 사용자 제스처 전이라 멈춰 있으면 깨웁니다
    const o=actx.createOscillator(), g=actx.createGain();
    o.connect(g); g.connect(sfxBus());
    o.frequency.value=880; g.gain.setValueAtTime(.06,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+.16);
    o.start(); o.stop(actx.currentTime+.17);
  }catch{}
}
// 파일 없이 WebAudio로 합성하는 연출음(무료·무의존).
function tone(freq,delay,dur,vol=.08,type='sine'){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
    if(actx.state!=='running') return;   // 사용자 제스처 전이면 예약하지 않음(리로드 후 밀린 소리가 한꺼번에 터지는 것 방지)
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type; o.frequency.value=freq; o.connect(g); g.connect(sfxBus());
    const t=actx.currentTime+delay;
    g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.start(t); o.stop(t+dur+.02);
  }catch{}
}
function soldChime(){ try{ [523.25,659.25,783.99].forEach((f,i)=>tone(f,i*0.09,.2,.09,'triangle')); tone(1046.5,.27,.34,.07); }catch{} }
/* 유찰음. 낙찰음(밝은 triangle 3화음이 위로 올라감)과 일부러 반대로 갑니다 —
   낮은 음역, 부드러운 sine, 아래로 내려오는 완전5도, 그리고 더 조용하게.
   3음(장·단조를 가르는 음)을 안 써서 브금이 어떤 조성이든 부딪히지 않습니다.
   '실패'가 아니라 '아무 일도 없었음'으로 들려야 해서 짧고 눌러진 소리로 잡았습니다. */
function passSound(){ try{ tone(220,0,.18,.06,'sine'); tone(146.83,.10,.34,.055,'sine'); }catch{} }

/* ═══ 배경음악 ═══
   진행자 화면에서만 틉니다 — 팀장마다 각자 재생하면 서로 어긋난 소리가 여러 개 겹칩니다.
   진행자가 화면·소리를 공유하는 구조라 한 곳에서만 나는 편이 맞습니다.
   🔊 버튼(sfxMuted)이 연출음과 브금을 함께 관장합니다. */
let bgm=null;
let bgmOn=false;   // '지금 브금이 켜져 있어야 하는' 상태. 음소거와는 별개로 기억합니다.
/* 적당한 음량은 스피커·헤드셋·방송 송출 여부에 따라 사람마다 다릅니다.
   기본값을 잘 고르는 것으로는 해결되지 않아서 진행자가 직접 맞추게 합니다.
   브라우저별로 기억하므로 다음 경매 때 다시 맞출 필요가 없습니다.

   슬라이더는 선형이 아니라 제곱 곡선입니다. 사람 귀는 음량을 로그에 가깝게 느껴서
   선형으로 두면 위쪽 절반이 전부 '크다'로 뭉치고, 정작 브금이 앉아야 할 낮은 음량대가
   슬라이더 맨 왼쪽 몇 픽셀에 눌려버립니다. 제곱을 태우면 그 구간이 넓게 펴집니다.
   BGM_MAX는 100%일 때의 실제 음량 — 브금은 말소리·연출음 아래에 깔려야 하므로
   1.0까지 열어둘 이유가 없습니다. */
const BGM_MAX=.6;
const bgmSliderToVol=n=>Math.pow(Math.min(100,Math.max(0,n))/100,2)*BGM_MAX;
const bgmVolToSlider=v=>Math.round(Math.sqrt(Math.min(BGM_MAX,Math.max(0,v))/BGM_MAX)*100);
let bgmVol=(()=>{ try{ const v=parseFloat(localStorage.getItem('bgmVol')); return v>=0?Math.min(BGM_MAX,v):.12; }catch{ return .12; } })();
function bgmEl(){
  if(!bgm){
    bgm=new Audio('/bgm.mp3');
    bgm.loop=true;      // 끝까지 가면 처음부터 다시 — 경매·드래프트가 끝날 때까지 끊기지 않게
    bgm.preload='auto';
  }
  bgm.volume=bgmVol;
  return bgm;
}
let bgmPreviewT=null;
/* 시작 전에는 브금이 안 나오니 슬라이더를 움직여도 들리는 게 없습니다.
   안 들리는 소리는 맞출 수가 없어서, 멈춰 있을 때 움직이면 잠깐 들려줍니다. */
function bgmPreview(){
  if(bgmOn||sfxMuted||!me||me.role!=='host') return;   // 진행 중이면 이미 들리므로 불필요

}
function bgmSetVol(v){
  bgmVol=Math.min(BGM_MAX,Math.max(0,v));

}
function bgmSync(){
  if(bgmOn&&sfxOn()){
    bgmEl().play().catch(()=>{
      // 자동재생 차단(새로고침 직후 등) — 다음 클릭 한 번에 다시 시도합니다.
      document.addEventListener('click',bgmSync,{once:true});

function bgmStart(){ bgmOn=true; bgmSync(); }
function bgmStop(){ bgmOn=false; if(bgm){ bgm.pause(); bgm.currentTime=0; } }
/* 브금은 진행 상태를 따라갑니다 — 진행 중(live)이면 켜고, 대기·완료면 끕니다.
   시작 버튼이 클릭 흐름 안에서 이미 bgmStart를 부르므로 여기서는 없을 때만 켭니다
   (자동재생 차단을 피하려면 첫 재생이 클릭 안에서 일어나야 합니다).
   한 곳에 모아둬야 초기화·되돌리기·완료·재접속이 전부 같은 규칙을 따릅니다. */
function bgmFollowPhase(){
  if(!S||!me||me.role!=='host') return;
  if(S.phase==='live'&&S.mode!=='random'){ if(!bgmOn) bgmStart(); }

/* ═══ 파생 ═══ */
const myTeam=()=>me&&me.teamId?S.teams.find(t=>t.id===me.teamId):null;

const teamName=id=>{ const t=S.teams.find(x=>x.id===id); return t?t.name:id; };
const remaining=()=>S?S.pool.filter(p=>p.status!=='sold'):[];

const allDone=()=>!!S&&(S.phase==='done'||!remaining().length||S.teams.every(t=>t.open<=0));
// 드래프트: 팀이 이미 채운 티어 밴드 집합(팀장 등급 + 지명한 선수). 서버 teamBands와 동일 규칙.
function teamBandsClient(t){
  const s=new Set(); const lb=gradeBand(t.grade); if(lb>=0)s.add(lb);

// 점수 드래프트인가.

const roomHas=(rule)=>{
  const d=S&&S.draft; if(!d) return false;
  return Array.isArray(d.rules)?d.rules.includes(rule):d.balance===rule;
};
const scoreMode=()=>!!S&&S.mode==='draft'&&roomHas('score');
const tierMode=()=>!!S&&S.mode==='draft'&&roomHas('tier');
// 규칙 조합 이름. 둘 다면 '클랜티어 균형 + 클랜점수', 없으면 '자유'.
const rulesLabel=d=>{
  const on=[];
  if(Array.isArray(d.rules)){ if(d.rules.includes('tier'))on.push('클랜티어 균형'); if(d.rules.includes('score'))on.push('클랜점수'); }
  else if(d.balance==='tier') on.push('클랜티어 균형');
  else if(d.balance==='score') on.push('클랜점수');
