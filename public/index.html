  });
  $('bCreate').onclick=createRoom;
}

function drawLeaders(){
  // 값 칸은 켠 규칙에 따라 달라집니다. 경매는 시작 P, 드래프트는 클랜티어·클랜점수(둘 다 켜면 둘 다).
  const draft=gameMode==='draft';
  const cols=draft?[draftRules.tier&&'grade',draftRules.score&&'score'].filter(Boolean):['points'];
  const HEAD={grade:'클랜티어',score:'클랜점수',points:'시작 P'};
  // 좁은 화면에서는 헤더가 숨으므로 placeholder가 이름까지 알려줘야 합니다.
  // 넓은 화면에서는 칸이 좁아 잘리지만, 값을 넣으면 사라지고 위에 헤더가 있어 문제되지 않습니다.
  const PH={grade:'클랜티어 1~5',score:'클랜점수 0~999',points:'기본'};
  const ARIA={grade:'클랜티어(1~5)',score:'클랜점수(0~999)',points:'시작 포인트'};
  // 값 칸이 0개면 .none, 2개면 .two — 셀 수와 열 수를 맞춥니다.
  const two=cols.length>1?' two':cols.length?'':' none';
  const hcell=t=>`<span style="font-size:var(--fs-2xs);color:var(--muted);font-weight:600">${t}</span>`;
  $('leaderList').innerHTML=`<div class="leader-row${two}" style="margin-bottom:4px">`
    +`<span style="font-size:var(--fs-2xs);color:var(--muted);font-weight:600;letter-spacing:.06em">닉네임</span>`
    +hcell('라인')+cols.map(c=>hcell(HEAD[c])).join('')+'<span></span></div>'
    +leaders.map((l,i)=>`
    <div class="leader-row${two}">
      <input type="text" placeholder="팀장 ${i+1} 닉네임" value="${esc(l.name)}" data-i="${i}" data-f="name">
      <select data-i="${i}" data-f="line" aria-label="팀장 ${i+1} 라인">
        ${['',...LINES].map(v=>`<option value="${v}" ${v===l.line?'selected':''}>${v||'라인'}</option>`).join('')}
      </select>
      ${cols.map(c=>{
        if(c==='points') return `<input type="number" min="0" placeholder="${PH[c]}" value="${l.points??''}" data-i="${i}" data-f="points" aria-label="팀장 ${i+1} ${ARIA[c]}" onwheel="this.blur()">`;
        // 필수값이 비어 있으면 칸을 빨갛게 — 어느 팀장이 빠졌는지 바로 보이게 합니다.
        const bad=!(REQ.find(r=>r.key===c)||{ok:()=>true}).ok(l[c]);
        return `<input type="text" placeholder="${PH[c]}" value="${esc(l[c]??'')}" data-i="${i}" data-f="${c}" aria-label="팀장 ${i+1} ${ARIA[c]}" style="text-align:center${bad?';border-color:var(--danger)':''}">`;
      }).join('')}
      <button data-del="${i}" title="삭제" aria-label="팀장 ${i+1} 삭제">&times;</button>
    </div>`).join('');
  $('leaderList').querySelectorAll('[data-f]').forEach(el=>{
    el.oninput=el.onchange=()=>{
      const i=+el.dataset.i, f=el.dataset.f;
      leaders[i][f]= f==='points' ? (el.value===''?null:Math.max(0,+el.value)) : el.value;
      // 이 칸의 빨간 테두리는 여기서 직접 갱신합니다. drawTierReq는 팀장 행을 다시 그리지 않습니다.
      const r=REQ.find(x=>x.key===f);
      if(r) el.style.borderColor=r.ok(el.value)?'':'var(--danger)';
      drawTierReq();   // 어느 칸을 고쳐도 확인 패널·만들기 버튼 갱신
    };
  });
  $('leaderList').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    if(leaders.length<=2) return toast('팀장은 2명 이상이어야 합니다',true);
    leaders.splice(+b.dataset.del,1); drawLeaders();
  });
  drawTierReq();
}

// Object.create(null): 'constructor'·'toString' 같은 상속 속성이 오탐되지 않게 합니다.
const POSMAP=Object.assign(Object.create(null),{
  TOP:'TOP','탑':'TOP','탑라인':'TOP','토프':'TOP',
  JGL:'JGL',JG:'JGL',JUG:'JGL',JUNGLE:'JGL','정글':'JGL','정글러':'JGL','정글링':'JGL',
  MID:'MID','미드':'MID','미드라이너':'MID','미들':'MID',
  ADC:'ADC',AD:'ADC',BOT:'ADC',BOTTOM:'ADC',ADCARRY:'ADC','원딜':'ADC','봇':'ADC','바텀':'ADC','딜러':'ADC',
  SUP:'SUP',SUPP:'SUP',SPT:'SUP',SUPPORT:'SUP','서폿':'SUP','서포터':'SUP','서포트':'SUP','폿':'SUP','서폿터':'SUP'});
const norm=v=>{
  const t=String(v??'').trim();
  return POSMAP[t.toUpperCase()]||POSMAP[t]||'';
};
// 부포지션: 5라인 + '전체/all'(→'ALL')까지 허용. 메인 포지션은 norm(5라인만) 사용.
const normSub=v=>{ const t=String(v??'').trim(); return /^(전체|올|올포|올라인|all)$/i.test(t)?'ALL':norm(t); };
const subLabel=s=>s==='ALL'?'전체':s;
const clean=v=>String(v??'').trim().replace(/\s+/g,' ').slice(0,24);
// 실력 등급: 1~5 정수 + 소수점 첫째자리(예 1.2·3.4). 범위 밖·두 자리 소수는 인정 안 함.
const gnum=v=>{ const m=String(v??'').trim().match(/^([1-5](?:\.\d)?)\s*(?:티어|t)?$/i); return m?m[1]:''; };
// 점수 드래프트용 점수: 0~999 정수만. 소수는 인정 안 함(서버 parseScore와 동일 규칙).
const snum=v=>{ const m=String(v??'').trim().match(/^(\d{1,3})\s*(?:점|p)?$/i); return m?m[1]:''; };
// 엑셀 수식 오류값. VLOOKUP이 실패한 칸을 SheetJS가 t:'e'가 아니라 "#N/A" '문자열'로 캐시해
// 넘겨주기 때문에, 거르지 않으면 값 검증이 없는 칸(솔랭티어·주챔프)에 "#N/A"가 그대로 실립니다.
// gnum·snum·norm을 거치는 칸은 원래도 걸러졌으니, 실제로 달라지는 건 그 두 종류입니다.
const XLERR=/^#(N\/A|REF!|VALUE!|DIV\/0!|NAME\?|NULL!|NUM!|SPILL!|CALC!|FIELD!|BLOCKED!|CONNECT!|UNKNOWN!|BUSY!|EXTERNAL!|PYTHON!|GETTING_DATA)$/i;
// 아이디(닉네임#태그) 분리 → {name, tag}. 첫 # 기준, 태그는 12자·내부 # 제거(서버와 동일).
function splitId(id){
  const s=String(id??'').trim();
  const h=s.indexOf('#');
  if(h<0) return {name:clean(s), tag:''};
  return {name:clean(s.slice(0,h)), tag:clean(s.slice(h+1)).replace(/#/g,'').slice(0,12)};
}

/* 엑셀/CSV 읽기 — 열 순서가 바뀌어도 제목으로 찾습니다. 아이디=닉네임#태그. */
function readSheet(rows){
  const want={아이디:'id',ID:'id',id:'id',
              솔랭티어:'tier','솔랭 티어':'tier',티어:'tier',
              클랜티어:'grade','클랜 티어':'grade',등급:'grade',티어등급:'grade','실력 등급':'grade',실력등급:'grade',
              클랜점수:'score','클랜 점수':'score',점수:'score','실력 점수':'score',실력점수:'score',스코어:'score',
              주포지션:'line',부포지션:'sub',
              주챔프1:'c1',주챔프2:'c2',주챔프3:'c3',
              한마디:'msg',하고싶은말:'msg',한줄소개:'msg',각오:'msg'};
  // 제목 칸의 공백을 모두 지우고 대조합니다. want의 띄어쓰기 있는 열쇠('솔랭 티어' 등)는 모두
  // 붙여 쓴 짝이 함께 있어서, 이러면 전각 공백('아이디　')·중간 공백 변형이 한꺼번에 걸립니다.
  const hkey=c=>String(c??'').replace(/\s+/g,'');
  // 판정 기준을 want 맵 하나로 통일합니다. 예전엔 '아이디'만 헤더로 쳐서, want가 인정하는
  // 'ID'·'id' 제목은 표에 있어도 이 단계에서 탈락했습니다.
  // 다만 '아이디 열만 잡히면 헤더'로 두면 안 됩니다. 진짜 표 위에 안내용 'ID' 한 칸이 떠 있는
  // 파일에서 그 행이 헤더로 확정돼 나머지 열이 통째로 날아가고, 예외도 없이 조용히 잘못 읽힙니다.
  // 그래서 첫 일치에서 끊지 않고 15행을 다 본 뒤 '가장 많이 맞아떨어진 행'을 고릅니다.
  let h=-1, map={}, best=0;
  for(let i=0;i<Math.min(rows.length,15);i++){
    const cells=(rows[i]||[]).map(hkey);
    const m={};
    cells.forEach((c,j)=>{ if(want[c] && m[want[c]]==null) m[want[c]]=j; });   // 중복 헤더는 먼저 나온 열 우선
    const n=Object.keys(m).length;
    if(m.id!=null && n>best){ h=i; map=m; best=n; }   // 동점이면 먼저 나온 행을 지킵니다
  }
  if(h<0) throw new Error('"아이디" 열이 없습니다. 참가자 명단이 든 시트가 맞는지, 최신 양식(양식 다운로드)인지 확인해주세요.');

  const out=[];
  for(let i=h+1;i<rows.length;i++){
    const r=rows[i]||[];
    const at=k=>{ const v=map[k]==null?'':clean(r[map[k]]); return XLERR.test(v)?'':v; };
    const idRaw=map['id']==null?'':String(r[map['id']]??'').trim();
    // 오류값은 '#'로 시작해 splitId가 어차피 빈 이름을 주지만, 의도를 드러내려고 여기서 먼저 끊습니다.
    if(!idRaw||idRaw.startsWith('(예시)')||XLERR.test(idRaw)) continue;
    const {name,tag}=splitId(idRaw);
    if(!name) continue;
    out.push({
      name, tag,
      tier:at('tier'), grade:gnum(at('grade')), score:snum(at('score')),
      line:norm(at('line')), sub:normSub(at('sub')),
      champs:[at('c1'),at('c2'),at('c3')].filter(Boolean),
      msg:at('msg').slice(0,20)
    });
  }
  return out;
}

// SheetJS는 용량이 커서, 엑셀을 실제로 읽을 때만 지연 로드합니다(관전자·팀장에겐 안 받음).
let xlsxLoading=null;
function loadXLSX(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  if(xlsxLoading) return xlsxLoading;
  xlsxLoading=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='/xlsx.full.min.js';
    s.onload=()=>res(window.XLSX);
    s.onerror=()=>{ xlsxLoading=null; rej(new Error('엑셀 처리 모듈을 불러오지 못했습니다')); };
    document.head.appendChild(s);
  });
  return xlsxLoading;
}

async function loadFile(f){
  try{
    const XLSX=await loadXLSX();
    const buf=await f.arrayBuffer();
    // cellHTML은 서식 있는 글자를 HTML로 바꾸는 기능인데, 값만 읽는 우리에겐 쓸모가 없습니다.
    // 켜두면 한컴 한셀이 남긴 전용 태그에서 파싱이 통째로 실패하므로 끕니다.
    // 이미지·손상된 파일은 여기서 SheetJS가 영어로 예외를 던집니다. 원인은 cause로 넘겨 콘솔에만 남깁니다.
    let wb;
    try{ wb=XLSX.read(buf,{type:'array',cellHTML:false}); }
    catch(e){ throw new Error('파일을 읽지 못했습니다. .xlsx·.xls·.csv 파일이 맞는지 확인해주세요.',{cause:e}); }
    const nm=wb.SheetNames.find(n=>n.includes('명단'))||wb.SheetNames[0];
    const ws=wb.Sheets[nm];
    // 실패 문구에 고른 시트 이름과 나머지 후보를 함께 답니다. 시트를 잘못 고른 실패가 "양식이
    // 구식"으로 읽히면, 멀쩡한 파일을 두고 엉뚱한 곳을 고치게 됩니다.
    const other=wb.SheetNames.filter(n=>n!==nm);
    const hint=other.length?`\n이 파일의 다른 시트: ${other.join(' / ')}`:'';
    // sheet_to_json은 시트가 없어도 조용히 빈 배열을 주기 때문에, 여기서 먼저 갈라놓지 않으면
    // "파일을 못 읽음"이 아래쪽 "아이디 열 없음" 문구로 뭉개집니다.
    if(!ws) throw new Error(`'${nm}' 시트의 내용을 읽지 못했습니다. 엑셀이나 구글 시트에서 열어 다시 저장해주세요.${hint}`);
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,blankrows:false,defval:''});
    if(!rows.length) throw new Error(`'${nm}' 시트가 비어 있습니다.${hint}`);
    let list;
    try{ list=readSheet(rows); }
    catch(e){ throw new Error(`'${nm}' 시트 — ${e.message}${hint}`,{cause:e}); }
    if(!list.length) throw new Error(`'${nm}' 시트에서 읽을 수 있는 참가자를 찾지 못했습니다. 예시 행 아래에 입력했는지 확인해주세요.${hint}`);
    players=list; drawPlayers();
    toast(`${nm} 시트에서 ${list.length}명을 불러왔습니다`);
  }catch(e){ console.warn('[명단 불러오기]',e); toast(e.message,true); }
}

/* 직접 입력: 아이디(닉네임#태그), 솔랭티어, 클랜티어, 주포, 부포, 주챔프1~3, 클랜점수 */
function addText(){
  let suspect=0;   // 옛 형식(닉네임,태그,주포…)으로 보이는 줄
  const add=$('cPool').value.split('\n').map(x=>x.trim()).filter(Boolean).map(raw=>{
    const p=raw.split(',').map(x=>x.trim());
    const {name,tag}=splitId(p[0]);
    // 2번째 칸(솔랭티어 자리)이 티어가 아닌데 3번째 칸이 포지션이면 옛 순서 붙여넣기로 의심.
    if(p[1] && tierIdx(p[1])<0 && !gnum(p[1]) && norm(p[2])) suspect++;
    return {
      name, tag,
      tier:clean(p[1]),
      grade:gnum(p[2]),
      line:norm(p[3]),
      sub:normSub(p[4]),
      champs:[p[5],p[6],p[7]].map(clean).filter(Boolean),
      score:snum(p[8]),
      // 한마디는 마지막 칸이라, 쉼표가 들어 있어도 남은 칸을 다시 합쳐 살립니다.
      // p는 칸마다 trim돼 쉼표 뒤 공백이 사라지므로, 원문(raw)에서 다시 잘라 씁니다.
      msg:clean(raw.split(',').slice(9).join(',')).slice(0,20)
    };
  }).filter(p=>p.name);
  if(!add.length) return toast('추가할 내용이 없습니다',true);
  players=players.concat(add); $('cPool').value=''; poolText=''; drawPlayers();
  if(suspect) toast(`${add.length}명 추가 — 다만 ${suspect}줄이 옛 순서처럼 보입니다. 새 순서(아이디, 솔랭티어, 클랜티어, 주포…)인지 확인하세요.`,true);
  else toast(`${add.length}명을 추가했습니다`);
}

/* 켠 규칙이 요구하는 값 — 설정 화면 전체가 이 목록 하나를 기준으로 판단합니다. */
// shown: 그 값이 이미 다른 곳에 표시되는가. 클랜티어는 색 뱃지(gradeBadge)가 보여주므로
// 마커에서 값을 또 찍지 않고 '없음'만 알립니다. 클랜점수는 마커가 유일한 표시 자리입니다.
const REQ=[
  { key:'grade', rule:'tier',  name:'클랜티어', shown:true,  ok:v=>!!gnum(v) },
  { key:'score', rule:'score', name:'클랜점수', shown:false, ok:v=>!!snum(v) },
];
const activeReq=()=>gameMode==='draft'?REQ.filter(r=>draftRules[r.rule]):[];
// 참가자 행에 붙는 마커. 값이 없으면 빨갛게 알리고, 있으면 그 값을 다른 데서 보여주지 않는 것만 찍습니다.
function reqMark(o){
  return activeReq().map(r=>{
    if(!r.ok(o[r.key])) return `<b style="color:var(--danger)">${r.name} 없음</b> `;
    return r.shown?'':`<b style="color:var(--gold)">${esc(o[r.key])}점</b> `;
  }).join('');
}
// 규칙별 누락 인원. { 클랜티어:{leaders:n,players:n}, ... }
function missingByReq(){
  const names=leaders.filter(l=>l.name.trim());
  const out={};
  activeReq().forEach(r=>{
    out[r.name]={ leaders:names.filter(l=>!r.ok(l[r.key])).length,
                  players:players.filter(p=>!r.ok(p[r.key])).length };
  });
  return out;
}
// 방을 만들 수 없는 이유(없으면 빈 배열). 만들기 버튼과 경고 패널이 함께 씁니다.
function blockers(){
  const out=[];
  const names=leaders.filter(l=>l.name.trim());
  if(names.length<2) out.push('팀장을 2명 이상 입력하세요');
  if(names.length>TEAM_MAX) out.push(`팀장은 최대 ${TEAM_MAX}명까지입니다`);
  if(!players.length) out.push('참가자 명단을 먼저 불러오세요');
  // 드래프트는 전원이 정원을 채워야 끝나므로 매물 수가 모자라면 만들 수 없습니다.
  // 경매는 자리가 빈 채로 끝날 수 있어 이 조건을 걸지 않습니다(서버도 드래프트만 검사).
  const picks=TEAM_SIZE-1;
  if(gameMode==='draft'&&names.length&&players.length&&players.length<names.length*picks){
    out.push(`매물이 부족합니다 (필요 ${names.length*picks}명, 현재 ${players.length}명)`);
  }
  const miss=missingByReq();
  Object.entries(miss).forEach(([n,m])=>{
    if(m.leaders) out.push(`팀장 ${m.leaders}명의 ${n}이 비어 있습니다`);
    if(m.players) out.push(`참가자 ${m.players}명의 ${n}이 비어 있습니다`);
  });
  return out;
}

function drawPlayers(){
  const seen={}, dup=new Set();
  players.forEach(p=>{ const k=p.name+'#'+p.tag; if(seen[k]) dup.add(k); seen[k]=1; });

  $('plist').innerHTML=players.map((p,i)=>`
    <div class="prow ${dup.has(p.name+'#'+p.tag)?'dup':''}">
      <span class="nm">${esc(p.name)}${p.tag?` <i>#${esc(p.tag)}</i>`:''}</span>
      <span><span class="tag t-${p.line}">${esc(p.line)||'-'}</span></span>
      <span class="tr">${reqMark(p)}${gradeBadge(p.grade)} ${p.sub?esc(subLabel(p.sub))+' · ':''}${esc(p.tier)||'솔랭 미상'}</span>
      <span class="ch">${p.champs.map(esc).join(' · ')}${p.msg?`${p.champs.length?' · ':''}<i style="color:var(--muted)">“${esc(p.msg)}”</i>`:''}</span>
      <button data-rm="${i}" title="삭제" aria-label="${esc(p.name)} 삭제">&times;</button>
    </div>`).join('');

  const byLine=LINES.map(l=>`${l} ${players.filter(p=>p.line===l).length}`).join(' · ');
  const noLine=players.filter(p=>!p.line).length;
  $('psum').innerHTML=players.length
    ? `<b>${players.length}</b><span class="hint">명 · ${byLine}${noLine?` · 미지정 ${noLine}`:''}</span>
       ${dup.size?`<span class="hint" style="color:var(--danger)">중복 ${dup.size}건</span>`:''}
       <button class="btn ghost" id="bWipe" style="margin-left:auto;padding:5px 11px;font-size:var(--fs-xs)">전체 비우기</button>`
    : '<span class="hint">아직 참가자가 없습니다</span>';

  $('plist').querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.rm, p=players[i];
    players.splice(i,1); drawPlayers();
    toastUndo(`${p.name} 삭제됨`,()=>{ players.splice(Math.min(i,players.length),0,p); drawPlayers(); });
  });
  const wipe=$('bWipe');
  // 비우기 전에 대기 중인 되돌리기 토스트를 닫습니다. 그대로 두면 비운 뒤 한 명이 되살아납니다.
  if(wipe) wipe.onclick=()=>askConfirm({title:'참가자 목록을 모두 지울까요?',msg:'불러온 명단이 전부 사라집니다.',confirmLabel:'비우기'}).then(ok=>{ if(ok){ clearTimeout(toastH); $('toast').className='toast'; players=[]; drawPlayers(); } });
  drawTierReq();
}

// 켠 규칙의 확인 패널을 모두 그립니다(둘 다 켜면 둘 다). 만들기 전에 부족한 게 다 보이게 하는 게 목적입니다.
function drawTierReq(){
  const box=$('tierReq');
  // 규칙 패널이 없어도(경매·자유) 막는 이유와 버튼 상태는 갱신해야 합니다.
  if(box) box.innerHTML=activeReq().map(r=>r.rule==='tier'?tierReqHtml():scoreReqHtml()).join('')+blockerHtml();
  syncCreateBtn();
}

// 클랜티어 균형: 밴드별 현재/필요 표 + 누락 인원(둘 다 시작을 막습니다).
function tierReqHtml(){
  const names=leaders.filter(l=>l.name.trim());
  const rows=[0,1,2,3,4].map(b=>{
    const need=names.filter(l=>gradeBand(gnum(l.grade))!==b).length;
    const have=players.filter(p=>gradeBand(p.grade)===b).length;
    return `<span class="treq ${have>=need?'':'bad'}">${b+1} <b>${have}</b>/${need}</span>`;
  }).join('');
  return `<div class="lbl" style="margin:14px 0 6px">클랜티어별 매물 (현재/필요)</div>
    <div class="treqrow">${rows}</div>`;
}

// 클랜점수: 팀장 점수로 정해지는 첫 라운드 예상 순서. 동점이면 시작하자마자 주사위 화면이라 미리 알립니다.
function scoreReqHtml(){
  const names=leaders.filter(l=>l.name.trim());
  const rows=names.map((l,i)=>({l,i,v:snum(l.score)})).filter(o=>o.v);
  // 서버 scoreOrder와 같은 규칙 — 총점(=아직 팀장 점수) 오름차순, 동점은 입력 순서.
  const order=rows.slice().sort((a,b)=>+a.v-+b.v||a.i-b.i)
    .map(({l,v},n)=>`<span class="ordchip"><i>${n+1}</i>${esc(l.name)}<b>${v}</b></span>`).join('');
  const seen={}, dup=new Set();
  rows.forEach(o=>{ if(seen[o.v]) dup.add(o.v); seen[o.v]=1; });
  return `<div class="lbl" style="margin:14px 0 6px">첫 라운드 지명 순서 (팀장 클랜점수 낮은 순)</div>
    <div class="treqrow">${order||'<span class="hint">팀장 클랜점수를 입력하면 순서가 표시됩니다</span>'}</div>
    ${dup.size?`<p class="hint" style="color:var(--gold);margin-top:7px">클랜점수가 같은 팀장이 있어(${[...dup].join('·')}점)
      <b>시작하면 바로 동점 정리 화면</b>이 뜹니다. 🎲 주사위나 '먼저' 지정으로 순서를 정한 뒤 진행됩니다.</p>`:''}`;
}

// 방을 못 만드는 이유를 모아 보여줍니다. 버튼을 누르기 전에 알 수 있어야 합니다.
function blockerHtml(){
  const b=blockers();
  if(!b.length) return '';
  return `<div class="blockbox"><b>${setupMode==='edit'?'저장할 수 없습니다':'방을 만들 수 없습니다'}</b>
    <ul>${b.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
}

// 만들기 버튼을 막고 이유를 옆에 적습니다.
function syncCreateBtn(){
  const btn=$('bCreate'); if(!btn) return;
  const b=blockers();
  btn.disabled=b.length>0;
  btn.title=b.length?b.join(' · '):'';
  const note=$('createNote');
  if(note) note.innerHTML=b.length
    ? `<span style="color:var(--danger)">${b.length}가지를 먼저 해결해야 합니다</span>`
    : setupMode==='edit'
    ? '저장하면 대기 화면으로 돌아갑니다. 명단이 유지된 팀의 링크는 그대로 유효하고, 팀장을 삭제하면 그 팀 링크는 무효화됩니다. 되돌리기 기록은 초기화됩니다.'
    : '만들고 나면 팀장별 접속 링크가 나옵니다. 설정은 이후 방 안의 <b>방 설정 수정</b>으로 시작 전에 바꿀 수 있습니다.';
}

async function createRoom(){
  syncRules();
  const names=leaders.filter(l=>l.name.trim());
  // 팀장 수·매물 수·필수값은 blockers()가 한곳에서 판단합니다(버튼·경고 패널과 같은 기준).
  const b=blockers();
  if(b.length){ drawTierReq(); return toast(b[0],true); }
  const clock=rules.clock;
  if(!(clock>=5&&clock<=300)) return toast('제한 시간은 5~300초여야 합니다',true);

  if(gameMode==='draft'){
    if(draftRules.tier){
      // 각 클랜티어 매물이 그 밴드를 지명해야 하는 팀 수만큼 있는지 확인(서버 검증과 동일).
      for(let i=0;i<5;i++){
        const need=names.filter(l=>gradeBand(gnum(l.grade))!==i).length;
        const have=players.filter(p=>gradeBand(p.grade)===i).length;
        if(have<need) return toast(`클랜티어 ${i+1} 매물이 부족합니다 (필요 ${need}명, 현재 ${have}명)`,true);
      }
    }
    // 드래프트는 포인트를 안 쓰므로 base/minBid는 서버 검증만 통과할 안전값으로 보냅니다.
    const ruleList=[draftRules.tier&&'tier',draftRules.score&&'score'].filter(Boolean);
    return submitRoom({ mode:'draft', rules:ruleList, title:rules.title.trim()||'드래프트', group:(rules.group||'').trim(),
      base:1000, minBid:10, clock, leaders:names, pool:players });
  }

  // 경매
  const base=rules.base, minBid=rules.minBid;
  if(!(base>=1)) return toast('기본 시작 포인트를 1 이상으로 입력하세요',true);
  if(!(minBid>=1&&minBid<=100000)) return toast('최소 입찰 단위는 1~100000이어야 합니다',true);
  const cfg={ mode:'auction', title:rules.title.trim()||'경매', group:(rules.group||'').trim(), base, minBid, clock,
    order:rules.order==='draw'?'draw':'random', leaders:names, pool:players };
  const need=(TEAM_SIZE-1)*cfg.minBid;
  const poor=names.filter(l=>(l.points??cfg.base)<need);
  if(poor.length&&!await askConfirm({title:'시작 포인트가 부족합니다',msg:`${poor.map(l=>l.name).join(', ')}의 시작 포인트로는 ${TEAM_SIZE-1}자리를 채울 수 없습니다. 계속할까요?`,confirmLabel:'계속 만들기'})) return;
  return submitRoom(cfg);
}

async function submitRoom(cfg){
  // 수정 모드: 새 방을 만드는 대신 기존 방에 PATCH합니다. 방 코드·유지된 팀 링크는 그대로.
  if(setupMode==='edit'&&editCtx){
    const kept=new Set(cfg.leaders.map(l=>l.id).filter(Boolean));
    const removed=(S&&S.code===editCtx.code)?S.teams.filter(t=>!kept.has(t.id)):[];
    if(removed.length&&!await askConfirm({
      title:'팀 삭제를 포함한 저장',
      msg:`팀장 ${removed.map(t=>t.leader).join(', ')}이(가) 명단에서 빠졌습니다.\n해당 팀의 링크는 즉시 무효화됩니다.\n같은 이름으로 다시 추가해도 새 링크가 발급됩니다.`,
      confirmLabel:'저장'})) return;
    $('bCreate').disabled=true;
    try{
      const r=await fetch(`/api/room/${editCtx.code}?k=${encodeURIComponent(editCtx.hostKey)}`,
        {method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify(cfg)});
      const d=await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d.error||'저장하지 못했습니다');
      links=d;
      // 팀이 추가·삭제됐으면 새 링크를 바로 보여줍니다(기존 팀 링크는 변하지 않음).
      const teamChanged=removed.length>0||cfg.leaders.some(l=>!l.id);
      editing=false; editCtx=null;
      toast('설정을 저장했습니다');
      paint();   // 서버 broadcast(state)와 별개로 즉시 방 화면 복귀
      if(teamChanged) openLinksModal();
    }catch(e){ toast(e.message,true); const b=$('bCreate'); if(b) b.disabled=false; }
    return;
  }
  $('bCreate').disabled=true;
  try{
    let d;
    if(setupMode==='admin'){
      // 관리자 로그인으로 만든 방은 하루 생성 개수에 세지 않습니다.
      d=await api('/api/room',{method:'POST',body:JSON.stringify(cfg)});
    }else{
      // 누구나 로그인 없이 만듭니다. 한 곳에서 하루 개수 제한은 서버가 겁니다.
      const r=await fetch('/api/room',{method:'POST',headers:{'content-type':'application/json'},
        body:JSON.stringify(cfg)});
      d=await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d.error||'방을 만들지 못했습니다');
    }
    // 이 브라우저의 '내가 만든 방'에 적어둡니다. 진행자 키가 곧 이 방을 다시 여는 열쇠입니다.
    rememberRoom(d.code,d.hostKey,cfg.title,Date.now(),cfg.group);
    if(cfg.mode==='random') d.mode='random';
    links=d; renderLinks(d);
  }catch(e){ if(e.message!=='unauth'){ toast(e.message,true); const b=$('bCreate'); if(b) b.disabled=false; } }
}

/* ═══ 랜랜내 (랜덤랜덤내전) ═══
   라인마다 양쪽 챔피언을 슬롯머신으로 뽑습니다. 결과는 서버가 정하고(src/randpick.js),
   화면은 칸에 적힌 시작·정지 시각(at·stops)에 맞춰 슬롯을 돌리다 그 챔피언에서 멈춥니다.
   위치를 시각으로 계산하므로 화면을 다시 그려도, 중간에 들어와도 같은 자리에서 이어집니다. */
const RR_LANES=['TOP','JGL','MID','ADC','SUP'];
const RR_LANE_KR={TOP:'탑',JGL:'정글',MID:'미드',ADC:'원딜',SUP:'서폿'};
const RR_RANGE={base:.5,meta:1};
const RR_OPTS=[
  {k:'range',lbl:'챔피언 범위',opts:[['base','기본','그 라인 픽률 0.5% 이상'],['meta','메타픽','그 라인 픽률 1.0% 이상']]},
  {k:'dup',lbl:'중복',opts:[[true,'상대와 중복 가능','블라인드 픽으로 게임 생성'],[false,'상대편 챔피언과 중복 불가','10명 모두 다른 챔피언']]},
  {k:'pick',lbl:'뽑기 방식',opts:[['one','바로 확정','멈춘 챔피언으로 결정'],['three','3개 중 고르기','후보 3명 중 팀이 고름']]},
  {k:'rerolls',lbl:'리롤 (팀당 · 판마다)',opts:[0,1,2,3,4,5].map(n=>[n,n+'회',''])},
  {k:'fearless',lbl:'피어리스',opts:[[false,'끄기',''],[true,'켜기','지난 판에 쓴 챔피언은 양쪽 모두 금지']]}
];
const rrParse=(k,v)=>k==='dup'||k==='fearless'?v==='true':k==='rerolls'?+v:v;
let rrCfg={range:'base',dup:true,pick:'one',rerolls:1,fearless:false};   // 설정 화면 값
let rrTitle=null;   // 설정 화면 대회 이름. null이면 오늘 날짜 기본값을 씁니다.
const rrDefaultTitle=()=>{ const d=new Date(); return `랜랜내 ${d.getMonth()+1}/${d.getDate()}`; };

let RRD=null, rrDataP=null;   // 챔피언 데이터(/api/rr/data)
function rrLoad(){
  if(RRD) return Promise.resolve(RRD);
  if(!rrDataP) rrDataP=fetch('/api/rr/data').then(r=>{ if(!r.ok) throw new Error('data'); return r.json(); })
    .then(d=>{ RRD=d; return d; }).catch(e=>{ rrDataP=null; throw e; });
  return rrDataP;
}
const rrIcon=k=>RRD&&RRD.champs[k]?`https://ddragon.leagueoflegends.com/cdn/${RRD.ddragon}/img/champion/${RRD.champs[k].id}.png`:'';
const rrName=k=>RRD&&RRD.champs[k]?RRD.champs[k].name:'?';
const rrPool=(lane,range)=>RRD?RRD.lanes[lane].filter(x=>x[1]>=RR_RANGE[range]).map(x=>x[0]):[];
const rrNow=()=>Date.now()-skew;
const rrDone=c=>!!c.v&&rrNow()>=Math.max(...c.stops);
const rrOptLabel=(k,v)=>{ const o=RR_OPTS.find(x=>x.k===k); const f=o&&o.opts.find(x=>x[0]===v); return f?f[1]:String(v); };

function rrOptsHtml(c,dis){
  return RR_OPTS.map(o=>`<div class="rro"><span class="lbl">${o.lbl}</span><div class="seg${o.k==='rerolls'?' seg-n':''}">${

  }</div></div>`).join('');
}

function createRandomRoom(){
  rrSyncInputs();

  return submitRoom({mode:'random',title,group:(rules.group||'').trim(),rr:{...rrCfg}});

/* ── 방 화면 ── */
const RR_STRIP=30;   // 한 번 돌 때 지나가는 칸 수(마지막 칸이 결과)
function rrHash(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function rrRng(a){ return ()=>{ a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
/** 슬롯 띠. 같은 칸·같은 회차면 늘 같은 띠가 나와야 다시 그려도 그림이 튀지 않습니다. */
function rrStrip(lane,side,ri,cell,target){
  const pool=rrPool(lane,S.rr.range), rnd=rrRng(rrHash(`${S.code}|${S.game.n}|${lane}|${side}|${ri}|${cell.v}`));
  const out=[null];
  for(let i=1;i<RR_STRIP-1;i++) out.push(pool[Math.floor(rnd()*pool.length)]);
  out.push(target);
  return out;
}
const rrTile=k=>k==null?'<div class="q">?</div>':`<img src="${rrIcon(k)}" alt="" draggable="false">`;
function rrReel(lane,side,ri,cell,target,extra=''){
  if(!cell.v) return `<div class="reel${extra}"><div class="q">?</div></div>`;
  if(rrNow()>=cell.stops[ri]) return `<div class="reel${extra}">${rrTile(target)}</div>`;
  return `<div class="reel spin${extra}" data-rk="${lane}:${side}:${ri}"><div class="strip">${rrStrip(lane,side,ri,cell,target).map(rrTile).join('')}</div></div>`;
}
const rrMirror=lane=>{ const [a,b]=S.game.cells[lane]; return a.c!=null&&a.c===b.c&&rrDone(a)&&rrDone(b); };
function rrCell(lane,side){
  const g=S.game, c=g.cells[lane][side], host=me.role==='host', busy=rrNow()<g.busy, done=rrDone(c);
  const canRe=host&&done&&!busy&&g.rl[side]>0;
  if(S.rr.pick==='three'&&!c.cand){
    return `<div class="rrcell three"><div class="rr3">${'<div class="rrpick"><div class="reel"><div class="q">?</div></div><span class="rn">&nbsp;</span></div>'.repeat(3)}</div><div class="rrfoot"></div></div>`;
  }
  if(S.rr.pick==='three'&&c.cand){
    const choosing=host&&done&&c.c==null;
    const reels=c.cand.map((k,i)=>{
      const st=c.c==null?'':c.c===k?' chosen':' dim';
      const r=rrReel(lane,side,i,c,k,st);
      const nm=done?`<span class="rn">${esc(rrName(k))}</span>`:'<span class="rn">…</span>';
      return choosing?`<button type="button" class="rrpick" data-rch="${lane}:${side}:${k}" title="${esc(rrName(k))} 고르기">${r}${nm}</button>`:`<div class="rrpick">${r}${nm}</div>`;
    }).join('');
    return `<div class="rrcell three${c.c!=null?' set':''}">
      <div class="rr3">${reels}</div>
      <div class="rrfoot">${c.c!=null?`<b>${esc(rrName(c.c))}</b>`:done?'<span class="hint">'+(host?'고를 챔피언을 누르세요':'고르는 중…')+'</span>':''}
        ${canRe&&c.c==null?`<button class="rr-re" data-rre="${lane}:${side}">↻ 후보 다시</button>`:''}</div>
    </div>`;
  }
  const target=S.rr.pick==='three'?null:c.c;
  return `<div class="rrcell${done?' set':''}">
    ${rrReel(lane,side,0,c,target)}
    <div class="rrfoot">${done?`<b>${esc(rrName(c.c))}</b>`:c.v?'<span class="hint">…</span>':''}
      ${canRe&&c.c!=null?`<button class="rr-re" data-rre="${lane}:${side}">↻ 리롤</button>`:''}</div>
  </div>`;
}
function rrStage(){
  const g=S.game, host=me.role==='host', t=rrNow(), busy=t<g.busy, three=S.rr.pick==='three';
  const curLane=RR_LANES[g.lane];
  const pending=three&&g.lane<5&&g.cells[curLane].some(c=>c.cand&&c.c==null);
  const complete=RR_LANES.every(l=>g.cells[l].every(c=>c.c!=null&&rrDone(c)));
  // 도는 중이면 돌아가는 라인을, 아니면 다음에 돌릴 라인을 강조합니다.
  const spinL=new Set(RR_LANES.filter(l=>g.cells[l].some(c=>c.v&&!rrDone(c))));
  const isCur=(l,i)=>spinL.size?spinL.has(l):i===g.lane&&!complete;
  const spinLabel=busy?'🎰 돌아가는 중…':pending?'후보를 고르세요':`🎰 ${RR_LANE_KR[curLane]} 돌리기`;
  const meta=`<b>${g.n}판째</b> · ${rrOptLabel('range',S.rr.range)} · ${rrOptLabel('dup',S.rr.dup)} · ${rrOptLabel('pick',S.rr.pick)} · 리롤 ${S.rr.rerolls}회 · 피어리스 ${S.rr.fearless?'켜짐':'꺼짐'}`;
  const rlTag=s=>S.rr.rerolls?`<span class="rr-rl">리롤 <b>${g.rl[s]}</b>/${S.rr.rerolls}</span>`:'';
  let ctrl='';
  if(host){
    ctrl=`<div class="rr-ctrl">
      ${g.lane<5
        ?`<button class="btn gold rr-spin" id="rrSpin"${busy||pending?' disabled':''}>${spinLabel}</button>
          <button class="btn" id="rrAll"${busy||pending||g.auto?' disabled':''}>남은 라인 한 번에</button>`
        :`<button class="btn gold rr-spin" id="rrImg"${complete?'':' disabled'}>결과 이미지 저장</button>`}
      <button class="btn ghost" id="rrNew"${busy?' disabled':''}>새 판</button>
      <button class="btn ghost" id="rrListBtn">📋 챔피언 목록</button>
      <button class="btn ghost" id="rrCfgBtn">⚙ 설정</button>
    </div>
    ${pending?'<p class="hint rr-note">양쪽 모두 후보 중에서 고르면 다음 라인으로 넘어갑니다.'+(g.auto?' (한 번에 돌리기 중)':'')+'</p>':''}`;
  } else {
    ctrl=`<div class="rr-ctrl">${complete?'<button class="btn gold rr-spin" id="rrImg">결과 이미지 저장</button>':`<span class="hint">${busy?'돌아가는 중…':g.lane<5?'진행자가 돌릴 차례를 기다리는 중입니다':''}</span>`}</div>`;
  }
  const fear=S.rr.fearless?`<div class="panel sub rr-fear">
      <div class="rr-fear-hd"><span class="lbl" style="margin:0">피어리스 · 사용된 챔피언 ${S.used.length}명</span>
        ${host&&S.used.length?'<button class="btn ghost sm" id="rrFReset">피어리스 초기화</button>':''}</div>
      ${S.used.length?`<div class="rr-used">${S.used.map(k=>`<img src="${rrIcon(k)}" alt="${esc(rrName(k))}" title="${esc(rrName(k))}">`).join('')}</div>`
        :'<p class="hint" style="margin:6px 0 0">판을 끝까지 뽑고 새 판을 누르면 그 판의 10명이 여기에 쌓이고, 다음 판부터 나오지 않습니다.</p>'}
    </div>`:'';
  return `<div class="rr">
    <div class="panel rr-board" id="lotPanel">
      <div class="rr-meta">${meta}</div>
      <div class="rr-grid${three?' three':''}">
        <div class="rr-hd">${rlTag(0)}</div><div></div><div class="rr-hd r">${rlTag(1)}</div>
        ${RR_LANES.map((l,i)=>`
          ${rrCell(l,0)}
          <div class="rr-lane${isCur(l,i)?' cur':''}${rrMirror(l)?' mirror':''}">${posIcon(l)}<b>${RR_LANE_KR[l]}</b>${rrMirror(l)?'<em>미러전</em>':''}</div>
          ${rrCell(l,1)}`).join('')}
      </div>
      ${ctrl}
      <p class="hint rr-tip">${S.rr.dup
        ?'상대와 같은 챔피언이 나올 수 있습니다. 롤 사용자 설정 게임을 <b>블라인드 픽</b>으로 만드세요.'
        :'10명 모두 다른 챔피언입니다. 사용자 설정 게임에서 각자 나온 챔피언을 고르면 됩니다.'}</p>
      <div class="flash" id="flash"><b></b></div>
    </div>
    ${fear}
  </div>`;
}

let rrRaf=0, rrStopSeen=new Set(), rrLastTick=0, rrRepaintT=0, rrPreloaded=false;
let rrFlashNext=null;   // 정지 직후 다시 그리면 연출 요소가 바뀌므로, 다시 그린 뒤에 띄울 연출
function rrPaint(){
  if(!RRD){
    $('app').innerHTML=topbar()+'<div class="panel" style="margin-top:16px"><p class="hint">챔피언 데이터를 불러오는 중…</p></div>';
    wire();
    rrLoad().then(()=>paint()).catch(()=>toast('챔피언 데이터를 불러오지 못했습니다. 새로고침해주세요',true));
    return;
  }
  // 진행자 화면(디스코드로 공유하는 화면)은 슬롯 그림을 미리 받아 둡니다. 관전자는 보이는 것만 받습니다.
  if(!rrPreloaded&&me.role==='host'){ rrPreloaded=true; const ks=new Set(RR_LANES.flatMap(l=>rrPool(l,'base'))); setTimeout(()=>ks.forEach(k=>{ const i=new Image(); i.src=rrIcon(k); }),300); }
  $('app').innerHTML=topbar()+rrStage();
  wire();      // 상단(링크·소리) 버튼
  rrWire();
  if(rrFlashNext){ const h=rrFlashNext; rrFlashNext=null; flash(h); }
  rrAnim();
}
function rrRepaintSoon(){ clearTimeout(rrRepaintT); rrRepaintT=setTimeout(paint,40); }
function rrOnStop(m){
  if(sfxOn()) tone(m.side?740:880,0,.14,.07,'triangle');
  // 바로 확정: 오른쪽이 멈추는 순간 양쪽이 같으면 미러전 연출
  if(S.rr.pick!=='three'&&m.side===1){
    const [a,b]=S.game.cells[m.lane];
    if(a.c!=null&&a.c===b.c){ rrFlashNext=`미러전!<br><span style="font-size:.5em">${esc(rrName(a.c))}</span>`; if(sfxOn()) soldChime(); }
  }
}
function rrAnim(){
  cancelAnimationFrame(rrRaf);
  const reels=[...document.querySelectorAll('.reel[data-rk]')];
  if(!reels.length) return;
  const meta=reels.map(el=>{
    const [lane,side,ri]=el.dataset.rk.split(':'); const c=S.game.cells[lane][+side];
    return {el,strip:el.firstElementChild,n:el.firstElementChild.children.length,at:c.at,stop:c.stops[+ri],
      key:`${lane}:${side}:${ri}:${c.at}:${c.v}`,lane,side:+side,last:-1};   // at은 회전마다 달라 새 판·피어리스 초기화 뒤에도 겹치지 않습니다
  });
  const frame=()=>{
    const t=rrNow(); let spinning=false, stopped=false;
    for(const m of meta){
      const H=m.el.clientHeight||1;
      const p=Math.max(0,Math.min(1,(t-m.at)/(m.stop-m.at)));
      const pos=(1-Math.pow(1-p,3))*(m.n-1);      // 처음엔 빠르게, 끝에서 천천히 멈춤
      m.strip.style.transform=`translateY(${(-pos*H).toFixed(1)}px)`;
      const sp=p<1?3*Math.pow(1-p,2):0;           // 속도에 비례해 살짝 흐리게
      m.strip.style.filter=sp>.5?`blur(${Math.min(2.5,sp).toFixed(1)}px)`:'none';
      if(p<1){
        spinning=true;
        const idx=Math.floor(pos);
        if(t>=m.at&&idx!==m.last){ m.last=idx; if(sfxOn()&&Date.now()-rrLastTick>55){ rrLastTick=Date.now(); tickSound(); } }
      } else if(!rrStopSeen.has(m.key)){ rrStopSeen.add(m.key); stopped=true; rrOnStop(m); }
    }
    if(stopped) rrRepaintSoon();
    if(spinning) rrRaf=requestAnimationFrame(frame);
  };
  frame();
}
function rrWire(){
  const on=(id,fn)=>{ const el=$(id); if(el) el.onclick=fn; };
  const started=()=>RR_LANES.some(l=>S.game.cells[l].some(c=>c.v));
  on('rrSpin',()=>send('rrspin'));
  on('rrAll',()=>send('rrspin',{all:true}));
  on('rrImg',saveRRImage);
  on('rrNew',async()=>{
    const g=S.game, complete=RR_LANES.every(l=>g.cells[l].every(c=>c.c!=null));
    if(started()&&!complete&&!await askConfirm({title:'새 판을 시작할까요?',msg:'아직 다 뽑지 않았습니다. 이번 판은 버리고 처음부터 다시 뽑습니다.'+(S.rr.fearless?'\n(끝내지 않은 판의 챔피언은 피어리스 기록에 들어가지 않습니다)':''),confirmLabel:'새 판'})) return;
    send('rrnew');
  });
  on('rrFReset',async()=>{ if(await askConfirm({title:'피어리스를 초기화할까요?',msg:'사용된 챔피언 기록을 지우고 1판째부터 다시 셉니다.',confirmLabel:'초기화'})) send('rrfreset'); });
  on('rrCfgBtn',openRRCfg);
  on('rrListBtn',openRRList);
  document.querySelectorAll('[data-rre]').forEach(b=>b.onclick=()=>{ const [lane,side]=b.dataset.rre.split(':'); send('rrreroll',{lane,side:+side}); });
  document.querySelectorAll('[data-rch]').forEach(b=>b.onclick=()=>{ const [lane,side,key]=b.dataset.rch.split(':'); send('rrchoose',{lane,side:+side,key:+key}); });
}
function openRRCfg(){
  if(!S||me.role!=='host') return;
  const locked=RR_LANES.some(l=>S.game.cells[l].some(c=>c.v));
  let tmp={...S.rr};
  let m=$('rrcfgmodal');
  if(!m){ m=document.createElement('div'); m.id='rrcfgmodal'; document.body.appendChild(m); }
  m.className='modal-bg';
  const draw=()=>{
    m.innerHTML=`<div class="modal">
      <div class="modal-hd"><b>랜랜내 설정</b><button class="btn ghost sm" id="rcClose">닫기</button></div>
      ${locked?'<p class="hint" style="margin-bottom:12px;color:var(--gold)">이번 판을 이미 돌렸습니다. <b>새 판</b>을 누른 뒤 바꿀 수 있습니다.</p>':''}
      <div class="rro-list">${rrOptsHtml(tmp,locked)}</div>
      <div class="row" style="margin-top:14px"><button class="btn gold" id="rcSave" style="flex:1"${locked?' disabled':''}>저장</button></div>
    </div>`;
    $('rcClose').onclick=()=>m.remove();
    m.querySelectorAll('[data-rro]').forEach(b=>b.onclick=()=>{ tmp={...tmp,[b.dataset.rro]:rrParse(b.dataset.rro,b.dataset.v)}; draw(); });
    $('rcSave').onclick=()=>{ send('rrcfg',{rr:tmp}); m.remove(); };
  };
  m.onclick=e=>{ if(e.target===m) m.remove(); };
  draw();
}
/* 라인별로 뽑힐 수 있는 챔피언 이름 목록(진행자). 지금 방의 챔피언 범위 기준, 가나다순.
   피어리스로 금지된 챔피언은 줄을 그어 보여줍니다. */
function openRRList(){
  if(!S||!RRD) return;
  const used=new Set(S.rr.fearless?S.used:[]);
  let m=$('rrlistmodal');
  if(!m){ m=document.createElement('div'); m.id='rrlistmodal'; document.body.appendChild(m); }
  m.className='modal-bg';
  const cols=RR_LANES.map(l=>{
    const ks=rrPool(l,S.rr.range).slice().sort((a,b)=>rrName(a).localeCompare(rrName(b),'ko'));
    const ban=ks.filter(k=>used.has(k)).length;
    return `<div class="rrl-col">
      <div class="rrl-hd">${posIcon(l)}<b>${RR_LANE_KR[l]}</b><span>${ks.length-ban}명${ban?` <i>(금지 ${ban})</i>`:''}</span></div>
      <ul>${ks.map(k=>`<li${used.has(k)?' class="used" title="피어리스: 이미 사용됨"':''}>${esc(rrName(k))}</li>`).join('')}</ul>
    </div>`;
  }).join('');
  m.innerHTML=`<div class="modal rrl">
    <div class="modal-hd"><b>라인별 챔피언 목록</b><button class="btn ghost sm" id="rlClose">닫기</button></div>
    <p class="hint" style="margin-bottom:12px">${rrOptLabel('range',S.rr.range)} 범위(그 라인 픽률 ${RR_RANGE[S.rr.range]}% 이상) · 패치 ${esc(RRD.patch)} · 한국 서버 · 에메랄드 이상${used.size?' · 줄 그은 챔피언은 피어리스로 금지':''}</p>
    <div class="rrl-grid">${cols}</div>
  </div>`;
  $('rlClose').onclick=()=>m.remove();
  m.onclick=e=>{ if(e.target===m) m.remove(); };
}
function rrOnEvent(ev){
  if(ev.kind==='rrnew') toast(`${S.game.n}판째를 시작합니다`);
  else if(ev.kind==='rrfreset') toast('피어리스를 초기화했습니다');
  else if(ev.kind==='rrcfg'){ if(me.role!=='host') toast('진행자가 설정을 바꿨습니다'); else toast('설정을 저장했습니다'); }
  else if(ev.kind==='rrchoose'){
    if(ev.warn) toast(ev.warn,true);
    if(rrMirror(ev.lane)){ flash(`미러전!<br><span style="font-size:.5em">${esc(rrName(S.game.cells[ev.lane][0].c))}</span>`); if(sfxOn()) soldChime(); }
    else if(sfxOn()) tone(988,0,.12,.06,'triangle');
  }
}

/* ── 결과 이미지 ── */
function rrLoadImg(src){ return new Promise(res=>{ const i=new Image(); i.crossOrigin='anonymous'; i.onload=()=>res(i); i.onerror=()=>res(null); i.src=src; }); }
async function saveRRImage(){
  const g=S.game, dpr=2, W=760, pad=28, headH=96, rowH=88, ic=64, H=headH+rowH*5+pad+(S.rr.fearless?24:0);
  const keys=RR_LANES.flatMap(l=>g.cells[l].map(c=>c.c));
  const [imgs,pos]=await Promise.all([
    Promise.all(keys.map(k=>rrLoadImg(rrIcon(k)))),
    Promise.all(RR_LANES.map(l=>rrLoadImg(`/pos/${l.toLowerCase()}.png`)))
  ]);
  const cv=document.createElement('canvas'); cv.width=W*dpr; cv.height=H*dpr;
  const x=cv.getContext('2d'); x.scale(dpr,dpr); x.textBaseline='middle';
  const C={bg:cssVar('--bg'),panel:cssVar('--panel'),line:cssVar('--line'),text:cssVar('--text'),muted:cssVar('--muted'),gold:cssVar('--gold')};
  const rr=(X,Y,w,h,r)=>{x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();};
  x.fillStyle=C.bg; x.fillRect(0,0,W,H);
  x.fillStyle=C.text; x.font='700 26px sans-serif'; x.textAlign='left'; x.fillText(S.title,pad,40,W-pad*2);
  x.fillStyle=C.gold; x.font='700 13px sans-serif';
  x.fillText(`랜랜내 결과 · ${g.n}판째 · `+new Date().toLocaleString('ko-KR',{year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}),pad,72);
  RR_LANES.forEach((l,i)=>{
    const y=headH+i*rowH, cy=y+rowH/2-4;
    x.fillStyle=C.panel; rr(pad,y,W-pad*2,rowH-10,10); x.fill(); x.strokeStyle=C.line; x.lineWidth=1; x.stroke();
    const [a,b]=g.cells[l], mir=a.c===b.c;
    // 가운데 라인 표시
    if(pos[i]) x.drawImage(pos[i],W/2-11,cy-22,22,22);
    x.fillStyle=mir?C.gold:C.muted; x.font='700 13px sans-serif'; x.textAlign='center';
    x.fillText(mir?RR_LANE_KR[l]+' · 미러전':RR_LANE_KR[l],W/2,cy+14);
    // 왼쪽: 그림 + 이름 / 오른쪽: 이름 + 그림
    const L=imgs[i*2], R=imgs[i*2+1];
    if(L) x.drawImage(L,pad+12,cy-ic/2,ic,ic);
    if(R) x.drawImage(R,W-pad-12-ic,cy-ic/2,ic,ic);
    x.fillStyle=C.text; x.font='700 19px sans-serif';
    x.textAlign='left'; x.fillText(rrName(a.c),pad+12+ic+14,cy,W/2-pad-ic-70);
    x.textAlign='right'; x.fillText(rrName(b.c),W-pad-12-ic-14,cy,W/2-pad-ic-70);
  });
  if(S.rr.fearless){ x.fillStyle=C.muted; x.font='12px sans-serif'; x.textAlign='left'; x.fillText(`피어리스 · 이 판까지 사용된 챔피언 ${new Set([...S.used,...keys]).size}명`,pad,H-pad+4); }
  cv.toBlob(b=>{
    if(!b) return toast('이미지를 만들지 못했습니다',true);
    const url=URL.createObjectURL(b), a=document.createElement('a');
    a.href=url; a.download=`랜랜내_${S.code}_${g.n}판.png`; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    toast('결과 이미지를 저장했습니다');
  },'image/png');
}

/* ═══ 시작 ═══ */
if(roomCode){
  const auth=q.get('k')?`k=${q.get('k')}`
           :q.get('t')?`t=${q.get('t')}`
           :q.get('v')?`v=${q.get('v')}`:null;
  if(!auth){
    $('app').innerHTML=`<div class="landing"><h1>링크가 올바르지 않습니다</h1>
      <p class="hint">진행자가 보낸 링크 전체를 주소창에 붙여넣어야 합니다.</p></div>`;
  }else{
    $('app').innerHTML=`<div class="landing"><h1 class="num" style="color:var(--gold)">${roomCode}</h1>
      <p class="hint">경매방에 접속하는 중입니다…</p></div>`;
    connect(roomCode,auth);
  }
}else if(location.hash.startsWith('#/admin')){
  renderAdmin();
}else if(location.hash.startsWith('#/op')){
  // 예전 생성 코드 링크. 이제 코드 없이 누구나 만들 수 있으므로 첫 화면으로 보냅니다.
  go(''); renderLanding();
  toast('이제 생성 코드 없이 누구나 방을 만들 수 있습니다');
}else{
  renderLanding();
}
</script>
