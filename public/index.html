<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>실시간 경매</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A1017; --panel:#141C26; --panel2:#1B2733; --line:#26343F;
  --gold:#D4A94E; --gold-soft:rgba(212,169,78,.14);
  --text:#E6ECF2; --muted:#93A6B8; --body2:#A9B8C6; --danger:#E06A64; --danger-bg:#3A1F1E; --danger-bd:#7A3531; --danger-solid:#B23B36; --ok:#5FA86B;
  --top:#E07A5F; --jgl:#7BB661; --mid:#6FA8DC; --adc:#E0B04A; --sup:#B58ADB; --none:#7E90A2;
  --sans:'IBM Plex Sans KR',system-ui,sans-serif; --num:'Bebas Neue','IBM Plex Sans KR',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:var(--sans)}
body{padding:18px;min-height:100vh}
button,input,textarea,select{font-family:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
::selection{background:var(--gold);color:#0A1017}
.wrap{max-width:1440px;margin:0 auto}
.num{font-family:var(--num);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.hint{font-size:12.5px;color:var(--body2);line-height:1.65}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.lbl{font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-bottom:8px;display:block}
input[type=text],input[type=number],input[type=password],textarea,select{width:100%;background:var(--bg);border:1px solid var(--line);
  border-radius:7px;padding:9px 11px;font-size:14px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--gold)}
textarea{resize:vertical;line-height:1.65;font-size:13.5px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:9px 15px;
  font-size:13.5px;font-weight:500;transition:.13s}
.btn:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#0A1017;font-weight:700}
.btn.gold:hover:not(:disabled){filter:brightness(1.12);color:#0A1017}
.btn.ghost{background:none}
.btn.danger{background:var(--danger-solid);border-color:var(--danger-solid);color:#fff;font-weight:700}
.btn.danger:hover:not(:disabled){filter:brightness(1.12);color:#fff;border-color:var(--danger-solid)}
.btn.danger-soft{background:var(--danger-bg);border-color:var(--danger-bd);color:#E88A85;font-weight:600}
.btn.danger-soft:hover:not(:disabled){border-color:var(--danger);color:#E88A85}
.skl{display:block;border-radius:5px;background:linear-gradient(90deg,#1B2733 25%,#243240 50%,#1B2733 75%);background-size:200% 100%;animation:skl 1.4s infinite}
@keyframes skl{0%{background-position:200% 0}100%{background-position:-200% 0}}
.btn:disabled{opacity:.32;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.1em;padding:3px 7px;border-radius:4px;border:1px solid currentColor}
.t-TOP{color:var(--top)}.t-JGL{color:var(--jgl)}.t-MID{color:var(--mid)}
.t-ADC{color:var(--adc)}.t-SUP{color:var(--sup)}.t-{color:var(--none)}

/* 상단바 */
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);
  padding-bottom:14px;margin-bottom:18px}
.brand{font-weight:700;font-size:17px;letter-spacing:-.02em}
.brand span{color:var(--gold)}
.brand .live{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--danger);border:1px solid var(--danger);border-radius:4px;padding:1px 6px;vertical-align:2px;margin-left:4px}
.code{font-family:var(--num);font-size:22px;color:var(--text);letter-spacing:.14em}
.who{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:4px 11px}
.conn{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--danger)}
.dot.on{background:var(--ok)}

/* 랜딩 */
.landing{max-width:560px;margin:8vh auto;text-align:center}
.landing h1{font-size:34px;font-weight:700;letter-spacing:-.03em;margin-bottom:10px}
.landing .hint{margin-bottom:28px}
.join{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}
.join input{font-family:var(--num);font-size:24px;text-align:center;letter-spacing:.24em;text-transform:uppercase}

/* 설정 */
.setup{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.leader-row{display:grid;grid-template-columns:1fr 76px 76px 34px;gap:8px;margin-bottom:8px}
.leader-row input[type=number]{font-family:var(--num);font-size:16px;text-align:center;padding:6px}
.leader-row input[type=number]::placeholder{font-family:var(--sans);font-size:12px}
.leader-row button{color:var(--muted);font-size:18px;border:1px solid var(--line);border-radius:7px}
.leader-row button:hover{color:var(--danger);border-color:var(--danger)}

/* 관리자 */
.rooms{display:flex;flex-direction:column;gap:9px}
.room{display:grid;grid-template-columns:96px 1fr auto;gap:14px;align-items:center;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.room .rc{font-family:var(--num);font-size:26px;color:var(--text);letter-spacing:.12em}
.room .rt{font-weight:600;font-size:14.5px;margin-bottom:3px}
.room .rs{font-size:12px;color:var(--muted);display:flex;gap:9px;flex-wrap:wrap}
.pill{font-size:11px;font-weight:700;letter-spacing:.06em;padding:2px 8px;border-radius:99px;border:1px solid currentColor}
.p-ready{color:var(--muted)} .p-live{color:var(--gold)} .p-done{color:var(--ok)} .p-gone{color:var(--danger)}
.mode-auction{color:var(--gold)} .mode-draft{color:#6fa8dc}
/* 관리자: 경매방 요약 바 · 코드별 그룹 · 카드 상태 강조 */
.room-sum{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.room-sum .s{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:12px;color:var(--muted)}
.room-sum .s b{font-family:var(--num);font-size:17px;margin-left:4px;color:var(--text)}
.room-sum .s.live b{color:var(--gold)} .room-sum .s.done b{color:var(--ok)} .room-sum .s.warn{color:var(--danger)} .room-sum .s.warn b{color:var(--danger)}
.room-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:20px 0 9px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.room-group .gc{font-family:var(--num);font-size:18px;color:var(--text);letter-spacing:.1em}
.room-group .gk{font-size:11px;font-weight:800;letter-spacing:.04em;padding:1px 7px;border-radius:99px;border:1px solid currentColor}
.room-group .gk.mgr{color:var(--gold)} .room-group .gk.direct,.room-group .gk.gone{color:var(--muted)}
.room-group .gm{font-size:12px;color:var(--muted)}
.room-group .gn{margin-left:auto;font-size:12px;color:var(--muted)}
.room.st-live{box-shadow:inset 4px 0 0 var(--gold)} .room.st-done{box-shadow:inset 4px 0 0 var(--ok)}
.room.st-ready{box-shadow:inset 4px 0 0 var(--muted)} .room.st-gone{box-shadow:inset 4px 0 0 var(--danger);opacity:.6}
.room .rbar{height:4px;background:var(--panel2);border-radius:2px;overflow:hidden;margin-top:7px;max-width:200px}
.room .rbar i{display:block;height:100%;background:var(--ok)}
.room .rs .warn{color:var(--danger)}
.empty{text-align:center;padding:44px 20px;color:var(--muted);font-size:13.5px;line-height:1.9}

/* 참가자 목록 */
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:22px 16px;text-align:center;
  transition:.15s;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--gold);background:var(--gold-soft)}
.drop b{display:block;font-size:14px;font-weight:600;margin-bottom:5px}
.plist{display:flex;flex-direction:column;gap:5px;max-height:340px;overflow-y:auto;margin-top:12px}
.prow{display:grid;grid-template-columns:1fr 62px 84px 1fr 40px;gap:9px;align-items:center;
  background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 10px;font-size:12.5px}
.prow .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .nm i{font-style:normal;color:var(--muted);font-weight:400;font-size:11px}
.prow .tr{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .ch{color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow button{color:var(--muted);font-size:16px;line-height:1;min-width:40px;min-height:36px}
.prow button:hover{color:var(--danger)}
.prow.dup{border-color:var(--danger)}
.psum{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.psum b{font-family:var(--num);font-size:20px;color:var(--text)}

/* 링크 배포 */
.link-row{display:grid;grid-template-columns:130px 1fr auto;gap:9px;align-items:center;margin-bottom:8px}
.link-row code{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;
  font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:ui-monospace,monospace}
.link-row b{font-size:13px;font-weight:600}

/* 경매장 */
.stage{display:grid;grid-template-columns:minmax(320px,410px) 1fr;gap:16px;align-items:start}
.lot{position:relative;overflow:hidden}
.lot-empty{text-align:center;padding:54px 20px;color:var(--muted);font-size:14px;line-height:1.85}
.lot-no{font-family:var(--num);font-size:13px;color:var(--muted);letter-spacing:.2em}
.lot-img{display:block;width:100%;height:240px;object-fit:cover;object-position:center 22%;
  border-radius:10px;border:1px solid var(--line);margin-bottom:14px;background:var(--panel2)}
@media(max-width:520px){.lot-img{height:180px}}
.lot-name{font-size:clamp(30px,4.6vw,50px);font-weight:700;letter-spacing:-.035em;line-height:1.05;
  margin:10px 0 12px;word-break:keep-all}
.lot-meta{display:flex;align-items:center;gap:10px;margin-bottom:18px}

.tier{font-size:12px;font-weight:600;color:var(--gold);border:1px solid var(--gold);
  border-radius:4px;padding:2px 8px}
.champs{display:flex;gap:5px;flex-wrap:wrap;margin:-4px 0 12px}
.champs span{font-size:11.5px;color:var(--muted);background:var(--panel2);
  border-radius:5px;padding:4px 9px}
.high{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:15px;margin-bottom:12px}
.high.mine{border-color:var(--gold);background:var(--gold-soft)}
.high .who-bid{font-size:13px;font-weight:600;margin-bottom:3px}
.high .amt{font-family:var(--num);font-size:40px;line-height:1;color:var(--gold)}
.high .none{font-size:14px;color:var(--muted);padding:6px 0}

.clock{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.clock b{font-family:var(--num);font-size:58px;line-height:1;min-width:80px}
.clock.hot b{color:var(--danger)}
.bar{flex:1;height:5px;background:var(--panel2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);transition:width .25s linear}
.clock.hot .bar i{background:var(--danger)}

.bidpad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:9px}
.bidpad button{padding:13px 0;font-size:14px;font-weight:700;background:var(--panel2);
  border:1px solid var(--line);border-radius:8px}
.bidpad button:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
.bidpad button:disabled{opacity:.3;cursor:not-allowed}
.custom{display:grid;grid-template-columns:1fr auto;gap:6px}
.custom input{font-family:var(--num);font-size:20px;text-align:center}

/* 팀 보드 */
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:12px}
.team{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px;
  display:flex;flex-direction:column;gap:11px;transition:.15s}
.team.me{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),0 0 16px -4px var(--gold)}
.my-badge{display:inline-block;margin-left:6px;background:var(--gold);color:#0A1017;font-size:11px;font-weight:800;letter-spacing:.06em;padding:1px 7px;border-radius:999px;vertical-align:middle;box-shadow:0 0 6px -1px var(--gold)}
.team.top{border-color:var(--ok);background:linear-gradient(rgba(95,168,107,.10),var(--panel))}
.team.turn{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),0 0 16px -4px var(--gold)}
.turn-badge{display:inline-block;margin-left:6px;background:var(--gold);color:#0A1017;font-size:11px;font-weight:800;padding:1px 6px;border-radius:99px;vertical-align:middle}
.tierrow{display:flex;gap:4px;flex-wrap:wrap;margin:2px 0}
.tchip{font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:2px 6px}
.tchip.on{color:#0A1017;background:var(--gold);border-color:var(--gold)}
.tchip i{font-style:normal;font-size:11px;opacity:.75}
.ttag{display:inline-block;min-width:17px;text-align:center;font-size:11px;font-weight:800;color:#000;border-radius:3px;padding:1px 4px;margin-right:5px;vertical-align:middle}
.posic{width:17px;height:17px;vertical-align:middle;margin-left:3px}
.treqrow{display:flex;gap:6px;flex-wrap:wrap}
.treq{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:4px 9px}
.treq b{font-family:var(--num);color:var(--text)}
.treq.bad{color:var(--danger);border-color:var(--danger)}
.treq.bad b{color:var(--danger)}
.ord-list{display:flex;flex-direction:column;gap:6px}
.ord-row{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.ord-n{font-family:var(--num);font-size:16px;color:var(--text);min-width:20px;text-align:center}
.ord-nm{flex:1;font-weight:600}
.ord-btns{display:flex;gap:4px}
.ord-btns button{padding:10px 14px;font-size:14px;min-width:44px}
/* 진행 중 다음 지명 차례 띠 — 스네이크 순서대로 앞으로 나올 팀들 */
/* 주의: 항목 클래스는 .turn-item 입니다. .turn 은 팀 카드(.team.turn)가 이미 쓰고 있어 충돌합니다. */
.turnbar{display:flex;align-items:center;gap:6px;margin-top:12px;padding:9px 11px;
  background:var(--bg);border:1px solid var(--line);border-radius:9px;
  overflow-x:auto;white-space:nowrap;
  -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 24px),transparent);
  mask-image:linear-gradient(90deg,#000 calc(100% - 24px),transparent)}
.turnbar::-webkit-scrollbar{height:4px}
.turnbar::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px}
.turn-lb{font-size:11px;color:var(--muted);letter-spacing:.12em;flex-shrink:0;margin-right:2px}
.turn-item{display:inline-flex;align-items:center;gap:6px;flex-shrink:0;
  background:var(--panel2);border:1px solid var(--line);border-radius:99px;
  padding:5px 11px 5px 7px;font-size:12.5px;font-weight:600}
.turn-item b{font-family:var(--num);font-size:11px;font-weight:400;color:var(--muted);
  min-width:9px;text-align:center}
.turn-item.mine{background:var(--gold);color:#0A1017;font-weight:800;
  padding:5px 12px 5px 8px;box-shadow:0 0 12px -3px var(--gold)}
.turn-item.mine b{display:none}
.turn-item.mine::before{content:'▶';font-size:11px}
.turn-sep{width:1px;height:18px;background:var(--line);flex-shrink:0;margin:0 3px}
.turn-r{font-style:normal;font-family:var(--num);font-size:11px;color:var(--muted);
  border:1px solid var(--line);border-radius:4px;padding:1px 5px;flex-shrink:0}
.turn-more{font-size:11px;color:var(--muted);flex-shrink:0}
.pcard.pick{cursor:pointer}
.pcard.pick:hover{border-color:var(--gold);background:var(--gold-soft)}
.team.full{opacity:.55}
/* 드래그 배정: 드래그 중 드롭 가능한 팀 강조 */
button.pcard[draggable]{cursor:grab}
button.pcard[draggable]:active{cursor:grabbing}
body.dragging .team[data-team-drop]{outline:2px dashed var(--line);outline-offset:2px}
.team.drop-ok{outline:2px solid var(--gold)!important;outline-offset:2px;background:var(--gold-soft)}
.team-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.team-nm{font-weight:700;font-size:15.5px;letter-spacing:-.02em;line-height:1.3}
.team-lead{font-size:11.5px;color:var(--muted);margin-top:2px}
.team-pt{text-align:right;flex-shrink:0}
.team-pt b{font-family:var(--num);font-size:29px;color:var(--gold);line-height:1}
.team-pt i{display:block;font-style:normal;font-size:11px;color:var(--muted);letter-spacing:.1em;margin-top:1px}
.gauge{height:6px;background:var(--bg);border-radius:3px;overflow:hidden}
.gauge i{display:block;height:100%;background:var(--gold);transition:width .35s ease}
.slots{display:flex;gap:4px}
.slot{flex:1;height:26px;border-radius:5px;border:1px dashed var(--line);display:grid;place-items:center;
  font-size:11px;color:var(--muted);letter-spacing:.06em}
.slot.on{border:1px solid transparent;background:var(--panel2);color:var(--text)}
.roster{display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.roster div{display:flex;justify-content:space-between;gap:8px;color:var(--muted)}
.roster div b{font-weight:500;color:var(--text)}
.roster div span{font-family:var(--num);font-size:14px;color:var(--body2)}
.roster .lead b{color:var(--gold)}
/* 팀장 표시 ★ — 결과 이미지(canvas)와 같은 표기를 씁니다. */
.lead-star{font-style:normal;margin-right:4px}

.log-list{display:flex;flex-direction:column;gap:6px;max-height:190px;overflow-y:auto;font-size:12.5px}
.log-list div{color:var(--muted);display:flex;gap:9px}
.log-list div b{font-weight:500;color:var(--text)}
.log-list em{font-family:var(--num);font-size:14px;color:var(--body2);font-style:normal}

.pool{display:flex;gap:7px;flex-wrap:wrap}
/* 남은 매물 칩 — 2줄 카드. 테두리 색 = 등급 구간(롤 티어색). 라인 색은 없음. */
.pcard{display:flex;flex-direction:column;gap:4px;min-width:132px;background:var(--bg);
  border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;line-height:1.2;color:var(--text);text-align:left}
button.pcard{cursor:pointer;transition:.12s}
button.pcard:hover:not(:disabled){background:var(--panel2)}
button.pcard:disabled{opacity:.45;cursor:not-allowed}
.pc-top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.pc-nm{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-gr{font-family:var(--num);font-weight:700;font-size:15px;flex:none}
.pc-pass{font-size:11px;font-weight:700;color:#E88A85;background:#2C1817;border-radius:4px;padding:1px 6px;flex:none}
.pc-bot{display:flex;justify-content:space-between;align-items:center;gap:6px;border-top:1px solid var(--line);padding-top:5px;font-size:12px;color:var(--muted)}
.pc-line{font-weight:700;letter-spacing:.03em}
.pc-sub{font-weight:400;color:var(--muted);font-size:11px}
.pc-tier{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:72px}
/* 정렬/그룹 토글 */
.psort{display:inline-flex;gap:2px;margin-left:auto;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:2px}
.psort button{font-size:12.5px;padding:9px 13px;border-radius:5px;color:var(--muted);letter-spacing:0}
.psort button.on{background:var(--panel2);color:var(--text);font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}
.pgroup{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin:10px 0 5px}
/* 실력 등급 뱃지 (등급 1~5 → 색인덱스 gr0~gr4) — 롤 티어색(챌·그마·마스터·다이아·에메) */
.gr{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.02em;padding:2px 6px;border-radius:4px;color:#0A1017;white-space:nowrap}
.gr0{background:#e6c14a}.gr1{background:#e0554f}.gr2{background:#b06fe0}.gr3{background:#4aa3e0}.gr4{background:#2fae5f}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:99;background:var(--gold);
  color:#0A1017;font-weight:600;font-size:13.5px;padding:11px 20px;border-radius:8px;opacity:0;
  pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
.toast.on{opacity:1;bottom:34px}
/* 토스트 자체는 클릭을 통과시키고(입찰 탭을 가로채지 않도록) 떠 있는 동안의 되돌리기 버튼만 받습니다. */
.toast.on #tUndo{pointer-events:auto}
.toast.bad{background:var(--danger);color:#fff}

.flash{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;
  background:rgba(10,16,23,.92);opacity:0}
.flash b{font-family:var(--num);font-size:56px;color:var(--gold);border:4px solid var(--gold);
  padding:6px 24px;transform:rotate(-8deg);letter-spacing:.06em;text-align:center}
.flash.go{animation:st 1.2s ease-out forwards}
@keyframes st{0%{opacity:0;transform:scale(1.4)}16%{opacity:1;transform:scale(1)}78%{opacity:1}100%{opacity:0}}
.sfx-btn{background:none;border:1px solid var(--line);border-radius:7px;padding:2px 8px;font-size:14px;line-height:1.4;cursor:pointer}
.sfx-btn.off{opacity:.45}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.62);display:grid;place-items:center;z-index:200;padding:20px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;max-width:660px;width:100%;max-height:85vh;overflow:auto}
.modal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.modal-hd b{font-size:15px}

@media(max-width:900px){.setup,.stage{grid-template-columns:1fr}body{padding:12px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script>
const LINES=['TOP','JGL','MID','ADC','SUP'];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* 티어 색·순위, 등급 뱃지 — 목록에서 실력대를 한눈에 보게 합니다.
   각 티어는 한글·영문·흔한 약어/오탈자 키워드로 인식하고, 숫자는:
   마스터~챌린저는 LP(클수록 상위), 그 외는 단수(작을수록 상위)로 정렬에 반영. */
const TIERS=[
  {k:['챌린저','챌','challenger','chall'],c:'#e6c14a',apex:1},
  {k:['그랜드마스터','그마','grandmaster'],c:'#e0554f',apex:1},   // 'gm'은 아래 /^gm/ 앵커로만(부분일치 오탐 방지)
  {k:['마스터','master','마스타'],c:'#b06fe0',apex:1},
  {k:['다이아몬드','다이아','다야','diamond','dia'],c:'#4aa3e0'},
  {k:['에메랄드','에메','emerald','emer'],c:'#2fae5f'},
  {k:['플래티넘','플래','플랫','플레','platinum','plat'],c:'#3fb6a6'},
  {k:['골드','gold'],c:'#e0b04a'},
  {k:['실버','silver'],c:'#9fb0c0'},
  {k:['브론즈','bronze'],c:'#b07b4a'},
  {k:['아이언','iron'],c:'#8a8f96'}
];
const tierColor=t=>{ const i=tierIdx(t); return i<0?'':TIERS[i].c; };
// 축약형 첫 글자 → TIERS 인덱스 (GM은 별도 처리). 예: M7·G3·S4·D1·C·E2
const TIER_ABBR={c:0,m:2,d:3,e:4,p:5,g:6,s:7,b:8,i:9};
const tierIdx=t=>{
  const s=String(t||'').trim().toLowerCase();
  if(!s) return -1;
  for(let i=0;i<TIERS.length;i++) if(TIERS[i].k.some(k=>s.includes(k))) return i;  // 한글·영문 전체 표기
  if(/^gm/.test(s)) return 1;                                                       // 그랜드마스터
  return (s[0] in TIER_ABBR) ? TIER_ABBR[s[0]] : -1;                                // 축약형(M7/G3/S4…)
};
// 티어순 정렬용 순위(높을수록 상위). 마스터~챌린저는 LP(축약형 한 자리는 100단위=M7→700),
// 그 외는 단수(작을수록 상위). 오직 정렬에만 쓰이고 화면 색은 쓰지 않음.
function tierRank(t){
  const i=tierIdx(t); if(i<0) return -1;
  const base=(TIERS.length-i)*1000;
  const n=parseInt((String(t).match(/\d+/)||[])[0]);
  if(!Number.isFinite(n)) return base;
  if(!TIERS[i].apex) return base - Math.min(n,9);
  return base + Math.min(n<10 ? n*100 : n, 999);   // M7=700, 마스터700=700, M100=100
}
// 등급 구간 색 — 롤 티어색(1~1.9 챌린저 … 5~5.9 에메랄드). 없으면 빈값.
// 색 인덱스는 정수부-1 (등급 1→색0=챌린저 … 5→색4=에메).
const GRADE_COLORS=['#e6c14a','#e0554f','#b06fe0','#4aa3e0','#2fae5f'];
const gradeBand=g=>{ const n=Number(g); return (g==null||g===''||!Number.isFinite(n)||n<1)?-1:Math.min(4,Math.floor(n)-1); };
const gradeColor=g=>{ const b=gradeBand(g); return b<0?'':GRADE_COLORS[b]; };
// 등급: 1~5 정수 + 소수점 첫째자리(예 1.2, 3.4). 색은 정수부 구간, 숫자는 소수까지 표시.
function gradeBadge(g){
  const b=gradeBand(g); if(b<0) return '';
  return `<span class="gr gr${b}">${Math.round(Number(g)*10)/10}티어</span>`;
}
// 드래프트 팀 명단용 작은 티어 태그(정수부 티어, 색은 GRADE_COLORS).
function tierTag(g){ const b=gradeBand(g); if(b<0) return ''; return `<span class="ttag" style="background:${GRADE_COLORS[b]};color:#000">${b+1}</span>`; }
// 포지션 아이콘: 라이엇 라인 아이콘을 public/pos/에 내려받아 자체 서빙(외부 로드 없음).
function posIcon(line){ return LINES.includes(line)?`<img class="posic" src="/pos/${line.toLowerCase()}.png" alt="${esc(line)}" title="${esc(line)}">`:(line?esc(line):''); }
let toastH;
function toast(msg,bad){
  const t=$('toast'); t.textContent=msg; t.className='toast on'+(bad?' bad':'');
  clearTimeout(toastH); toastH=setTimeout(()=>t.className='toast',2400);
}
// 삭제 직후 복구용 토스트 — confirm 없이 실행하고 5초 안에 되돌릴 수 있게 합니다.
function toastUndo(msg,fn){
  const t=$('toast');
  t.innerHTML=esc(msg)+' <b style="cursor:pointer;text-decoration:underline;margin-left:8px" id="tUndo">되돌리기</b>';
  t.className='toast on';
  $('tUndo').onclick=()=>{ fn(); t.className='toast'; };
  clearTimeout(toastH); toastH=setTimeout(()=>t.className='toast',5000);
}
// 브라우저 confirm() 대체 모달. danger:'solid'|'soft', code를 주면 코드 입력 일치 시에만 확인 활성화.
function askConfirm({title,msg,confirmLabel='확인',danger='soft',code=null}){
  return new Promise(res=>{
    const m=document.createElement('div'); m.className='modal-bg';
    m.innerHTML=`<div class="modal" tabindex="-1" style="max-width:420px"><div class="modal-hd"><b style="color:#E88A85">${esc(title)}</b></div><p class="hint" style="margin-bottom:12px;white-space:pre-line">${esc(msg)}</p>${code?`<input type="text" id="cfCode" placeholder="${esc(code)}" class="num" style="text-align:center;letter-spacing:.2em;margin-bottom:10px;text-transform:uppercase" aria-label="확인용 코드 입력">`:''}<div class="row"><button class="btn" id="cfNo" style="flex:1">취소</button><button class="btn ${danger==='solid'?'danger':'danger-soft'}" id="cfYes" style="flex:1" ${code?'disabled':''}>${esc(confirmLabel)}</button></div></div>`;
    document.body.appendChild(m);
    const done=v=>{ m.remove(); res(v); };
    m.querySelector('#cfNo').onclick=()=>done(false);
    m.querySelector('#cfYes').onclick=()=>done(true);
    m.onclick=e=>{ if(e.target===m) done(false); };
    m.onkeydown=e=>{ if(e.key==='Escape') done(false); };
    if(code){ const i=m.querySelector('#cfCode'); i.oninput=()=>{ m.querySelector('#cfYes').disabled=i.value.trim().toUpperCase()!==code; }; i.focus(); }
    // 포커스를 모달로 옮깁니다. 그대로 두면 Enter가 뒤의 트리거 버튼을 다시 눌러 모달이 겹칩니다.
    else m.querySelector('#cfNo').focus();
  });
}

/* ═══ 상태 ═══ */
let S=null, me=null, ws=null, connected=false, skew=0, links=null;
let players=[];
let opCode=null, setupMode='admin';   // 방 생성: 관리자 직접('admin') 또는 생성 코드('op')
let managerMode=false;                 // 매니저 코드로 들어왔는지(다회용, 최대 10개)
let poolView='order';                 // 남은 매물 보기: 순서('order')·포지션('pos')·티어순('tier')·등급순('grade')
let draftOrder=null;                   // 드래프트 첫 라운드 지명 순서(팀 id 배열). 진행자가 준비 화면에서 정함.
let sfxMuted=(()=>{ try{ return localStorage.getItem('sfxMuted')==='1'; }catch{ return false; } })();  // 소리 음소거(클라이언트별)
const sfxOn=()=>me&&me.role==='host'&&!sfxMuted;   // 연출 사운드는 진행자 화면 위주로 재생
const fmtInv=c=>c.length===8?c.slice(0,4)+'-'+c.slice(4):c;
const copyText=txt=>navigator.clipboard.writeText(txt).then(()=>toast('복사했습니다')).catch(()=>{
  const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta);
  ta.select(); document.execCommand('copy'); ta.remove(); toast('복사했습니다');
});
let leaders=[{name:'',line:'TOP',points:null},{name:'',line:'JGL',points:null},
             {name:'',line:'MID',points:null},{name:'',line:'ADC',points:null}];
// 진행 방식 설정: 경매(auction) / 드래프트(draft). 드래프트 균형: 티어(tier)/자유(free).
let gameMode='auction', draftBalance='tier';
// 규칙 입력값은 모드 전환 시 재렌더돼도 유지되도록 모듈 상태로 보관합니다.
let rules={title:'클랜 내전',size:5,clock:15,base:1000,minBid:10,order:'random'};
function syncRules(){
  const g=(id,d)=>{ const el=$(id); return el?el.value:d; };
  const n=(id,d)=>{ const el=$(id); return el&&el.value!==''?+el.value:d; };
  rules.title=g('cTitle',rules.title); rules.clock=n('cClock',rules.clock);
  const sz=$('cSize'); if(sz&&!sz.readOnly&&sz.value!=='') rules.size=+sz.value;   // 티어(readonly 5)일 땐 사용자의 경매 인원값 보존
  rules.base=n('cBase',rules.base); rules.minBid=n('cMin',rules.minBid); rules.order=g('cOrder',rules.order);
}

// 링크는 /#/r/CODE?k=... 형태라 쿼리가 해시 뒤에 옵니다.
const [hPath,hQuery]=location.hash.slice(1).split('?');
const roomCode=(hPath.match(/^\/r\/([A-Z0-9]{6})$/i)||[])[1];
const q=new URLSearchParams(hQuery||location.search.slice(1));

// 내부 화면 전환은 go()로 해시를 바꿉니다. 외부에서 해시가 바뀌면(딥링크
// 붙여넣기·뒤로가기) 새로 라우팅되도록 페이지를 다시 불러옵니다.
let routedHash=location.hash;
function go(h){ routedHash=h?(h[0]==='#'?h:'#'+h):''; location.hash=h; }
window.addEventListener('hashchange',()=>{ if(location.hash!==routedHash) location.reload(); });

/* ═══ 접속 ═══ */
let wsAuth='';           // 진행자의 k=… 키. 사진 업로드 인증에도 씁니다.
let closedForGood=false; // 방 삭제/만료로 서버가 정상 종료(code 1000)한 경우
let reconnectMs=1500;    // 지수 백오프 (최대 20초)
function connect(code,auth){
  wsAuth=auth; managerMode=false;   // 방에 입장하면 매니저 컨텍스트를 벗어납니다(방어)
  const proto=location.protocol==='https:'?'wss':'ws';
  const url=`${proto}://${location.host}/api/room/${code}/ws?${auth}`;
  ws=new WebSocket(url);

  ws.onopen=()=>{ connected=true; reconnectMs=1500; paint(); };
  ws.onclose=e=>{
    connected=false;
    // 서버가 정상 종료(1000)로 닫으면 방이 사라진 것이므로 재시도하지 않습니다.
    if(e&&e.code===1000){ closedForGood=true; renderClosed(e.reason); return; }
    paint();
    setTimeout(()=>{ if(!connected&&!closedForGood) connect(code,auth); }, reconnectMs);
    reconnectMs=Math.min(Math.round(reconnectMs*1.7), 20000);
  };
  ws.onerror=()=>{};
  ws.onmessage=e=>{
    const m=JSON.parse(e.data);
    if(m.t==='hello'){ me=m.you; S=m.S; skew=Date.now()-m.S.now; paint(); }
    else if(m.t==='state'){ S=m.S; skew=Date.now()-m.S.now; paint(); if(m.event) onEvent(m.event); }
    else if(m.t==='error'){ toast(m.msg,true); }
    // pong은 하이버네이션 자동응답이 처리하며 별도 동작이 필요 없습니다.
  };
}
function renderClosed(reason){
  if(ws){ try{ ws.onclose=null; ws.close(); }catch{} }
  $('app').innerHTML=`<div class="landing"><h1>경매방이 종료되었습니다</h1>
    <p class="hint">${esc(reason||'방이 삭제되었거나 보관 기간(14일)이 지났습니다.')}</p>
    <button class="btn ghost" id="bHome" style="margin-top:14px">처음으로</button></div>`;
  $('bHome').onclick=()=>{ location.hash=''; location.reload(); };
}
const send=(t,extra={})=>{
  if(ws&&ws.readyState===1){ ws.send(JSON.stringify({t,...extra})); return true; }
  if(t!=='ping') toast('연결이 끊겨 있습니다. 재연결 중…',true);
  return false;
};

function onEvent(ev){
  if(ev.kind==='sold'){ flash(`${esc(ev.team)}<br><span style="font-size:.55em">${esc(ev.player)} · ${esc(ev.price)}P</span>`); if(sfxOn()) soldChime(); }
  else if(ev.kind==='pass') flash('유찰');
  else if(ev.kind==='assign') flash(`${esc(ev.team)}<br><span style="font-size:.5em">${esc(ev.player)} · 배정</span>`);
  else if(ev.kind==='bid' && me.role!=='host') beep();
  else if(ev.kind==='clock' && me.role!=='host') toast(`제한시간이 ${ev.clock}초로 바뀌었습니다`);
  else if(ev.kind==='reset') toast('처음 상태로 초기화되었습니다');
  else if(ev.kind==='pick'){ flash(`${esc(ev.team)}<br><span style="font-size:.5em">${esc(ev.player)} 지명</span>`); if(sfxOn()) soldChime(); }
  else if(ev.kind==='draftstart') toast('드래프트가 시작되었습니다');
  else if(ev.kind==='draworder'){ if(S.draft&&S.draft.baseOrder) draftOrder=S.draft.baseOrder.slice(); paint(); if(me.role==='host') toast('지명 순서를 추첨했습니다'); }
}
function flash(html){
  const f=$('flash'); if(!f) return;
  f.querySelector('b').innerHTML=html;
  f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
}
let actx;
function beep(){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();   // 사용자 제스처 전이라 멈춰 있으면 깨웁니다
    const o=actx.createOscillator(), g=actx.createGain();
    o.connect(g); g.connect(actx.destination);
    o.frequency.value=880; g.gain.setValueAtTime(.06,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+.16);
    o.start(); o.stop(actx.currentTime+.17);
  }catch{}
}
// 파일 없이 WebAudio로 합성하는 연출음(무료·무의존).
function tone(freq,delay,dur,vol=.08,type='sine'){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
    if(actx.state!=='running') return;   // 사용자 제스처 전이면 예약하지 않음(리로드 후 밀린 소리가 한꺼번에 터지는 것 방지)
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type; o.frequency.value=freq; o.connect(g); g.connect(actx.destination);
    const t=actx.currentTime+delay;
    g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.start(t); o.stop(t+dur+.02);
  }catch{}
}
function soldChime(){ try{ [523.25,659.25,783.99].forEach((f,i)=>tone(f,i*0.09,.2,.09,'triangle')); tone(1046.5,.27,.34,.07); }catch{} }
function tickSound(){ try{ tone(1180,0,.045,.05,'square'); }catch{} }

/* ═══ 파생 ═══ */
const myTeam=()=>me&&me.teamId?S.teams.find(t=>t.id===me.teamId):null;
const remaining=()=>S?S.pool.filter(p=>p.status!=='sold'):[];
// 종료 판정: 명시적 done, 남은 매물 없음, 또는 모든 팀 정원 마감.
const allDone=()=>!!S&&(S.phase==='done'||!remaining().length||S.teams.every(t=>t.open<=0));
// 드래프트: 팀이 이미 채운 티어 밴드 집합(팀장 등급 + 지명한 선수). 서버 teamBands와 동일 규칙.
function teamBandsClient(t){
  const s=new Set(); const lb=gradeBand(t.grade); if(lb>=0)s.add(lb);
  S.pool.forEach(p=>{ if(p.teamId===t.id){ const b=gradeBand(p.grade); if(b>=0)s.add(b); } });
  return s;
}
const leftMs=()=>{
  if(!S) return 0;
  if(S.pausedLeft!=null) return S.pausedLeft;
  if(!S.deadline) return 0;
  return Math.max(0,S.deadline-(Date.now()-skew));
};

/* ═══ 화면 ═══ */
function paint(){
  if(!S){ return; }
  // 드래그 도중 재렌더되면 소스 노드가 사라져 dragend가 안 뜨므로, 드래그 시각효과를 여기서 정리.
  document.body.classList.remove('dragging');
  // 브로드캐스트마다 전체를 다시 그리므로, 입력 중이던 값·포커스·커서를 보존합니다.
  // 특히 팀장이 커스텀 입찰 금액을 치는 도중 남이 입찰해도 값이 날아가지 않게 합니다.
  const a=document.activeElement;
  const keep=a&&a.id&&('value' in a)?{id:a.id,val:a.value,s:a.selectionStart,e:a.selectionEnd}:null;
  $('app').innerHTML=topbar()+stage();
  wire();
  if(keep){
    const el=$(keep.id);
    if(el&&('value' in el)){
      el.value=keep.val;
      try{ el.focus(); if(keep.s!=null) el.setSelectionRange(keep.s,keep.e); }catch{}
    }
  }
}

function topbar(){
  const role={host:'진행자',team:myTeam()?myTeam().name:'팀장',view:'관전'}[me.role];
  return `<div class="topbar">
    <div class="brand">${esc(S.title)} <span class="live">LIVE</span></div>
    <div class="code">${S.code}</div>
    <div class="who">${esc(role)}</div>
    <div class="conn">${me.role==='host'?`<button class="btn ghost" id="bLinks" style="padding:4px 9px;font-size:12px">🔗 링크</button><button class="sfx-btn ${sfxMuted?'off':''}" id="bSfx" title="연출 소리 켜기/끄기" aria-label="소리 ${sfxMuted?'꺼짐':'켜짐'}">${sfxMuted?'🔇':'🔊'}</button>`:''}<span class="dot ${connected?'on':''}"></span>${connected?'연결됨':'재연결 중…'}</div>
  </div>`;

// 진행자 전용: 방 안에서 접속 링크를 모달로 다시 보기. 이번 세션 링크가 없으면(새로고침·북마크) hostKey로 서버 조회.
async function openLinksModal(){
  if(!S||me.role!=='host') return;
  // 캐시된 링크는 '이 방'의 것일 때만 재사용(관리자·매니저 목록에서 다른 방으로 입장한 경우 방지).
  let d=(links&&links.code===S.code&&links.links)?links:null;
  if(!d){
    try{
      const k=new URLSearchParams(wsAuth).get('k')||'';   // 연결에 쓴 진행자 키 — 모든 입장 경로에서 정확
      const r=await fetch(`/api/room/${S.code}/links?k=${encodeURIComponent(k)}`);
      d=await r.json(); if(!r.ok) throw new Error(d.error||'링크를 불러오지 못했습니다');
      links=d;
    }catch(e){ return toast(e.message||'링크를 불러오지 못했습니다',true); }
  }
  const origin=location.origin;
  const rows=[
    {label:'진행자 (나)', url:`${origin}/#/r/${d.code}?k=${d.hostKey}`, gold:true},
    ...d.links.map(l=>({label:l.name, url:`${origin}/#/r/${d.code}?t=${l.token}`})),
    {label:'관전용', url:`${origin}/#/r/${d.code}?v=${d.viewKey}`}
  ];
  let m=$('linkmodal');
  if(!m){ m=document.createElement('div'); m.id='linkmodal'; document.body.appendChild(m); }
  m.className='modal-bg';
  m.innerHTML=`<div class="modal">
    <div class="modal-hd"><b>접속 링크</b><button class="btn ghost" id="lmClose" style="padding:5px 12px;font-size:12px">닫기</button></div>
    <p class="hint" style="margin-bottom:12px">각 팀장에게 <b>자기 링크만</b> 개인적으로 보내세요. 링크가 곧 신분입니다.</p>
    ${rows.map((r,i)=>`<div class="link-row"><b style="${r.gold?'color:var(--gold)':''}">${esc(r.label)}</b><code>${esc(r.url)}</code><button class="btn" data-lcopy="${i}">복사</button></div>`).join('')}
    <div class="row" style="margin-top:12px"><button class="btn" id="lmAll" style="flex:1">전체 목록 복사</button></div>
  </div>`;
  const close=()=>m.remove();
  $('lmClose').onclick=close;
  m.onclick=e=>{ if(e.target===m) close(); };   // 바깥 어두운 영역 클릭 시 닫기
  m.querySelectorAll('[data-lcopy]').forEach(b=>b.onclick=()=>copyText(rows[+b.dataset.lcopy].url));
  $('lmAll').onclick=()=>copyText(rows.map(r=>`${r.label}\n${r.url}`).join('\n\n'));
}

    <div class="lot-meta">

function bidControls(t,mine){
  if(!t) return '';
  if(t.open<=0) return '<div class="hint">로스터를 모두 채웠습니다. 관전만 가능합니다.</div>';
  const base=S.minNext, m=S.minBid, cap=t.cap;
  const cur=S.bid?S.bid.amount:null;
  const steps=[base, base+m*2, base+m*5, base+m*10];
  const blocked=mine||S.pausedLeft!=null;
  const why=mine?'이미 최고 입찰 중입니다'
    :cap<base?`한도 ${cap}P — 더 부를 수 없습니다`
    :`내 한도 ${cap}P · ${t.open}자리 남음`;
  return `<div class="bidpad">${steps.map(v=>`
      <button data-bid="${v}" ${blocked||v>cap?'disabled':''}>${cur!=null&&v>cur?`+${v-cur}<span style="display:block;font-size:11px;color:var(--muted);font-weight:400">${v}</span>`:v}</button>`).join('')}</div>
    <div class="custom">
      <input type="number" id="custom" class="num" placeholder="직접 입력" min="${base}" max="${cap}" onwheel="this.blur()">
      <button class="btn gold" id="bCustom" ${blocked?'disabled':''}>입찰</button>
    </div>
    ${mine?`<div style="margin-top:10px;background:var(--gold-soft);border:1px solid var(--gold);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;color:var(--gold);text-align:center">✓ ${why}</div>`:`<div class="hint" style="margin-top:9px">${why}</div>`}`;
}

function teamCard(t){

  const roster=draft?S.pool.filter(p=>p.teamId===t.id):t.players;
  const pct=t.start?Math.round(t.points/t.start*100):0;

             :'<div class="slot">빈자리</div>';

    : `<div class="team-pt"><b>${t.points}</b><i>POINT</i></div>`;
  const tierRow=(draft&&S.draft&&S.draft.balance==='tier')
    ? `<div class="tierrow">${[0,1,2,3,4].map(b=>{
        const filled=teamBandsClient(t).has(b);

        return `<span class="tchip ${filled?'on':''}"${st}>${b+1}티어</span>`;
      }).join('')}</div>` : '';
  const dropAttr=(me.role==='host'&&!draft&&t.open>0&&!S.current)?`data-team-drop="${t.id}"`:'';

      <div><div class="team-nm"${mineT?' style="color:var(--gold)"':''}>${esc(t.name)}${mineT?'<span class="my-badge">MY</span>':''}${turn?'<span class="turn-badge">지명중</span>':''}${top?`<span class="turn-badge" style="background:var(--ok)">최고 ${S.bid.amount}P</span>`:''}</div>
      <div class="team-lead">팀장 ${esc(t.leader)}${t.leaderLine?' · '+t.leaderLine:''}${draft&&lgBand>=0?` · ${lgBand+1}티어`:(!draft&&t.start!==S.base?` · 시작 ${t.start}P`:'')}</div></div>
      ${ptBlock}
    </div>
    ${draft?'':`<div class="gauge"><i style="width:${pct}%"></i></div>`}
    ${tierRow}
    <div class="slots">${slots}</div>
    <div class="roster">
      <div class="lead"><b><i class="lead-star">★</i>${esc(t.leader)}</b><span>${draft?tierTag(t.grade)+posIcon(t.leaderLine):posIcon(t.leaderLine)}</span></div>
      ${roster.map(p=>`<div><b>${esc(p.name)}</b><span>${draft?tierTag(p.grade)+posIcon(p.line):p.price+posIcon(p.line)}</span></div>`).join('')}
      ${(!draft&&t.open>0)?`<div style="font-size:11.5px">한도 ${t.cap}P · ${t.open}자리 남음</div>`:''}

  </div>`;
}

// 드래프트 첫 순서 상태를 팀 구성과 맞춰 초기화(서버 baseOrder 우선, 없으면 등록 순서).
function ensureDraftOrder(){
  const ids=S.teams.map(t=>t.id);
  const valid=draftOrder&&draftOrder.length===ids.length&&new Set(draftOrder).size===ids.length&&draftOrder.every(id=>ids.includes(id));
  if(!valid){
    const b=S.draft&&S.draft.baseOrder;
    draftOrder=(b&&b.length===ids.length&&new Set(b).size===ids.length&&b.every(id=>ids.includes(id)))?b.slice():ids;
  }
}

// 진행 중 '다음 지명 차례' 띠. 현재 픽 이후 최대 5팀을 스네이크 순서대로, 라운드가 바뀌는 자리엔 R표시.
function nextTurnBar(d){
  const n=S.teams.length||1;
  const items=[];
  for(let i=d.ptr+1;i<d.seq.length&&items.length<5;i++){
    const t=S.teams.find(x=>x.id===d.seq[i]);
    if(!t) continue;
    const mine=me.teamId===t.id;
    const k=items.length;
    // 라운드가 바뀌는 자리엔 구분선 + R뱃지를 항목 앞에 따로 넣습니다.
    const head=(i%n===0)?`<span class="turn-sep"></span><i class="turn-r">R${Math.floor(i/n)+1}</i>`:'';
    const op=mine?1:Math.max(.5,Math.round((1-k*.18)*100)/100);   // 뒤로 갈수록 옅게
    items.push(`${head}<span class="turn-item${mine?' mine':''}" style="opacity:${op}"><b>${i+1}</b>${mine?'내 차례':esc(t.leader)}</span>`);
  }
  if(!items.length) return `<div class="turnbar"><span class="turn-lb">다음</span><span class="turn-more">마지막 지명입니다</span></div>`;
  const more=d.seq.length-(d.ptr+1)-items.length;
  return `<div class="turnbar"><span class="turn-lb">다음</span>${
    items.join('')}${more>0?`<span class="turn-more">+${more}</span>`:''}</div>`;
}

// 내 차례가 몇 픽 뒤인지(팀장 화면 안내용). 현재 차례거나 남은 차례가 없으면 0.
function picksUntilMyTurn(d){
  if(!me.teamId) return 0;
  for(let i=d.ptr+1;i<d.seq.length;i++) if(d.seq[i]===me.teamId) return i-d.ptr;
  return 0;
}

// 드래프트 진행판(경매의 lotBody 자리). 준비/진행/완료 단계별로 그립니다.
function draftBody(){
  const d=S.draft||{seq:[],ptr:0,balance:'free',picksPerTeam:0};
  if(S.phase==='ready'){
    ensureDraftOrder();
    const host=me.role==='host';
    const nm=id=>{ const t=S.teams.find(x=>x.id===id); return t?t.leader:id; };
    const list=draftOrder.map((id,i)=>`<div class="ord-row">
        <span class="ord-n">${i+1}</span>
        <span class="ord-nm">${esc(nm(id))} 팀</span>
        ${host?`<span class="ord-btns"><button class="btn ghost" data-ordup="${i}" ${i===0?'disabled':''}>▲</button><button class="btn ghost" data-orddn="${i}" ${i===draftOrder.length-1?'disabled':''}>▼</button></span>`:''}
      </div>`).join('');
    return `<div class="lot-empty" style="padding:16px 20px">${d.balance==='tier'?'티어 균형':'자유'} 드래프트<br>${S.pool.length}명 · ${S.teams.length}팀 · 팀당 ${d.picksPerTeam}명</div>
      <div class="row" style="align-items:center;margin-bottom:8px"><span class="lbl" style="margin:0">첫 지명 순서</span>${host?`<button class="btn ghost" id="bDraw" style="margin-left:auto;padding:4px 12px;font-size:12px">🎲 추첨</button>`:''}</div>
      <div class="ord-list">${list}</div>
      ${host
        ? `<p class="hint" style="margin:9px 0 12px">추첨을 누르면 모두가 보는 앞에서 순서가 정해집니다. ▲▼로 직접 조정도 가능하고, 이후는 스네이크(다음 라운드부터 역순)로 진행됩니다.</p>
           <div class="row"><button class="btn gold" style="flex:1" id="bStartDraft">이 순서로 드래프트 시작</button></div>`
        : `<p class="hint" style="margin:9px 0">진행자가 순서를 정하고 곧 시작합니다.</p>`}`;
  }
  if(S.phase==='done'){
    return `<div class="lot-empty">드래프트 완료<br>아래 팀 구성을 확인하세요</div>
      <div class="row"><button class="btn gold" id="bResultImg" style="flex:1">결과 이미지 저장</button></div>
      ${me.role==='host'?`<div class="row" style="margin-top:8px;justify-content:flex-end">
        <button class="btn danger-soft" id="bReset" style="font-size:12px;padding:6px 12px">드래프트 초기화</button>
      </div>`:''}`;
  }
  // 진행 중
  const curId=d.seq[d.ptr];
  const t=S.teams.find(x=>x.id===curId);
  const myTurn=!!me.teamId&&me.teamId===curId;
  const ms=leftMs(), over=ms<=0, pct=Math.max(0,Math.min(100,ms/(S.clock*1000)*100));
  const round=Math.floor(d.ptr/S.teams.length)+1;
  const wait=picksUntilMyTurn(d);
  let need='';
  if(d.balance==='tier'&&t){
    const rem=[0,1,2,3,4].filter(b=>!teamBandsClient(t).has(b)).map(b=>b+1);
    need=` · 지명할 티어 <b style="color:var(--gold)">${rem.join('·')}</b>`;
  }
  return `<div class="lot-no">ROUND ${round}/${d.picksPerTeam} · PICK ${Math.min(d.ptr+1,d.seq.length)}/${d.seq.length}</div>
    <div class="lot-name" style="font-size:clamp(26px,4vw,42px)">${esc(t?t.leader:'')} <span style="font-size:.5em;color:var(--muted)">팀 차례</span></div>
    <div class="hint" style="margin-bottom:12px">${d.balance==='tier'?'티어 균형':'자유'} 드래프트${need}</div>
    <div class="clock ${ms<=5000?'hot':''}">
      <b class="num" id="clockVal">${Math.max(0,Math.ceil(ms/1000))}</b>
      <div class="bar"><i id="clockBar" style="width:${pct}%"></i></div>
      ${S.pausedLeft!=null?'<span class="hint" style="color:var(--gold)">일시정지</span>':over?'<span class="hint" style="color:var(--danger)">시간 초과 · 지명 대기</span>':''}
    </div>
    ${nextTurnBar(d)}
    <div class="hint" style="margin-top:14px">${
      myTurn?'<b style="color:var(--gold)">내 차례입니다.</b> 오른쪽 남은 매물에서 선수를 눌러 지명하세요.'
      :me.role==='host'?'현재 팀장이 고르는 중입니다. 오른쪽 매물을 클릭하면 진행자가 대신 지명합니다.'
      :wait>0?`다른 팀 차례입니다. <b style="color:var(--gold)">내 차례까지 ${wait}픽</b> 남았습니다.`
      :'다른 팀 차례입니다. 남은 매물을 살펴보세요.'}</div>
    ${me.role==='host'?`<div class="row" style="margin-top:12px;justify-content:flex-end">
      <button class="btn" id="bPause" style="font-size:12px;padding:6px 12px">${S.pausedLeft!=null?'재개':'일시정지'}</button>
      <button class="btn" id="bUndo" style="font-size:12px;padding:6px 12px">되돌리기</button>
      <button class="btn danger-soft" id="bReset" style="font-size:12px;padding:6px 12px">초기화</button>
    </div>${hostClockCtl()}`:''}`;
}

// 순서대로 다음에 나올 매물 목록(현재 제외). 추첨(draw)이면 확정 순서, 아니면 pool 순서.
// 대기 매물을 앞에, 유찰(재상정 예정) 매물을 뒤에 붙여 남은 매물 수와 목록이 일치하게 합니다.
function nextUpList(){
  const byId={}; S.pool.forEach(p=>byId[p.id]=p);
  const seq=((S.orderMode==='draw'&&S.order)?S.order:S.pool.map(p=>p.id)).map(id=>byId[id]).filter(Boolean);
  const wait=seq.filter(p=>p.status==='wait'&&p.id!==S.current);
  const pass=seq.filter(p=>p.status==='pass'&&p.id!==S.current);
  return wait.concat(pass);
}

// 남은 매물 패널 — 모든 역할이 봅니다(진행자만 클릭해 상정, 나머지는 미리보기).
// 칩에 티어(색)·모스트 챔피언·실력 등급을 함께 보여주고, 순서/포지션/티어로 정렬·그룹.
function poolPanel(){
  const host=me.role==='host';
  const live=!!S.current;
  const draft=S.mode==='draft';
  const dLive=draft&&S.phase==='live'&&!!S.draft;
  const curId=dLive?S.draft.seq[S.draft.ptr]:null;
  const iCanPick=dLive&&(host||me.teamId===curId);   // 지금 지명할 수 있는 사람인가
  const curTeam=curId?S.teams.find(x=>x.id===curId):null;
  const draw=S.orderMode==='draw';
  const rem=remaining().filter(p=>p.id!==S.current);
  const posline=LINES.map(l=>`${l} ${rem.filter(p=>p.line===l).length}`).join(' · ');
  const noline=rem.filter(p=>!p.line).length;
  const chip=p=>{
    // 2줄 카드: 윗줄 닉네임·등급, 아랫줄 주포/부포·티어.
    // 테두리 색 = 등급색 우선, 없으면 티어색, 둘 다 없으면 무채색.
    const gc=gradeColor(p.grade);
    const hasG=p.grade!=null&&p.grade!=='';
    const bc=gc||tierColor(p.tier)||'var(--line)';
    const inner=`<div class="pc-top">
        <span class="pc-nm">${esc(p.name)}</span>
        ${hasG?`<span class="pc-gr" style="color:${gc}">${esc(p.grade)}</span>`
             :p.status==='pass'?'<span class="pc-pass">유찰</span>':''}
      </div>
      <div class="pc-bot">
        <span class="pc-line">${esc(p.line)||'-'}${p.sub?`<span class="pc-sub">/${esc(subLabel(p.sub))}</span>`:''}${hasG&&p.status==='pass'?' <span class="pc-pass">유찰</span>':''}</span>
        <span class="pc-tier">${esc(p.tier)||'-'}</span>
      </div>`;
    const bst=`style="border-color:${bc};border-left-width:4px"`;
    // 진행자는 매물이 없을 때 카드를 팀으로 드래그해 배정할 수 있습니다.
    const drag=(host&&!live&&!draft)?`draggable="true" data-dpid="${p.id}"`:'';
    if(draft){
      // 드래프트: 내 차례(또는 진행자)면 적격 매물에 지명 버튼, 아니면 표시만.
      let eligible=iCanPick&&p.status!=='sold';
      if(eligible&&S.draft.balance==='tier'&&curTeam){ const b=gradeBand(p.grade); eligible=b>=0&&!teamBandsClient(curTeam).has(b); }
      return eligible
        ? `<button class="pcard pick" data-pick="${p.id}" ${bst}>${inner}</button>`
        : `<span class="pcard" ${bst}>${inner}</span>`;
    }
    return host
      ? `<button class="pcard" data-lot="${p.id}" ${drag} ${bst} ${live?'disabled':''}>${inner}</button>`
      : `<span class="pcard" ${bst}>${inner}</span>`;
  };
  const poolDiv=arr=>`<div class="pool">${arr.length?arr.map(chip).join(''):'<span class="hint">남은 매물이 없습니다</span>'}</div>`;
  // 그룹 렌더 공용: [[라벨, 배열], …] → 헤더+칩. 빈 그룹은 숨김.
  const renderGroups=groups=>{ const shown=groups.filter(([,a])=>a.length);
    return shown.length?shown.map(([label,a])=>`<div class="pgroup">${label} · ${a.length}</div>${poolDiv(a)}`).join(''):'<span class="hint">남은 매물이 없습니다</span>'; };

  let body;
  if(poolView==='pos'){
    body=renderGroups(LINES.map(l=>[l,rem.filter(p=>p.line===l)]).concat([['미지정',rem.filter(p=>!p.line)]]));
  }else if(poolView==='tier'){
    // 티어별 그룹(상위→하위), 그룹 내 LP·단수 정렬. 못 알아본 티어는 '미분류'.
    const tg=TIERS.map((t,i)=>[t.k[0], rem.filter(p=>tierIdx(p.tier)===i).sort((a,b)=>tierRank(b.tier)-tierRank(a.tier))])
             .concat([['미분류', rem.filter(p=>tierIdx(p.tier)<0)]]);
    body=renderGroups(tg);
  }else if(poolView==='grade'){
    // 등급 구간별 그룹(1티어 상위), 그룹 내 소수 오름차순. 등급 없으면 '등급 미정'.
    // gradeBand로 완전분할 → 범위 밖·구데이터 등 어떤 값도 누락 없이 한 그룹에만 속함(카운트=목록 일치).
    const gg=[0,1,2,3,4].map(b=>[`${b+1}티어`, rem.filter(p=>gradeBand(p.grade)===b).sort((x,y)=>Number(x.grade)-Number(y.grade))])
             .concat([['등급 미정', rem.filter(p=>gradeBand(p.grade)<0)]]);
    body=renderGroups(gg);
  }else{
    body=poolDiv(draw?nextUpList():rem);
  }
  return `<div class="panel" style="margin-top:12px">
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <span class="lbl" style="margin:0">${draw&&poolView==='order'?'매물 순서':'남은 매물'} <b class="num" style="color:var(--gold);font-size:15px">${rem.length}</b></span>
      <div class="psort" role="group" aria-label="매물 정렬">
        <button id="pv-order" data-pv="order" aria-pressed="${poolView==='order'}" class="${poolView==='order'?'on':''}">${draw?'순서':'등록순'}</button>
        <button id="pv-pos" data-pv="pos" aria-pressed="${poolView==='pos'}" class="${poolView==='pos'?'on':''}">포지션</button>
        <button id="pv-tier" data-pv="tier" aria-pressed="${poolView==='tier'}" class="${poolView==='tier'?'on':''}">티어순</button>
        <button id="pv-grade" data-pv="grade" aria-pressed="${poolView==='grade'}" class="${poolView==='grade'?'on':''}">등급순</button>
      </div>
    </div>
    <div style="display:flex;gap:9px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--muted);margin:8px 0 2px"><b style="letter-spacing:.06em">등급색</b>${GRADE_COLORS.map((c,i)=>`<span><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${c};vertical-align:-1px"></i> ${i+1}</span>`).join('')}<span style="color:#5A6B7C">·</span><span>낮을수록 상위</span></div>
    <div class="hint" style="margin:4px 0 8px">${posline}${noline?` · 미지정 ${noline}`:''}${host&&live?' · <span style="color:var(--gold)">현재 매물 마무리 후 선택 가능</span>':(host&&!draft)?' · <span style="color:var(--gold)">카드를 팀으로 끌어다 놓으면 0P로 배정됩니다</span>':''}</div>
    ${body}
  </div>`;
}

// 진행자 전용: 진행 중에도 제한 시간을 5초 단위로 조정.
function hostClockCtl(){
  return `<div class="row" style="margin-top:8px;align-items:center;gap:8px">
    <span class="hint" style="text-transform:none;letter-spacing:0">제한시간 <b style="color:var(--gold)">${S.clock}</b>초</span>
    <button class="btn ghost" id="bClkDn" style="padding:4px 12px" ${S.clock<=5?'disabled':''}>−5</button>
    <button class="btn ghost" id="bClkUp" style="padding:4px 12px" ${S.clock>=300?'disabled':''}>+5</button>
  </div>`;
}

// A-4: 최종 결과를 한 장 이미지(PNG)로 저장.
// 경매는 낙찰가·잔여 포인트, 드래프트는 지명 수·티어를 싣습니다.
function saveResultImage(){
  // 드래프트는 포인트 개념이 없습니다(price 0, base 더미). 웹 팀 명단과 같은 표기를 씁니다.
  const draft=S.mode==='draft';
  const perTeam=(draft&&S.draft)?S.draft.picksPerTeam:0;
  // 드래프트 명단은 teamCard와 같이 풀에서 읽습니다(t.players에 등급이 없는 예전 지명분 대비).
  const rosterOf=t=>draft?S.pool.filter(p=>p.teamId===t.id):t.players;
  const teams=S.teams, sc=2, colW=300, pad=28, headH=96, rowH=30, gap=16;
  const cols=Math.min(teams.length,4), rowsN=Math.ceil(teams.length/cols);
  const maxP=Math.max(0,...teams.map(t=>rosterOf(t).length));
  const cardH=64+(1+maxP)*rowH+16;
  const W=pad*2+cols*colW+(cols-1)*gap, H=headH+rowsN*cardH+(rowsN-1)*gap+pad;
  const cv=document.createElement('canvas'); cv.width=W*sc; cv.height=H*sc;
  const x=cv.getContext('2d'); x.scale(sc,sc); x.textBaseline='top';
  const rr=(X,Y,w,h,r)=>{x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();};
  x.fillStyle='#0A1017'; x.fillRect(0,0,W,H);
  x.fillStyle='#E6ECF2'; x.font='700 26px sans-serif'; x.fillText(S.title,pad,26,W-pad*2);
  x.fillStyle='#D4A94E'; x.font='700 13px sans-serif';
  x.fillText((draft?'드래프트 결과 · ':'경매 결과 · ')+new Date().toLocaleString('ko-KR',{year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}),pad,62);
  const POS={TOP:'#E07A5F',JGL:'#7BB661',MID:'#6FA8DC',ADC:'#E0B04A',SUP:'#B58ADB'};
  teams.forEach((t,i)=>{
    const cx=pad+(i%cols)*(colW+gap), cy=headH+Math.floor(i/cols)*(cardH+gap);
    x.fillStyle='#141C26'; rr(cx,cy,colW,cardH,10); x.fill();
    x.strokeStyle='#26343F'; x.lineWidth=1; x.stroke();
    x.fillStyle='#E6ECF2'; x.font='700 17px sans-serif'; x.fillText(t.name,cx+16,cy+13,colW-32);
    x.fillStyle='#7E90A2'; x.font='12px sans-serif'; x.fillText('팀장 '+t.leader,cx+16,cy+38,colW-120);
    x.fillStyle='#D4A94E'; x.textAlign='right';
    x.fillText(draft?(rosterOf(t).length+(perTeam?'/'+perTeam:'')+' 지명'):('잔여 '+t.points+'P'),cx+colW-16,cy+38,90); x.textAlign='left';
    let ry=cy+64;
    // 오른쪽 끝 값: 경매는 낙찰가, 드래프트는 등급색 티어(웹 명단의 tierTag와 같은 정보).
    const rightVal=(g,price,ry2)=>{
      x.font='600 13px sans-serif'; x.textAlign='right';
      if(draft){ const b=gradeBand(g); if(b>=0){ x.fillStyle=GRADE_COLORS[b]; x.fillText((b+1)+'티어',cx+colW-16,ry2,80); } }
      else { x.fillStyle='#D4A94E'; x.fillText(price+'P',cx+colW-16,ry2,80); }
      x.textAlign='left';
    };
    x.fillStyle='#D4A94E'; x.font='600 13px sans-serif'; x.fillText('★ '+t.leader,cx+16,ry,colW-70);
    if(draft) rightVal(t.grade,null,ry);
    ry+=rowH;
    rosterOf(t).forEach(pl=>{
      x.fillStyle=POS[pl.line]||'#7E90A2'; x.fillRect(cx+16,ry+3,3,13);
      x.fillStyle='#E6ECF2'; x.font='13px sans-serif'; x.fillText(pl.name,cx+26,ry,colW-130);
      rightVal(pl.grade,pl.price,ry);
      ry+=rowH;
    });
  });
  cv.toBlob(b=>{
    if(!b) return toast('이미지를 만들지 못했습니다',true);
    const url=URL.createObjectURL(b), a=document.createElement('a');
    a.href=url; a.download=`${draft?'드래프트결과':'경매결과'}_${S.code}.png`; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    toast('결과 이미지를 저장했습니다');
  },'image/png');
}

function wire(){
  const on=(id,fn)=>{ const el=$(id); if(el) el.onclick=fn; };
  on('bNext',()=>send('lot'));
  on('bUndo',()=>send('undo'));
  on('bSfx',()=>{
    sfxMuted=!sfxMuted;
    try{ localStorage.setItem('sfxMuted',sfxMuted?'1':'0'); }catch{}
    const b=$('bSfx'); if(b){ b.textContent=sfxMuted?'🔇':'🔊'; b.classList.toggle('off',sfxMuted); b.setAttribute('aria-label','소리 '+(sfxMuted?'꺼짐':'켜짐')); }
    // 켤 때: 사용자 제스처로 오디오 잠금을 풀고, 컨텍스트가 running이 되면 짧은 확인음.
    if(!sfxMuted){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); const blip=()=>tone(880,0,.09,.05); actx.state==='running'?blip():actx.resume().then(blip).catch(()=>{}); }catch{} }
  });
  on('bReset',()=>{ const draft=S&&S.mode==='draft';
    const msg=draft
      ? '드래프트를 처음 상태로 초기화할까요?\n\n모든 지명 기록이 지워지고 지명 순서가 새로 추첨됩니다.\n(매물·팀·사진·링크는 그대로 유지됩니다. 초기화 직후에는 되돌리기로 복구할 수 있습니다.)'
      : '경매를 처음 상태로 초기화할까요?\n\n모든 낙찰·유찰·입찰 기록이 지워지고 팀 포인트가 원래대로 돌아갑니다.\n(매물·팀·사진·링크는 그대로 유지됩니다. 초기화 직후에는 되돌리기로 복구할 수 있습니다.)';
    askConfirm({title:(S&&S.mode==='draft')?'드래프트를 초기화할까요?':'경매를 초기화할까요?',msg,confirmLabel:'초기화'}).then(ok=>{ if(ok) send('reset'); }); });
  on('bStartDraft',()=>send('startdraft',{order:draftOrder}));
  on('bDraw',()=>send('draworder'));
  on('bLinks',openLinksModal);
  document.querySelectorAll('[data-ordup]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.ordup; if(draftOrder&&i>0){ [draftOrder[i-1],draftOrder[i]]=[draftOrder[i],draftOrder[i-1]]; paint(); } });
  document.querySelectorAll('[data-orddn]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.orddn; if(draftOrder&&i<draftOrder.length-1){ [draftOrder[i],draftOrder[i+1]]=[draftOrder[i+1],draftOrder[i]]; paint(); } });
  on('bSell',()=>send('sell'));
  on('bPass',()=>{ if(S.bid){ askConfirm({title:'유찰 처리할까요?',msg:`최고 입찰 ${S.bid.amount}P가 있습니다. 유찰하면 이 매물은 뒤로 밀립니다.`,confirmLabel:'유찰'}).then(ok=>{ if(ok) send('pass'); }); return; } send('pass'); });
  on('bPause',()=>send(S.pausedLeft!=null?'resume':'pause'));
  on('bClkDn',()=>send('setclock',{clock:Math.max(5,S.clock-5)}));
  on('bClkUp',()=>send('setclock',{clock:Math.min(300,S.clock+5)}));
  on('bResultImg',saveResultImage);
  const doCustom=()=>{
    const v=+$('custom').value;
    if(!v) return toast('금액을 입력하세요',true);
    send('bid',{amount:v});
  };
  on('bCustom',doCustom);
  const custom=$('custom');
  if(custom) custom.onkeydown=e=>{ if(e.key==='Enter') doCustom(); };
  document.querySelectorAll('[data-bid]').forEach(b=>b.onclick=()=>send('bid',{amount:+b.dataset.bid}));
  document.querySelectorAll('[data-lot]').forEach(b=>b.onclick=()=>send('lot',{id:b.dataset.lot}));
  document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>send('pick',{playerId:b.dataset.pick,ptr:S.draft?S.draft.ptr:-1}));
  // 유찰/대기 카드 → 팀 카드로 드래그해 0P 배정 (진행자, 매물 없을 때)
  // 전용 타입(application/x-dpid)을 실어, 외부 텍스트·링크 드래그는 무시합니다.
  const isCard=e=>e.dataTransfer.types.includes('application/x-dpid');
  document.querySelectorAll('[data-dpid]').forEach(el=>{
    el.addEventListener('dragstart',e=>{ e.dataTransfer.setData('application/x-dpid',el.dataset.dpid); e.dataTransfer.setData('text/plain',el.dataset.dpid); e.dataTransfer.effectAllowed='move'; document.body.classList.add('dragging'); });
    el.addEventListener('dragend',()=>{ document.body.classList.remove('dragging'); document.querySelectorAll('.drop-ok').forEach(x=>x.classList.remove('drop-ok')); });
  });
  document.querySelectorAll('[data-team-drop]').forEach(el=>{
    el.addEventListener('dragover',e=>{ if(!isCard(e)) return; e.preventDefault(); e.dataTransfer.dropEffect='move'; el.classList.add('drop-ok'); });
    el.addEventListener('dragleave',()=>el.classList.remove('drop-ok'));
    el.addEventListener('drop',e=>{ el.classList.remove('drop-ok'); if(!isCard(e)) return; e.preventDefault();
      const pid=e.dataTransfer.getData('application/x-dpid');
      if(/^p\d+$/.test(pid)) send('assign',{playerId:pid,teamId:el.dataset.teamDrop});
    });
  });
  document.querySelectorAll('[data-pv]').forEach(b=>b.onclick=()=>{
    // 정렬 토글은 전체 재렌더라, 팀장이 입력 중이던 커스텀 금액을 보존합니다.
    const c=$('custom'), cv=c?c.value:'', cs=c?c.selectionStart:null;
    poolView=b.dataset.pv; paint();
    const c2=$('custom');
    if(c2&&cv){ c2.value=cv; try{ if(cs!=null) c2.setSelectionRange(cs,cs); }catch{} }
    const bb=$('pv-'+poolView); if(bb) bb.focus();
  });
  // 업로드 대상 pid를 "버튼 클릭 시점"에 고정합니다. 파일 탐색기를 여는 사이
  // 매물이 바뀌어도 엉뚱한 선수에게 사진이 붙지 않게 합니다.
  on('bImg',()=>{ const f=$('imgFile'); if(f){ f.dataset.pid=S.current||''; f.click(); } });
  const imgFile=$('imgFile');
  if(imgFile) imgFile.onchange=e=>{ const f=e.target.files[0]; const pid=e.target.dataset.pid; if(f) uploadImg(f,pid); e.target.value=''; };
  on('bImgDel',async()=>{
    const pid=S.current;
    if(!pid) return;
    if(!await askConfirm({title:'이 선수의 사진을 지울까요?',msg:'업로드한 사진이 삭제됩니다.',confirmLabel:'삭제'})) return;
    try{
      const r=await fetch(`/api/room/${S.code}/img/${pid}?${wsAuth}`,{method:'DELETE'});
      if(!r.ok) throw new Error((await r.json().catch(()=>({}))).error||'삭제하지 못했습니다');
      toast('사진을 지웠습니다');
    }catch(e){ toast(e.message,true); }
  });
}

/* 진행자 전용: 사진을 브라우저에서 줄여서(최대 800px·95KB) 올립니다 */
async function uploadImg(file,pid){
  pid=pid||(S&&S.current);
  if(!pid) return toast('경매 중인 매물이 없습니다',true);
  try{
    const blob=await shrinkImage(file);
    const r=await fetch(`/api/room/${S.code}/img/${pid}?${wsAuth}`,
      {method:'POST',headers:{'content-type':blob.type},body:blob});
    const d=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(d.error||'업로드에 실패했습니다');
    toast('사진을 올렸습니다');
  }catch(e){ toast(e.message,true); }
}
function shrinkImage(file){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{
      URL.revokeObjectURL(img.src);
      const sc=Math.min(1,800/Math.max(img.width,img.height));
      const cv=document.createElement('canvas');
      cv.width=Math.max(1,Math.round(img.width*sc));
      cv.height=Math.max(1,Math.round(img.height*sc));
      const ctx=cv.getContext('2d');
      // JPEG는 투명도가 없으므로 PNG/WebP 투명 배경을 흰색으로 채웁니다(검게 나오는 것 방지).
      ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height);
      ctx.drawImage(img,0,0,cv.width,cv.height);
      const tryQ=qs=>{
        if(!qs.length) return rej(new Error('이미지를 충분히 줄이지 못했습니다'));
        cv.toBlob(b=>{ b&&b.size<=95*1024 ? res(b) : tryQ(qs.slice(1)); },'image/jpeg',qs[0]);
      };
      tryQ([.85,.7,.5,.35]);
    };
    img.onerror=()=>{ URL.revokeObjectURL(img.src); rej(new Error('이미지 파일을 읽지 못했습니다')); };
    img.src=URL.createObjectURL(file);
  });
}

/* 시계는 다시 그리지 않고 숫자만 갱신 */
let lastTick=0;
setInterval(()=>{
  // 경매(현재 매물) 또는 진행 중 드래프트에서 초읽기 갱신.
  const running = S && (S.current || (S.mode==='draft' && S.phase==='live'));
  if(!running){ lastTick=0; return; }
  const v=$('clockVal'), bar=$('clockBar');
  if(!v) return;
  const ms=leftMs();
  const sec=Math.max(0,Math.ceil(ms/1000));
  v.textContent=sec;
  if(bar) bar.style.width=Math.max(0,Math.min(100,ms/(S.clock*1000)*100))+'%';
  v.parentElement.classList.toggle('hot',ms<=5000);
  // 마지막 3·2·1초 긴장 틱(진행자 화면, 음소거 아닐 때). 입찰로 시간이 늘면 다시 울립니다.
  if(S.pausedLeft==null && sec>=1 && sec<=3 && sec!==lastTick && sfxOn()){ lastTick=sec; tickSound(); }
  else if(sec>3) lastTick=0;
},200);

const store={
  get(){ try{ return sessionStorage.getItem('adm')||''; }catch{ return mem; } },
  set(v){ mem=v; try{ sessionStorage.setItem('adm',v); }catch{} },
  clear(){ mem=''; try{ sessionStorage.removeItem('adm'); }catch{} }
};
let mem='';

async function api(path,opt={}){
  const r=await fetch(path,{...opt,headers:{'content-type':'application/json',
    Authorization:'Bearer '+store.get(),...(opt.headers||{})}});
  const d=await r.json().catch(()=>({}));
  if(r.status===401){ store.clear(); renderLogin('세션이 만료되었습니다. 다시 로그인해주세요.'); throw new Error('unauth'); }
  if(!r.ok) throw new Error(d.error||'요청에 실패했습니다');
  return d;
}

    <button class="btn ghost" id="bRe" style="padding:6px 12px;font-size:12px">새로고침</button>
  </div>
  <div id="rooms"><div style="display:grid;grid-template-columns:96px 1fr auto;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:9px"><span class="skl" style="height:26px;width:80px"></span><span style="display:flex;flex-direction:column;gap:7px"><span class="skl" style="height:14px;width:60%"></span><span class="skl" style="height:11px;width:85%"></span></span><span style="display:flex;gap:6px"><span class="skl" style="height:36px;width:52px;border-radius:7px"></span><span class="skl" style="height:36px;width:100px;border-radius:7px"></span></span></div><div style="display:grid;grid-template-columns:96px 1fr auto;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;opacity:.6"><span class="skl" style="height:26px;width:80px"></span><span style="display:flex;flex-direction:column;gap:7px"><span class="skl" style="height:14px;width:45%"></span><span class="skl" style="height:11px;width:70%"></span></span><span style="display:flex;gap:6px"><span class="skl" style="height:36px;width:52px;border-radius:7px"></span><span class="skl" style="height:36px;width:100px;border-radius:7px"></span></span></div></div>`;

  }catch(e){ if(e.message!=='unauth') toast(e.message,true); return; }
  total=total??rooms.length; shown=shown??rooms.length;   // 서버는 최신 40개만 상세 조회

  $('invList').innerHTML=invites.length?invites.map(v=>{
    const mgr=v.kind==='manager';
    const date=new Date(v.createdAt).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
    const state=mgr?'<b style="color:var(--gold)">매니저</b> · 다회용(최대 10)'
      :(v.used?`사용됨${v.roomCode?' → 방 '+v.roomCode:''}`:'미사용 · 1회용');
    const expiry=(mgr||v.used)?'':' · 만료 '+new Date(v.createdAt+30*86400e3).toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'});
    const copyable=mgr||!v.used;
    return `<div class="link-row">

      <code>${state}${v.note?' · '+esc(v.note):''} · ${date}${expiry}</code>

        ${copyable?`<button class="btn" data-invcopy="${v.code}" data-invkind="${mgr?'manager':'once'}">복사</button>`:''}

  }).join(''):'<span class="hint">발급한 코드가 없습니다. 위에서 발급해 매니저/운영자에게 보내세요.</span>';

  document.querySelectorAll('[data-invcopy]').forEach(b=>b.onclick=()=>{

  });
  document.querySelectorAll('[data-invdel]').forEach(b=>b.onclick=async()=>{
    const c=b.dataset.invdel;
    if(!await askConfirm({title:`코드 ${fmtInv(c)} 를 삭제할까요?`,msg:'아직 안 쓴 코드라면 더는 방을 만들 수 없게 됩니다.',confirmLabel:'삭제'})) return;
    try{ await api('/api/admin/invite/'+c,{method:'DELETE'}); toast('삭제했습니다'); renderRooms(); }
    catch(e){ if(e.message!=='unauth') toast(e.message,true); }
  });

  // 경매방을 만든 코드(via)별로 묶어 표시. 코드 종류/메모는 발급 코드 목록에서 가져옵니다.
  const invMeta={}; invites.forEach(v=>invMeta[v.code]={kind:v.kind,note:v.note,createdAt:v.createdAt});
  const stOf=r=>r.missing?['p-gone','삭제됨','st-gone']
    :r.filled||r.phase==='done'?['p-done','종료','st-done']
    :r.phase==='live'?['p-live','진행 중','st-live']:['p-ready','대기','st-ready'];
  const daysOf=r=>Math.ceil((r.createdAt+14*86400e3-Date.now())/86400e3);

  if(!rooms.length){
    $('rooms').innerHTML='<div class="empty">아직 만든 경매방이 없습니다<br>위의 버튼으로 새로 만들어보세요</div>';
  }else{
    // 상단 요약 바
    const c={live:0,ready:0,done:0,gone:0,soon:0};
    rooms.forEach(r=>{ const s=stOf(r)[2];
      if(s==='st-gone')c.gone++; else if(s==='st-done')c.done++; else if(s==='st-live')c.live++; else c.ready++;
      const d=daysOf(r); if(s!=='st-gone'&&d>=0&&d<=3)c.soon++; });
    const capped=total>shown;   // 방이 40개를 넘으면 최신 40개만 집계·표시됩니다.
    const sum=`<div class="room-sum">

      <span class="s live">진행중 <b>${c.live}</b></span>
      <span class="s">대기 <b>${c.ready}</b></span>
      <span class="s done">종료 <b>${c.done}</b></span>
      ${c.gone?`<span class="s">삭제됨 <b>${c.gone}</b></span>`:''}
      ${c.soon?`<span class="s warn">곧 삭제 <b>${c.soon}</b></span>`:''}
    </div>${capped?`<div class="hint" style="margin:-6px 0 12px;color:var(--muted)">방이 많아 최신 40개만 표시됩니다. 끝난 방을 삭제하면 정리됩니다.</div>`:''}`;

    // 코드별 그룹: 원본 인덱스(idx)를 유지해 아래 버튼 핸들러가 그대로 동작하게 함.
    const gmap=new Map();
    rooms.forEach((r,idx)=>{ const k=r.via||''; if(!gmap.has(k))gmap.set(k,[]); gmap.get(k).push({r,idx}); });
    // 그룹 순서: 코드 발급순(오래된 먼저) → 삭제된 코드 → 직접 생성(맨 뒤)
    const rank=k=> k===''?Number.MAX_SAFE_INTEGER : (invMeta[k]?invMeta[k].createdAt:Number.MAX_SAFE_INTEGER-1);
    const newest=k=>Math.max(...gmap.get(k).map(it=>it.r.createdAt));   // 발급순 동률(만료·삭제 코드) 보조정렬
    const keys=[...gmap.keys()].sort((a,b)=> rank(a)-rank(b) || newest(b)-newest(a));

    const card=({r,idx})=>{ const st=stOf(r), d=daysOf(r);
      const prog=(!r.missing&&r.players)?`<div class="rbar"><i style="width:${Math.round(r.sold/r.players*100)}%"></i></div>`:'';
      return `<div class="room ${st[2]}">
        <div class="rc">${r.code}</div>
        <div>
          <div class="rt">${esc(r.title)} <span class="pill ${r.mode==='draft'?'mode-draft':'mode-auction'}">${r.mode==='draft'?('드래프트'+(r.draftBalance==='tier'?' · 티어':r.draftBalance==='free'?' · 자유':'')):'경매'}</span> <span class="pill ${st[0]}">${st[1]}</span></div>
          <div class="rs">
            ${r.missing?'<span>방 데이터가 없습니다</span>':`
            <span>${r.teams}팀 · 참가자 ${r.players}명</span>
            <span>낙찰 ${r.sold}/${r.players}</span>
            <span>접속 ${r.online}명</span>`}
            <span>${new Date(r.createdAt).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</span>
            <span class="${!r.missing&&d>=0&&d<=3?'warn':''}">삭제까지 ${Math.max(0,d)}일</span>
          </div>
          ${prog}
        </div>
        <div class="row" style="gap:6px">
          ${r.missing?'':`<button class="btn" data-links="${idx}">링크</button>
          <button class="btn gold" data-enter="${idx}">진행자로 입장</button>`}
          <button class="btn danger-soft" data-del="${r.code}">삭제</button>
        </div>
      </div>`;
    };
    const header=k=>{ const n=gmap.get(k).length;
      if(k==='') return `<div class="room-group"><span class="gc">직접 생성</span><span class="gk direct">관리자</span><span class="gn">방 ${n}개</span></div>`;
      const m=invMeta[k];
      const kind=m?(m.kind==='manager'?['mgr','매니저']:['once','1회용']):['gone','만료·삭제된 코드'];
      const memo=(m&&m.note)?`<span class="gm">${esc(m.note)}</span>`:'';
      return `<div class="room-group"><span class="gc">${fmtInv(k)}</span><span class="gk ${kind[0]}">${kind[1]}</span>${memo}<span class="gn">방 ${n}개</span></div>`;
    };
    const body=keys.map(k=>{
      const items=gmap.get(k).sort((x,y)=>y.r.createdAt-x.r.createdAt);  // 그룹 내 최신순
      return header(k)+'<div class="rooms">'+items.map(card).join('')+'</div>';
    }).join('');

    $('rooms').innerHTML=sum+body;
  }

  document.querySelectorAll('[data-links]').forEach(b=>b.onclick=()=>{
    const r=rooms[+b.dataset.links];
    renderLinks({code:r.code,hostKey:r.hostKey,viewKey:r.viewKey,links:r.links},true);
  });
  document.querySelectorAll('[data-enter]').forEach(b=>b.onclick=()=>{
    const r=rooms[+b.dataset.enter];
    history.replaceState(null,'',`/#/r/${r.code}?k=${r.hostKey}`);
    $('app').innerHTML='<div class="landing"><p class="hint">입장하는 중입니다…</p></div>';
    connect(r.code,'k='+r.hostKey);
  });
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    const code=b.dataset.del;
    if(!await askConfirm({title:`${code} 방을 삭제할까요?`,msg:'진행 기록과 링크가 모두 사라지고 되돌릴 수 없습니다.\n확인을 위해 방 코드를 입력하세요.',confirmLabel:'삭제',danger:'solid',code})) return;
    try{ await api('/api/admin/room/'+code,{method:'DELETE'}); toast('삭제했습니다'); renderRooms(); }
    catch(e){ if(e.message!=='unauth') toast(e.message,true); }
  });
}

function renderLanding(){
  managerMode=false;
  $('app').innerHTML=`<div class="landing">
    <h1>실시간 경매</h1>

      <span class="lbl">방 코드로 참가</span>

    </div>
    <div class="panel" style="text-align:left;margin-top:14px">
      <span class="lbl">경매방 만들기 · 운영자/매니저</span>
      <div class="join">
        <input type="text" id="opIn" maxlength="9" placeholder="ABCD-EFGH" aria-label="생성 코드" style="font-size:19px">
        <button class="btn" id="bOp">확인</button>
      </div>
      <p class="hint" style="margin-top:10px">관리자에게 받은 코드를 입력하면 경매방을 만들 수 있습니다. <b>1회용 코드</b>는 방 1개, <b>매니저 코드</b>는 방을 여러 개(최대 10개) 만들 수 있습니다.</p>
    </div>
  </div>`;
  const goOp=()=>startOperator($('opIn').value);
  $('bOp').onclick=goOp;
  $('opIn').onkeydown=e=>{ if(e.key==='Enter') goOp(); };
  $('bJoin').onclick=async()=>{
    const c=$('joinCode').value.trim().toUpperCase();

      const r=await fetch('/api/room/'+c);
      if(!r.ok) return toast('없는 방 코드입니다',true);
      toast('진행자가 보낸 링크로 접속해야 입찰할 수 있습니다');
    }catch{ toast('연결에 실패했습니다. 잠시 후 다시 시도해주세요.',true); }
  };
  $('joinCode').onkeydown=e=>{ if(e.key==='Enter') $('bJoin').click(); };
}

/* 운영자: 생성 코드를 확인하고 설정 화면으로 */
async function startOperator(raw){
  const c=String(raw||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(c.length!==8) return toast('8자리 생성 코드를 입력하세요',true);
  try{
    const r=await fetch('/api/invite/'+c);
    const d=await r.json().catch(()=>({}));
    if(!r.ok){
      toast(d.error||'코드를 확인하지 못했습니다',true);
      if(!$('opIn')) renderLanding();
      return;
    }
    opCode=c; setupMode='op'; go('#/op/'+c);
    if(d.manager){
      // 매니저 코드 → 방을 여러 개 관리하는 대시보드.
      managerMode=true; renderManager();
    }else if(d.used&&d.room){
      // 1회용인데 이미 방을 만든 상태 → 그 방의 링크 화면으로 재진입.
      managerMode=false; links=d.room; renderLinks(d.room,true);
    }else{
      managerMode=false; renderSetup('op');
    }
  }catch{ toast('네트워크 오류입니다. 잠시 후 다시 시도해주세요.',true); }
}

  document.querySelectorAll('[data-mlinks]').forEach(b=>b.onclick=()=>{

    try{
      const r=await fetch('/api/manager/'+opCode+'/room/'+rc,{method:'DELETE'});
      const d=await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d.error||'삭제하지 못했습니다');

  });
}

      <input type="text" placeholder="팀장 ${i+1} 닉네임" value="${esc(l.name)}" data-i="${i}" data-f="name">

        ${['',...LINES].map(v=>`<option value="${v}" ${v===l.line?'selected':''}>${v||'라인'}</option>`).join('')}
