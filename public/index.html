    : setupMode==='op'
    ? (managerMode ? renderManager : ()=>{ go(''); renderLanding(); })
    : renderRooms;
  drawLeaders(); drawPlayers();
  const drop=$('drop'), file=$('file');
  drop.onclick=()=>file.click();
  file.onchange=e=>{ if(e.target.files[0]) loadFile(e.target.files[0]); e.target.value=''; };
  ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{
    e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{
    e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop',e=>{ const f=e.dataTransfer.files[0]; if(f) loadFile(f); });
  $('bText').onclick=addText;
  $('bAdd').onclick=()=>{
    if(leaders.length>=TEAM_MAX) return toast(`팀장은 최대 ${TEAM_MAX}명까지입니다`,true);
    leaders.push({name:'',line:'',points:null});drawLeaders();
  };
  const bClear=$('bClear'); if(bClear) bClear.onclick=()=>{leaders.forEach(l=>l.points=null);drawLeaders();toast('기본 포인트로 되돌렸습니다');};
  document.querySelectorAll('[data-gm]').forEach(b=>b.onclick=()=>{
    if(gameMode===b.dataset.gm) return;   // 이미 켜진 모드면 재렌더할 이유가 없다
    syncRules(); gameMode=b.dataset.gm; applyModeDefaults();
    renderSetup(setupMode); refocus('[data-gm="'+gameMode+'"]');
  });
  // 규칙을 켜고 끄면 화면 전체를 다시 그리므로 누른 체크박스가 파괴된다.
  // 정렬 토글(1327행)과 같이 재렌더 뒤 그 자리로 포커스를 돌려준다.
  document.querySelectorAll('[data-rs]').forEach(b=>b.onchange=()=>{
    const k=b.dataset.rs;
    syncRules(); draftRules={...draftRules,[k]:b.checked}; applyModeDefaults();
    renderSetup(setupMode); refocus('[data-rs="'+k+'"]');
  });
  $('bCreate').onclick=createRoom;
}

function drawLeaders(){
  // 값 칸은 켠 규칙에 따라 달라집니다. 경매는 시작 P, 드래프트는 클랜티어·클랜점수(둘 다 켜면 둘 다).
  const draft=gameMode==='draft';
  const cols=draft?[draftRules.tier&&'grade',draftRules.score&&'score'].filter(Boolean):['points'];
  const HEAD={grade:'클랜티어',score:'클랜점수',points:'시작 P'};
  // 좁은 화면에서는 헤더가 숨으므로 placeholder가 이름까지 알려줘야 합니다.
  // 넓은 화면에서는 칸이 좁아 잘리지만, 값을 넣으면 사라지고 위에 헤더가 있어 문제되지 않습니다.
  const PH={grade:'클랜티어 1~5',score:'클랜점수 0~999',points:'기본'};
  const ARIA={grade:'클랜티어(1~5)',score:'클랜점수(0~999)',points:'시작 포인트'};
  // 값 칸이 0개면 .none, 2개면 .two — 셀 수와 열 수를 맞춥니다.
  const two=cols.length>1?' two':cols.length?'':' none';
  const hcell=t=>`<span style="font-size:var(--fs-2xs);color:var(--muted);font-weight:600">${t}</span>`;
  $('leaderList').innerHTML=`<div class="leader-row${two}" style="margin-bottom:4px">`
    +`<span style="font-size:var(--fs-2xs);color:var(--muted);font-weight:600;letter-spacing:.06em">닉네임</span>`
    +hcell('라인')+cols.map(c=>hcell(HEAD[c])).join('')+'<span></span></div>'
    +leaders.map((l,i)=>`
    <div class="leader-row${two}">
      <input type="text" placeholder="팀장 ${i+1} 닉네임" value="${esc(l.name)}" data-i="${i}" data-f="name">
      <select data-i="${i}" data-f="line" aria-label="팀장 ${i+1} 라인">
        ${['',...LINES].map(v=>`<option value="${v}" ${v===l.line?'selected':''}>${v||'라인'}</option>`).join('')}
      </select>
      ${cols.map(c=>{
        if(c==='points') return `<input type="number" min="0" placeholder="${PH[c]}" value="${l.points??''}" data-i="${i}" data-f="points" aria-label="팀장 ${i+1} ${ARIA[c]}" onwheel="this.blur()">`;
        // 필수값이 비어 있으면 칸을 빨갛게 — 어느 팀장이 빠졌는지 바로 보이게 합니다.
        const bad=!(REQ.find(r=>r.key===c)||{ok:()=>true}).ok(l[c]);
        return `<input type="text" placeholder="${PH[c]}" value="${esc(l[c]??'')}" data-i="${i}" data-f="${c}" aria-label="팀장 ${i+1} ${ARIA[c]}" style="text-align:center${bad?';border-color:var(--danger)':''}">`;
      }).join('')}
      <button data-del="${i}" title="삭제" aria-label="팀장 ${i+1} 삭제">&times;</button>
    </div>`).join('');
  $('leaderList').querySelectorAll('[data-f]').forEach(el=>{
    el.oninput=el.onchange=()=>{
      const i=+el.dataset.i, f=el.dataset.f;
      leaders[i][f]= f==='points' ? (el.value===''?null:Math.max(0,+el.value)) : el.value;
      // 이 칸의 빨간 테두리는 여기서 직접 갱신합니다. drawTierReq는 팀장 행을 다시 그리지 않습니다.
      const r=REQ.find(x=>x.key===f);
      if(r) el.style.borderColor=r.ok(el.value)?'':'var(--danger)';
      drawTierReq();   // 어느 칸을 고쳐도 확인 패널·만들기 버튼 갱신
    };
  });
  $('leaderList').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    if(leaders.length<=2) return toast('팀장은 2명 이상이어야 합니다',true);
    leaders.splice(+b.dataset.del,1); drawLeaders();
  });
  drawTierReq();
}

// Object.create(null): 'constructor'·'toString' 같은 상속 속성이 오탐되지 않게 합니다.
const POSMAP=Object.assign(Object.create(null),{
  TOP:'TOP','탑':'TOP','탑라인':'TOP','토프':'TOP',
  JGL:'JGL',JG:'JGL',JUG:'JGL',JUNGLE:'JGL','정글':'JGL','정글러':'JGL','정글링':'JGL',
  MID:'MID','미드':'MID','미드라이너':'MID','미들':'MID',
  ADC:'ADC',AD:'ADC',BOT:'ADC',BOTTOM:'ADC',ADCARRY:'ADC','원딜':'ADC','봇':'ADC','바텀':'ADC','딜러':'ADC',
  SUP:'SUP',SUPP:'SUP',SPT:'SUP',SUPPORT:'SUP','서폿':'SUP','서포터':'SUP','서포트':'SUP','폿':'SUP','서폿터':'SUP'});
const norm=v=>{
  const t=String(v??'').trim();
  return POSMAP[t.toUpperCase()]||POSMAP[t]||'';
};
// 부포지션: 5라인 + '전체/all'(→'ALL')까지 허용. 메인 포지션은 norm(5라인만) 사용.
const normSub=v=>{ const t=String(v??'').trim(); return /^(전체|올|올포|올라인|all)$/i.test(t)?'ALL':norm(t); };
const subLabel=s=>s==='ALL'?'전체':s;
const clean=v=>String(v??'').trim().replace(/\s+/g,' ').slice(0,24);
// 실력 등급: 1~5 정수 + 소수점 첫째자리(예 1.2·3.4). 범위 밖·두 자리 소수는 인정 안 함.
const gnum=v=>{ const m=String(v??'').trim().match(/^([1-5](?:\.\d)?)\s*(?:티어|t)?$/i); return m?m[1]:''; };
// 점수 드래프트용 점수: 0~999 정수만. 소수는 인정 안 함(서버 parseScore와 동일 규칙).
const snum=v=>{ const m=String(v??'').trim().match(/^(\d{1,3})\s*(?:점|p)?$/i); return m?m[1]:''; };
// 아이디(닉네임#태그) 분리 → {name, tag}. 첫 # 기준, 태그는 12자·내부 # 제거(서버와 동일).
function splitId(id){
  const s=String(id??'').trim();
  const h=s.indexOf('#');
  if(h<0) return {name:clean(s), tag:''};
  return {name:clean(s.slice(0,h)), tag:clean(s.slice(h+1)).replace(/#/g,'').slice(0,12)};
}

/* 엑셀/CSV 읽기 — 열 순서가 바뀌어도 제목으로 찾습니다. 아이디=닉네임#태그. */
function readSheet(rows){
  const want={아이디:'id',ID:'id',id:'id',
              솔랭티어:'tier','솔랭 티어':'tier',티어:'tier',
              클랜티어:'grade','클랜 티어':'grade',등급:'grade',티어등급:'grade','실력 등급':'grade',실력등급:'grade',
              클랜점수:'score','클랜 점수':'score',점수:'score','실력 점수':'score',실력점수:'score',스코어:'score',
              주포지션:'line',부포지션:'sub',
              주챔프1:'c1',주챔프2:'c2',주챔프3:'c3'};
  let h=-1, map={};
  for(let i=0;i<Math.min(rows.length,15);i++){
    const cells=(rows[i]||[]).map(c=>String(c??'').trim());
    if(cells.some(c=>c==='아이디')){
      h=i; cells.forEach((c,j)=>{ if(want[c] && map[want[c]]==null) map[want[c]]=j; }); break;   // 중복 헤더는 먼저 나온 열 우선
    }
  }
  if(h<0) throw new Error('"아이디" 열을 찾지 못했습니다. 최신 양식(양식 다운로드)이 맞는지 확인해주세요.');

  const out=[];
  for(let i=h+1;i<rows.length;i++){
    const r=rows[i]||[];
    const at=k=>map[k]==null?'':clean(r[map[k]]);
    const idRaw=map['id']==null?'':String(r[map['id']]??'').trim();
    if(!idRaw||idRaw.startsWith('(예시)')) continue;
    const {name,tag}=splitId(idRaw);
    if(!name) continue;
    out.push({
      name, tag,
      tier:at('tier'), grade:gnum(at('grade')), score:snum(at('score')),
      line:norm(at('line')), sub:normSub(at('sub')),
      champs:[at('c1'),at('c2'),at('c3')].filter(Boolean)
    });
  }
  return out;
}

// SheetJS는 용량이 커서, 엑셀을 실제로 읽을 때만 지연 로드합니다(관전자·팀장에겐 안 받음).
let xlsxLoading=null;
function loadXLSX(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  if(xlsxLoading) return xlsxLoading;
  xlsxLoading=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='/xlsx.full.min.js';
    s.onload=()=>res(window.XLSX);
    s.onerror=()=>{ xlsxLoading=null; rej(new Error('엑셀 처리 모듈을 불러오지 못했습니다')); };
    document.head.appendChild(s);
  });
  return xlsxLoading;
}

async function loadFile(f){
  try{
    const XLSX=await loadXLSX();
    const buf=await f.arrayBuffer();
    // cellHTML은 서식 있는 글자를 HTML로 바꾸는 기능인데, 값만 읽는 우리에겐 쓸모가 없습니다.
    // 켜두면 한컴 한셀이 남긴 전용 태그에서 파싱이 통째로 실패하므로 끕니다.
    // 이미지·손상된 파일은 여기서 SheetJS가 영어로 예외를 던집니다. 원인은 cause로 넘겨 콘솔에만 남깁니다.
    let wb;
    try{ wb=XLSX.read(buf,{type:'array',cellHTML:false}); }
    catch(e){ throw new Error('파일을 읽지 못했습니다. .xlsx·.xls·.csv 파일이 맞는지 확인해주세요.',{cause:e}); }
    const ws=wb.Sheets[wb.SheetNames.find(n=>n.includes('명단'))||wb.SheetNames[0]];
    // sheet_to_json은 시트가 없어도 조용히 빈 배열을 주기 때문에, 여기서 먼저 갈라놓지 않으면
    // "파일을 못 읽음"이 아래쪽 "아이디 열 없음" 문구로 뭉개집니다.
    if(!ws) throw new Error('시트 내용을 읽지 못했습니다. 엑셀이나 구글 시트에서 열어 다시 저장해주세요.');
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,blankrows:false,defval:''});
    if(!rows.length) throw new Error('시트가 비어 있습니다.');
    const list=readSheet(rows);
    if(!list.length) throw new Error('읽을 수 있는 참가자가 없습니다. 예시 행 아래에 입력했는지 확인해주세요.');
    players=list; drawPlayers();
    toast(`${list.length}명을 불러왔습니다`);
  }catch(e){ console.warn('[명단 불러오기]',e); toast(e.message,true); }
}

/* 직접 입력: 아이디(닉네임#태그), 솔랭티어, 클랜티어, 주포, 부포, 주챔프1~3, 클랜점수 */
function addText(){
  let suspect=0;   // 옛 형식(닉네임,태그,주포…)으로 보이는 줄
  const add=$('cPool').value.split('\n').map(x=>x.trim()).filter(Boolean).map(raw=>{
    const p=raw.split(',').map(x=>x.trim());
    const {name,tag}=splitId(p[0]);
    // 2번째 칸(솔랭티어 자리)이 티어가 아닌데 3번째 칸이 포지션이면 옛 순서 붙여넣기로 의심.
    if(p[1] && tierIdx(p[1])<0 && !gnum(p[1]) && norm(p[2])) suspect++;
    return {
      name, tag,
      tier:clean(p[1]),
      grade:gnum(p[2]),
      line:norm(p[3]),
      sub:normSub(p[4]),
      champs:[p[5],p[6],p[7]].map(clean).filter(Boolean),
      score:snum(p[8])
    };
  }).filter(p=>p.name);
  if(!add.length) return toast('추가할 내용이 없습니다',true);
  players=players.concat(add); $('cPool').value=''; poolText=''; drawPlayers();
  if(suspect) toast(`${add.length}명 추가 — 다만 ${suspect}줄이 옛 순서처럼 보입니다. 새 순서(아이디, 솔랭티어, 클랜티어, 주포…)인지 확인하세요.`,true);
  else toast(`${add.length}명을 추가했습니다`);
}

/* 켠 규칙이 요구하는 값 — 설정 화면 전체가 이 목록 하나를 기준으로 판단합니다. */
// shown: 그 값이 이미 다른 곳에 표시되는가. 클랜티어는 색 뱃지(gradeBadge)가 보여주므로
// 마커에서 값을 또 찍지 않고 '없음'만 알립니다. 클랜점수는 마커가 유일한 표시 자리입니다.
const REQ=[
  { key:'grade', rule:'tier',  name:'클랜티어', shown:true,  ok:v=>!!gnum(v) },
  { key:'score', rule:'score', name:'클랜점수', shown:false, ok:v=>!!snum(v) },
];
const activeReq=()=>gameMode==='draft'?REQ.filter(r=>draftRules[r.rule]):[];
// 참가자 행에 붙는 마커. 값이 없으면 빨갛게 알리고, 있으면 그 값을 다른 데서 보여주지 않는 것만 찍습니다.
function reqMark(o){
  return activeReq().map(r=>{
    if(!r.ok(o[r.key])) return `<b style="color:var(--danger)">${r.name} 없음</b> `;
    return r.shown?'':`<b style="color:var(--gold)">${esc(o[r.key])}점</b> `;
  }).join('');
}
// 규칙별 누락 인원. { 클랜티어:{leaders:n,players:n}, ... }
function missingByReq(){
  const names=leaders.filter(l=>l.name.trim());
  const out={};
  activeReq().forEach(r=>{
    out[r.name]={ leaders:names.filter(l=>!r.ok(l[r.key])).length,
                  players:players.filter(p=>!r.ok(p[r.key])).length };
  });
  return out;
}
// 방을 만들 수 없는 이유(없으면 빈 배열). 만들기 버튼과 경고 패널이 함께 씁니다.
function blockers(){
  const out=[];
  const names=leaders.filter(l=>l.name.trim());
  if(names.length<2) out.push('팀장을 2명 이상 입력하세요');
  if(names.length>TEAM_MAX) out.push(`팀장은 최대 ${TEAM_MAX}명까지입니다`);
  if(!players.length) out.push('참가자 명단을 먼저 불러오세요');
  // 드래프트는 전원이 정원을 채워야 끝나므로 매물 수가 모자라면 만들 수 없습니다.
  // 경매는 자리가 빈 채로 끝날 수 있어 이 조건을 걸지 않습니다(서버도 드래프트만 검사).
  const picks=TEAM_SIZE-1;
  if(gameMode==='draft'&&names.length&&players.length&&players.length<names.length*picks){
    out.push(`매물이 부족합니다 (필요 ${names.length*picks}명, 현재 ${players.length}명)`);
  }
  const miss=missingByReq();
  Object.entries(miss).forEach(([n,m])=>{
    if(m.leaders) out.push(`팀장 ${m.leaders}명의 ${n}이 비어 있습니다`);
    if(m.players) out.push(`참가자 ${m.players}명의 ${n}이 비어 있습니다`);
  });
  return out;
}

function drawPlayers(){
  const seen={}, dup=new Set();
  players.forEach(p=>{ const k=p.name+'#'+p.tag; if(seen[k]) dup.add(k); seen[k]=1; });

  $('plist').innerHTML=players.map((p,i)=>`
    <div class="prow ${dup.has(p.name+'#'+p.tag)?'dup':''}">
      <span class="nm">${esc(p.name)}${p.tag?` <i>#${esc(p.tag)}</i>`:''}</span>
      <span><span class="tag t-${p.line}">${esc(p.line)||'-'}</span></span>
      <span class="tr">${reqMark(p)}${gradeBadge(p.grade)} ${p.sub?esc(subLabel(p.sub))+' · ':''}${esc(p.tier)||'솔랭 미상'}</span>
      <span class="ch">${p.champs.map(esc).join(' · ')}</span>
      <button data-rm="${i}" title="삭제" aria-label="${esc(p.name)} 삭제">&times;</button>
    </div>`).join('');

  const byLine=LINES.map(l=>`${l} ${players.filter(p=>p.line===l).length}`).join(' · ');
  const noLine=players.filter(p=>!p.line).length;
  $('psum').innerHTML=players.length
    ? `<b>${players.length}</b><span class="hint">명 · ${byLine}${noLine?` · 미지정 ${noLine}`:''}</span>
       ${dup.size?`<span class="hint" style="color:var(--danger)">중복 ${dup.size}건</span>`:''}
       <button class="btn ghost" id="bWipe" style="margin-left:auto;padding:5px 11px;font-size:var(--fs-xs)">전체 비우기</button>`
    : '<span class="hint">아직 참가자가 없습니다</span>';

  $('plist').querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.rm, p=players[i];
    players.splice(i,1); drawPlayers();
    toastUndo(`${p.name} 삭제됨`,()=>{ players.splice(Math.min(i,players.length),0,p); drawPlayers(); });
  });
  const wipe=$('bWipe');
  // 비우기 전에 대기 중인 되돌리기 토스트를 닫습니다. 그대로 두면 비운 뒤 한 명이 되살아납니다.
  if(wipe) wipe.onclick=()=>askConfirm({title:'참가자 목록을 모두 지울까요?',msg:'불러온 명단이 전부 사라집니다.',confirmLabel:'비우기'}).then(ok=>{ if(ok){ clearTimeout(toastH); $('toast').className='toast'; players=[]; drawPlayers(); } });
  drawTierReq();
}

// 켠 규칙의 확인 패널을 모두 그립니다(둘 다 켜면 둘 다). 만들기 전에 부족한 게 다 보이게 하는 게 목적입니다.
function drawTierReq(){
  const box=$('tierReq');
  // 규칙 패널이 없어도(경매·자유) 막는 이유와 버튼 상태는 갱신해야 합니다.
  if(box) box.innerHTML=activeReq().map(r=>r.rule==='tier'?tierReqHtml():scoreReqHtml()).join('')+blockerHtml();
  syncCreateBtn();
}

// 클랜티어 균형: 밴드별 현재/필요 표 + 누락 인원(둘 다 시작을 막습니다).
function tierReqHtml(){
  const names=leaders.filter(l=>l.name.trim());
  const rows=[0,1,2,3,4].map(b=>{
    const need=names.filter(l=>gradeBand(gnum(l.grade))!==b).length;
    const have=players.filter(p=>gradeBand(p.grade)===b).length;
    return `<span class="treq ${have>=need?'':'bad'}">${b+1} <b>${have}</b>/${need}</span>`;
  }).join('');
  return `<div class="lbl" style="margin:14px 0 6px">클랜티어별 매물 (현재/필요)</div>
    <div class="treqrow">${rows}</div>`;
}

// 클랜점수: 팀장 점수로 정해지는 첫 라운드 예상 순서. 동점이면 시작하자마자 주사위 화면이라 미리 알립니다.
function scoreReqHtml(){
  const names=leaders.filter(l=>l.name.trim());
  const rows=names.map((l,i)=>({l,i,v:snum(l.score)})).filter(o=>o.v);
  // 서버 scoreOrder와 같은 규칙 — 총점(=아직 팀장 점수) 오름차순, 동점은 입력 순서.
  const order=rows.slice().sort((a,b)=>+a.v-+b.v||a.i-b.i)
    .map(({l,v},n)=>`<span class="ordchip"><i>${n+1}</i>${esc(l.name)}<b>${v}</b></span>`).join('');
  const seen={}, dup=new Set();
  rows.forEach(o=>{ if(seen[o.v]) dup.add(o.v); seen[o.v]=1; });
  return `<div class="lbl" style="margin:14px 0 6px">첫 라운드 지명 순서 (팀장 클랜점수 낮은 순)</div>
    <div class="treqrow">${order||'<span class="hint">팀장 클랜점수를 입력하면 순서가 표시됩니다</span>'}</div>
    ${dup.size?`<p class="hint" style="color:var(--gold);margin-top:7px">클랜점수가 같은 팀장이 있어(${[...dup].join('·')}점)
      <b>시작하면 바로 동점 정리 화면</b>이 뜹니다. 🎲 주사위나 '먼저' 지정으로 순서를 정한 뒤 진행됩니다.</p>`:''}`;
}

// 방을 못 만드는 이유를 모아 보여줍니다. 버튼을 누르기 전에 알 수 있어야 합니다.
function blockerHtml(){
  const b=blockers();
  if(!b.length) return '';
  return `<div class="blockbox"><b>${setupMode==='edit'?'저장할 수 없습니다':'방을 만들 수 없습니다'}</b>
    <ul>${b.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
}

// 만들기 버튼을 막고 이유를 옆에 적습니다.
function syncCreateBtn(){
  const btn=$('bCreate'); if(!btn) return;
  const b=blockers();
  btn.disabled=b.length>0;
  btn.title=b.length?b.join(' · '):'';
  const note=$('createNote');
  if(note) note.innerHTML=b.length
    ? `<span style="color:var(--danger)">${b.length}가지를 먼저 해결해야 합니다</span>`
    : setupMode==='edit'
    ? '저장하면 대기 화면으로 돌아갑니다. 명단이 유지된 팀의 링크는 그대로 유효하고, 팀장을 삭제하면 그 팀 링크는 무효화됩니다. 되돌리기 기록은 초기화됩니다.'
    : '만들고 나면 팀장별 접속 링크가 나옵니다. 설정은 이후 방 안의 <b>방 설정 수정</b>으로 시작 전에 바꿀 수 있습니다.';
}

async function createRoom(){
  syncRules();
  const names=leaders.filter(l=>l.name.trim());
  // 팀장 수·매물 수·필수값은 blockers()가 한곳에서 판단합니다(버튼·경고 패널과 같은 기준).
  const b=blockers();
  if(b.length){ drawTierReq(); return toast(b[0],true); }
  const clock=rules.clock;
  if(!(clock>=5&&clock<=300)) return toast('제한 시간은 5~300초여야 합니다',true);

  if(gameMode==='draft'){
    if(draftRules.tier){
      // 각 클랜티어 매물이 그 밴드를 지명해야 하는 팀 수만큼 있는지 확인(서버 검증과 동일).
      for(let i=0;i<5;i++){
        const need=names.filter(l=>gradeBand(gnum(l.grade))!==i).length;
        const have=players.filter(p=>gradeBand(p.grade)===i).length;
        if(have<need) return toast(`클랜티어 ${i+1} 매물이 부족합니다 (필요 ${need}명, 현재 ${have}명)`,true);
      }
    }
    // 드래프트는 포인트를 안 쓰므로 base/minBid는 서버 검증만 통과할 안전값으로 보냅니다.
    const ruleList=[draftRules.tier&&'tier',draftRules.score&&'score'].filter(Boolean);
    return submitRoom({ mode:'draft', rules:ruleList, title:rules.title.trim()||'드래프트',
      base:1000, minBid:10, clock, leaders:names, pool:players });
  }

  // 경매
  const base=rules.base, minBid=rules.minBid;
  if(!(base>=1)) return toast('기본 시작 포인트를 1 이상으로 입력하세요',true);
  if(!(minBid>=1&&minBid<=100000)) return toast('최소 입찰 단위는 1~100000이어야 합니다',true);
  const cfg={ mode:'auction', title:rules.title.trim()||'경매', base, minBid, clock,
    order:rules.order==='draw'?'draw':'random', leaders:names, pool:players };
  const need=(TEAM_SIZE-1)*cfg.minBid;
  const poor=names.filter(l=>(l.points??cfg.base)<need);
  if(poor.length&&!await askConfirm({title:'시작 포인트가 부족합니다',msg:`${poor.map(l=>l.name).join(', ')}의 시작 포인트로는 ${TEAM_SIZE-1}자리를 채울 수 없습니다. 계속할까요?`,confirmLabel:'계속 만들기'})) return;
  return submitRoom(cfg);
}

async function submitRoom(cfg){
  // 수정 모드: 새 방을 만드는 대신 기존 방에 PATCH합니다. 방 코드·유지된 팀 링크는 그대로.
  if(setupMode==='edit'&&editCtx){
    const kept=new Set(cfg.leaders.map(l=>l.id).filter(Boolean));
    const removed=(S&&S.code===editCtx.code)?S.teams.filter(t=>!kept.has(t.id)):[];
    if(removed.length&&!await askConfirm({
      title:'팀 삭제를 포함한 저장',
      msg:`팀장 ${removed.map(t=>t.leader).join(', ')}이(가) 명단에서 빠졌습니다.\n해당 팀의 링크는 즉시 무효화됩니다.\n같은 이름으로 다시 추가해도 새 링크가 발급됩니다.`,
      confirmLabel:'저장'})) return;
    $('bCreate').disabled=true;
    try{
      const r=await fetch(`/api/room/${editCtx.code}?k=${encodeURIComponent(editCtx.hostKey)}`,
        {method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify(cfg)});
      const d=await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d.error||'저장하지 못했습니다');
      links=d;
      // 팀이 추가·삭제됐으면 새 링크를 바로 보여줍니다(기존 팀 링크는 변하지 않음).
      const teamChanged=removed.length>0||cfg.leaders.some(l=>!l.id);
      editing=false; editCtx=null;
      toast('설정을 저장했습니다');
      paint();   // 서버 broadcast(state)와 별개로 즉시 방 화면 복귀
      if(teamChanged) openLinksModal();
    }catch(e){ toast(e.message,true); const b=$('bCreate'); if(b) b.disabled=false; }
    return;
  }
  $('bCreate').disabled=true;
  try{
    let d;
    if(setupMode==='op'){
      // 운영자는 로그인 없이 생성 코드로 만듭니다. 성공하면 코드는 소모됩니다.
      const r=await fetch('/api/room',{method:'POST',headers:{'content-type':'application/json'},
        body:JSON.stringify({...cfg,inviteCode:opCode})});
      d=await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d.error||'방을 만들지 못했습니다');
    }else{
      d=await api('/api/room',{method:'POST',body:JSON.stringify(cfg)});
    }
    links=d; renderLinks(d);
  }catch(e){ if(e.message!=='unauth'){ toast(e.message,true); const b=$('bCreate'); if(b) b.disabled=false; } }
}

function renderLinks(d,again){
  const origin=location.origin;
  const host=`${origin}/#/r/${d.code}?k=${d.hostKey}`;
  const rows=[
    {label:'진행자 (나)', url:host, gold:true},
    ...d.links.map(l=>({label:l.name, url:`${origin}/#/r/${d.code}?t=${l.token}`})),
    {label:'관전용', url:`${origin}/#/r/${d.code}?v=${d.viewKey}`}
  ];
  const opCtx=setupMode==='op';
  const backLabel=managerMode?'매니저 홈':(opCtx?'처음으로':'목록으로');
  $('app').innerHTML=`
  <div class="topbar"><div class="brand">경매방 <span>${again?'링크':'생성됨'}</span></div><div class="code">${d.code}</div>
    <div class="conn"><button class="btn ghost sm" id="bBackList2">${backLabel}</button></div>
  </div>
  <div class="panel">
    <span class="lbl">접속 링크</span>
    <p class="hint" style="margin-bottom:14px">각 팀장에게 <b>자기 링크만</b> 개인 메시지로 보내세요. 링크가 곧 신분이라, 남의 링크를 받으면 그 팀으로 입찰할 수 있습니다.</p>
    ${rows.map((r,i)=>`<div class="link-row">
      <b style="${r.gold?'color:var(--gold)':''}">${esc(r.label)}</b>
      <code>${esc(r.url)}</code>
      <button class="btn" data-copy="${i}">복사</button>
    </div>`).join('')}
  </div>
  <div class="row" style="margin-top:14px">
    <button class="btn gold" id="bGo" style="flex:1;padding:13px">진행자로 입장</button>
    <button class="btn" id="bCopyAll">전체 목록 복사</button>
  </div>
  <p class="hint" style="margin-top:12px">${managerMode
    ?`<b>매니저 홈</b>에서 이 방의 링크를 언제든 다시 볼 수 있습니다. 각 팀장에게는 <b>자기 링크만</b> 보내세요.`
    :opCtx
    ?`받은 <b>생성 코드(${fmtInv(opCode)})를 다시 입력하면</b> 언제든 이 화면으로 돌아올 수 있습니다. 각 팀장에게는 <b>자기 링크만</b> 보내세요.`
    :'링크는 관리자 화면의 <b>링크</b> 버튼으로 언제든 다시 볼 수 있습니다.'} 방과 사진은 만든 지 <b>14일</b>이 지나면 자동 삭제됩니다.</p>`;
  $('bBackList2').onclick=managerMode
    ? renderManager
    : opCtx
    ? ()=>{ go(''); renderLanding(); }
    : renderRooms;

  document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copyText(rows[+b.dataset.copy].url));
  $('bCopyAll').onclick=()=>copyText(rows.map(r=>`${r.label}\n${r.url}`).join('\n\n'));
  $('bGo').onclick=()=>{
    pendingEdit=false;   // 일반 입장 — 이전 '수정' 시도의 잔류값이 폼을 열지 않게
    history.replaceState(null,'',`/#/r/${d.code}?k=${d.hostKey}`);
    $('app').innerHTML='<div class="landing"><p class="hint">입장하는 중입니다…</p></div>';
    connect(d.code,'k='+d.hostKey);
  };
}

/* ═══ 시작 ═══ */
if(roomCode){
  const auth=q.get('k')?`k=${q.get('k')}`
           :q.get('t')?`t=${q.get('t')}`
           :q.get('v')?`v=${q.get('v')}`:null;
  if(!auth){
    $('app').innerHTML=`<div class="landing"><h1>링크가 올바르지 않습니다</h1>
      <p class="hint">진행자가 보낸 링크 전체를 주소창에 붙여넣어야 합니다.</p></div>`;
  }else{
    $('app').innerHTML=`<div class="landing"><h1 class="num" style="color:var(--gold)">${roomCode}</h1>
      <p class="hint">경매방에 접속하는 중입니다…</p></div>`;
    connect(roomCode,auth);
  }
}else if(location.hash.startsWith('#/admin')){
  renderAdmin();
}else if(location.hash.startsWith('#/op')){
  const om=location.hash.match(/^#\/op\/([A-Z0-9]{8})/i);
  if(om){
    $('app').innerHTML='<div class="landing"><p class="hint">생성 코드를 확인하는 중입니다…</p></div>';
    startOperator(om[1]);
  }else renderLanding();
}else{
  renderLanding();
}
</script>
