// 드래프트 전체 지명 수. 점수 모드의 seq.length는 '지금까지 정해진 라운드'까지라 총 지명 수가 아닙니다.
const totalPicks=d=>S.teams.length*(d.picksPerTeam||0);
// 팀 총점 = 팀장 점수 + 지명한 매물 점수 합. 서버 scoreTotals와 동일 규칙(pool 기준).
// 팀마다 pool을 훑으면 정렬 비교자에서 O(팀²×매물)이 되므로 렌더당 한 번만 맵을 만듭니다.
let totalsCache=null;
function teamTotals(){
  if(totalsCache) return totalsCache;
  totalsCache=new Map(S.teams.map(t=>[t.id,t.score||0]));
  S.pool.forEach(p=>{ if(totalsCache.has(p.teamId)) totalsCache.set(p.teamId,totalsCache.get(p.teamId)+(p.score||0)); });
  return totalsCache;
}
const teamTotal=t=>teamTotals().get(t.id)??(t.score||0);
const leftMs=()=>{
  if(!S) return 0;
  if(S.pausedLeft!=null) return S.pausedLeft;
  if(!S.deadline) return 0;
  return Math.max(0,S.deadline-(Date.now()-skew));
};

/* ═══ 화면 ═══ */
function paint(){
  if(!S){ return; }
  if(editing) return;   // 방 설정 수정 중 — 브로드캐스트가 폼을 날리지 않게 렌더를 미룹니다.
  // 음량 슬라이더를 끄는 중 — 여기서 다시 그리면 손잡이가 손에서 빠집니다. 놓을 때 밀린 것을 처리합니다.
  if(volDrag){ paintPending=true; return; }
  if(S.mode==='random'){ rrPaint(); return; }
  totalsCache=null;   // 이번 렌더에서 다시 계산 (상태가 바뀌었으므로)
  // 드래그 도중 재렌더되면 소스 노드가 사라져 dragend가 안 뜨므로, 드래그 시각효과를 여기서 정리.
  document.body.classList.remove('dragging');
  // 브로드캐스트마다 전체를 다시 그리므로, 입력 중이던 값·포커스·커서를 보존합니다.
  // 특히 팀장이 커스텀 입찰 금액을 치는 도중 남이 입찰해도 값이 날아가지 않게 합니다.
  const a=document.activeElement;
  const keep=a&&a.id&&('value' in a)?{id:a.id,val:a.value,s:a.selectionStart,e:a.selectionEnd}:null;
  $('app').innerHTML=topbar()+stage();
  wire();
  renderCardModal();   // 소개 카드 관리 창이 열려 있으면 새 상태로 다시 그립니다(닫혀 있으면 아무것도 안 함)
  if(keep){
    const el=$(keep.id);
    if(el&&('value' in el)){
      el.value=keep.val;
      try{ el.focus(); if(keep.s!=null) el.setSelectionRange(keep.s,keep.e); }catch{}
    }
  }
}

// 대기 화면 한 줄 요약 — 진행자가 시작 버튼을 누르기 전에 눈으로 확인할 자리.
function presLine(){
  if(!presence||!S||S.phase!=='ready'||me.role!=='host'||!S.teams.length) return '';
  const off=leadersOff();
  return `<p class="hint" style="margin:8px 0 0;color:${off.length?'var(--gold)':'var(--ok)'}">${off.length
    ? `팀장 ${leadersOn()}/${S.teams.length} 접속 · 미접속 ${esc(off.map(t=>t.leader).join(', '))}`
    : `팀장 ${S.teams.length}명 전원 접속`}</p>`;
}

/* 시작 전 미접속 팀장 확인. 드래프트는 안 들어온 팀 차례가 와도 시계만 돌다 넘어가고,
   경매는 그 팀이 입찰을 통째로 놓칩니다. 되돌리기가 있긴 하지만 안 겪는 편이 낫습니다.
   대기 상태가 아니거나 전원 접속이면 묻지 않고 그대로 진행합니다. */
async function confirmStart(title){
  if(!S||S.phase!=='ready'||!presence) return true;
  const off=leadersOff();
  if(!off.length) return true;
  return askConfirm({
    title,
    msg:`아직 접속하지 않은 팀장이 ${off.length}명 있습니다.

${off.map(t=>`· ${t.leader} (${t.name})`).join('\n')}

그래도 시작할까요? 🔗 링크에서 미접속 팀 링크를 다시 보낼 수 있습니다.`,
    confirmLabel:'그래도 시작'
  });
}

/* 상단 접속 현황 칩. 팀장이 몇 명 들어와 있는지가 핵심이고 관전 인원은 뒤에 덧붙입니다.
   진행자는 눌러서 링크 모달로 바로 갑니다 — '안 들어왔네' 다음 행동이 링크 재전송이기 때문입니다. */
function presChip(){
  if(presence&&S&&S.mode==='random') return presence.view?`<span class="pres full" title="관전 링크로 보는 사람">👀 관전 ${presence.view}</span>`:'';
  if(!presence||!S||!S.teams.length) return '';
  const on=leadersOn(), all=S.teams.length, off=leadersOff();
  const v=presence.view?` · 관전 ${presence.view}`:'';
  const tip=off.length?`미접속: ${off.map(t=>t.leader).join(', ')}`:'팀장 전원 접속';
  const body=`👥 ${on}/${all}${v}`;
  return me.role==='host'
    ? `<button class="pres ${on>=all?'full':'warn'}" id="bPres" title="${esc(tip)}">${body}</button>`
    : `<span class="pres ${on>=all?'full':'warn'}" title="${esc(tip)}">${body}</span>`;
}

function topbar(){
  const role={host:'진행자',team:myTeam()?myTeam().name:'팀장',view:'관전'}[me.role];
  return `<div class="topbar">
    <div class="brand">${esc(S.title)} <span class="live">LIVE</span></div>
    <div class="code">${S.code}</div>
    <div class="who">${esc(role)}</div>
    <div class="conn">${presChip()}${me.role==='host'?`<button class="btn ghost sm" id="bLinks">🔗 링크</button><button class="sfx-btn ${sfxMuted?'off':''}" id="bSfx" title="연출 소리 켜기/끄기" aria-label="소리 ${sfxMuted?'꺼짐':'켜짐'}">${sfxMuted?'🔇':'🔊'}</button>${S.mode==='random'?'':`<span class="vollb ${sfxMuted?'off':''}" title="브금 음량">🎵</span><input type="range" class="volsl ${sfxMuted?'off':''}" id="bVol" min="0" max="100" step="1" value="${bgmVolToSlider(bgmVol)}" title="브금 음량 ${bgmVolToSlider(bgmVol)}%" aria-label="브금 음량">`}<span class="vollb ${sfxMuted?'off':''}" title="낙찰음·입찰음·초읽기 음량">🔔</span><input type="range" class="volsl ${sfxMuted?'off':''}" id="bSVol" min="0" max="100" step="1" value="${Math.round(sfxVol/SFX_MAX*100)}" title="연출음 음량 ${Math.round(sfxVol/SFX_MAX*100)}%" aria-label="연출음 음량">`:''}<span class="dot ${connected?'on':''}"></span>${connected?'연결됨':'재연결 중…'}</div>
  </div>`;
}

// 진행자 전용: 방 안에서 접속 링크를 모달로 다시 보기. 이번 세션 링크가 없으면(새로고침·북마크) hostKey로 서버 조회.
async function openLinksModal(){
  if(!S||me.role!=='host') return;
  // 캐시된 링크는 '이 방'의 것일 때만 재사용(관리자 목록·내가 만든 방에서 다른 방으로 입장한 경우 방지).
  let d=(links&&links.code===S.code&&links.links)?links:null;
  if(!d){
    try{
      const k=new URLSearchParams(wsAuth).get('k')||'';   // 연결에 쓴 진행자 키 — 모든 입장 경로에서 정확
      const r=await fetch(`/api/room/${S.code}/links?k=${encodeURIComponent(k)}`);
      d=await r.json(); if(!r.ok) throw new Error(d.error||'링크를 불러오지 못했습니다');
      links=d;
    }catch(e){ return toast(e.message||'링크를 불러오지 못했습니다',true); }
  }
  const origin=location.origin;
  // 미접속 팀을 위로 올립니다 — 이 모달을 여는 이유가 '아직 안 들어온 사람에게 링크 다시 보내기'입니다.
  const teamRows=d.links.map(l=>({id:l.id, label:l.name, url:`${origin}/#/r/${d.code}?t=${l.token}`, on:teamOn(l.id), team:true}));
  // 순서는 모달을 연 순간에 한 번만 정하고 닫을 때까지 고정합니다.
  // 접속 상태가 바뀔 때마다 다시 정렬하면, 복사 버튼을 누르는 찰나에 줄이 밀려
  // 남의 팀 링크가 복사됩니다. 링크가 곧 신분이라 그 사고는 되돌릴 수 없습니다.
  if(presence&&!linkOrder) linkOrder=teamRows.slice().sort((a,b)=>(a.on?1:0)-(b.on?1:0)).map(r=>r.id);
  if(linkOrder) teamRows.sort((a,b)=>linkOrder.indexOf(a.id)-linkOrder.indexOf(b.id));
  const rows=[
    {label:'진행자 (나)', url:`${origin}/#/r/${d.code}?k=${d.hostKey}`, gold:true},
    ...teamRows,
    {label:`관전용${presence&&presence.view?` · ${presence.view}명 보는 중`:''}`, url:`${origin}/#/r/${d.code}?v=${d.viewKey}`}
  ];
  const off=leadersOff();
  let m=$('linkmodal');
  if(!m){ m=document.createElement('div'); m.id='linkmodal'; document.body.appendChild(m); }
  m.className='modal-bg';
  m.innerHTML=`<div class="modal">
    <div class="modal-hd"><b>접속 링크</b><button class="btn ghost sm" id="lmClose">닫기</button></div>
    <p class="hint" style="margin-bottom:12px">${S.mode==='random'?'관전 링크는 누구에게나 보내도 됩니다. 진행자 링크는 따로 저장해 두세요.':'각 팀장에게 <b>자기 링크만</b> 개인적으로 보내세요. 링크가 곧 신분입니다.'}</p>
    ${presence&&S.mode!=='random'?`<p class="hint" style="margin-bottom:12px;color:${off.length?'var(--gold)':'var(--ok)'}">${off.length
      ? `아직 안 들어온 팀장 ${off.length}명 — ${esc(off.map(t=>t.leader).join(', '))}. 아래 위쪽 줄의 링크를 다시 보내세요.`
      : '팀장 전원이 접속해 있습니다.'}</p>`:''}
    ${rows.map((r,i)=>`<div class="link-row"><b style="${r.gold?'color:var(--gold)':''}">${r.team&&presence?`<i class="pdot${r.on?' on':''}"></i>`:''}${esc(r.label)}</b><code>${esc(r.url)}</code><button class="btn" data-lcopy="${i}">복사</button></div>`).join('')}
    <div class="row" style="margin-top:12px"><button class="btn" id="lmAll" style="flex:1">전체 목록 복사</button></div>
  </div>`;
  const close=()=>{ linkOrder=null; m.remove(); };   // 다음에 열 때 다시 정렬되게
  $('lmClose').onclick=close;
  m.onclick=e=>{ if(e.target===m) close(); };   // 바깥 어두운 영역 클릭 시 닫기
  m.querySelectorAll('[data-lcopy]').forEach(b=>b.onclick=()=>copyText(rows[+b.dataset.lcopy].url));
  $('lmAll').onclick=()=>copyText(rows.map(r=>`${r.label}\n${r.url}`).join('\n\n'));
}

function stage(){
  return `<div class="stage">
    <div>
      <div class="panel lot" id="lotPanel">${S.mode==='draft'?draftBody():lotBody()}<div class="flash" id="flash"><b></b></div></div>
      <div class="panel sub mt-3">
        <span class="lbl">진행 기록</span>
        <div class="log-list">${S.log.length?S.log.map(l=>l.kind==='sold'
          ?`<div><em>${l.price}P</em><b>${esc(l.player)}</b> → ${esc(l.team)}</div>`
          :l.kind==='assign'
          ?`<div><em style="color:var(--ok)">배정</em><b>${esc(l.player)}</b> → ${esc(l.team)}</div>`
          :l.kind==='pick'
          ?`<div><em style="color:var(--gold)">지명</em><b>${esc(l.player)}</b> → ${esc(l.team)}</div>`
          :l.kind==='roll'
          ?`<div class="lr"><em style="color:var(--gold)">${l.order.some(o=>o.by==='dice')?'🎲':'지정'}</em><span class="lr-b">${
              l.order.map(o=>`<span>${esc(o.n)} 팀 ${o.by==='dice'?`주사위: <b class="num">${o.v}</b>`:o.by==='host'?'— 지정':'— 단독'}</span>`).join('')
            }<b>${l.order.map(o=>esc(o.n)).join(' &gt; ')}</b></span></div>`
          :`<div><em style="color:var(--danger)">유찰</em><b>${esc(l.player)}</b></div>`).join('')
          :'<span class="hint">아직 기록이 없습니다</span>'}</div>
      </div>
    </div>
    <div>
      <div class="teams">${S.teams.map(teamCard).join('')}</div>
      ${poolPanel()}
    </div>
  </div>`;
}

function lotBody(){
  const p=S.pool.find(x=>x.id===S.current);
  if(me.role==='host') ensurePhotoKeys();
  if(!p){
    const nSaved=me.role==='host'?savedTargets().length:0;
    const done=allDone();
    return `<div class="lot-empty">${done
      ? '경매가 끝났습니다<br>아래 팀 구성을 확인하세요'
      : `대기 매물 <b class="num" style="color:var(--gold);font-size:20px">${remaining().length}</b>명<br>${
          me.role==='host'?'다음 매물을 올려주세요':'진행자가 다음 매물을 올리는 중입니다'}`}</div>
      ${done?bracketPanel():''}
      ${(done||S.log.length)?`<div class="row${done?' mt-2':''}"><button class="btn gold" id="bResultImg" style="flex:1">결과 이미지 저장${done?'':' (현재까지)'}</button></div>`:''}
      ${me.role==='host'?`${presLine()}<div class="row mt-2">
        <button class="btn gold" style="flex:1" id="bNext" ${done?'disabled':''}>다음 매물 올리기</button>
        <button class="btn" id="bUndo">되돌리기</button>
      </div>${hostClockCtl()}
      ${!done?`<div class="row mt-2" style="align-items:center">
        ${S.phase==='ready'?'<button class="btn ghost sm" id="bEdit">⚙ 방 설정 수정</button>':''}
        <button class="btn ghost sm cm-entry" id="bCards">🖼 소개 카드 관리</button>
        <span class="hint cm-entry">카드 ${cardRows().filter(x=>x.imgV).length}/${cardRows().length}명${nSaved?` · <b style="color:var(--gold)">저장본 ${nSaved}장 불러오기 가능</b>`:''}</span>
      </div>`:''}
      ${S.log.length?`<div class="row end" style="margin-top:10px">
        <button class="btn danger-soft sm" id="bReset">경매 초기화</button>
      </div>`:''}`:''}`;
  }

  const t=myTeam();
  const mine=S.bid&&t&&S.bid.teamId===t.id;
  const bidTeam=S.bid?S.teams.find(x=>x.id===S.bid.teamId):null;
  const ms=leftMs(), pct=Math.min(100,ms/(S.clock*1000)*100);

  return `${p.imgV?`<img class="lot-img" id="lotImg" tabindex="0" src="/api/room/${S.code}/img/${p.id}?v=${p.imgV}" alt="${esc(p.name)} 소개 카드 (누르면 크게 보기)">`:''}
    <div class="lot-no">LOT ${String(S.pool.filter(x=>x.status==='sold').length+1).padStart(2,'0')}${p.status==='pass'?' <span style="font-size:var(--fs-2xs);font-weight:800;color:#E88A85;background:#2C1817;border-radius:4px;padding:2px 7px;letter-spacing:0;vertical-align:2px">재상정 · 유찰</span>':''}</div>
    <div class="lot-name">${esc(p.name)}${p.tag?`<span style="font-size:.34em;color:var(--muted);font-weight:400"> #${esc(p.tag)}</span>`:''}</div>
    <div class="lot-meta">
      <span class="tag t-${p.line}">${LINES.includes(p.line)?`<img src="/pos/${p.line.toLowerCase()}.png" alt="" style="width:12px;height:12px;vertical-align:-2px;margin-right:3px">`:''}${esc(p.line)||'라인 미지정'}</span>
      ${p.sub?`<span class="hint">부 ${esc(subLabel(p.sub))}</span>`:''}
      ${gradeBadge(p.grade)}
      ${p.tier?`<span class="tier">${esc(p.tier)}</span>`:''}
    </div>
    ${p.champs&&p.champs.length?`<div class="champs">${p.champs.map(c=>`<span>${esc(c)}</span>`).join('')}</div>`:''}
    ${p.msg?`<div class="lot-msg">“${esc(p.msg)}”</div>`:''}
    <div class="hint" style="margin-bottom:16px">잔여 매물 ${remaining().length-1}명</div>

    <div class="clock ${ms<=5000?'hot':''}">
      <b class="num" id="clockVal">${Math.ceil(ms/1000)}</b>
      <div class="bar"><i id="clockBar" style="width:${pct}%"></i></div>
      ${S.pausedLeft!=null?'<span class="hint">일시정지</span>':''}
    </div>

    <div class="high ${mine?'mine':''}">
      ${S.bid
        ? `<div class="who-bid">${esc(bidTeam.name)}${mine?' · 내 입찰':''}</div>
           <div class="amt">${S.bid.amount}<span style="font-size:.42em;color:var(--muted)"> P</span></div>`
        : `<div class="none">아직 입찰이 없습니다 · 시작가 ${S.minNext}P</div>`}
    </div>

    ${me.role==='team'?bidControls(t,mine):''}
    ${me.role==='host'?`<div class="row">
      <button class="btn gold" style="flex:1" id="bSell" ${S.bid?'':'disabled'}>즉시 낙찰</button>
      <button class="btn" id="bPass">유찰</button>
      <button class="btn" id="bPause">${S.pausedLeft!=null?'재개':'일시정지'}</button>
    </div>
    ${hostClockCtl()}
    <div class="row mt-2 cm-entry">
      ${!p.imgV&&photoKeys.has(photoKey(p))?`<button class="btn gold sm" id="bSavedImg" ${bulkBusy?'disabled':''}>저장된 카드 쓰기</button>`:''}
      <button class="btn ghost sm" id="bImg">${p.imgV?'카드 변경':'소개 카드 올리기'}</button>
      ${p.imgV?'<button class="btn ghost sm" id="bImgDel">카드 삭제</button>':''}
      <input type="file" id="imgFile" accept="image/jpeg,image/png,image/webp" hidden>
    </div>
    <p class="hint cm-entry" style="margin:6px 0 0">권장: 가로 16:9 카드 (예: 1200×675). 휴대폰에서는 작게 보이니 큰 글자 위주로, 작은 글자는 눌러서 크게 보는 용도입니다. 한 번 올린 카드는 이 컴퓨터에 보관돼, 다음 경매에서는 다시 올리지 않아도 됩니다.</p>`:''}`;
}

function bidControls(t,mine){
  if(!t) return '';
  if(t.open<=0) return '<div class="hint">로스터를 모두 채웠습니다. 관전만 가능합니다.</div>';
  const base=S.minNext, m=S.minBid, cap=t.cap;
  const cur=S.bid?S.bid.amount:null;
  const steps=[base, base+m*2, base+m*5, base+m*10];
  const blocked=mine||S.pausedLeft!=null;
  const why=mine?'이미 최고 입찰 중입니다'
    :cap<base?`한도 ${cap}P — 더 부를 수 없습니다`
    :`내 한도 ${cap}P · ${t.open}자리 남음`;
  return `<div class="bidpad">${steps.map(v=>`
      <button data-bid="${v}" ${blocked||v>cap?'disabled':''}>${cur!=null&&v>cur?`+${v-cur}<span style="display:block;font-size:var(--fs-2xs);color:var(--muted);font-weight:400">${v}</span>`:v}</button>`).join('')}</div>
    <div class="custom">
      <input type="number" id="custom" class="num" placeholder="직접 입력" min="${base}" max="${cap}" onwheel="this.blur()">
      <button class="btn gold" id="bCustom" ${blocked?'disabled':''}>입찰</button>
    </div>
    ${mine?`<div style="margin-top:10px;background:var(--gold-soft);border:1px solid var(--gold);border-radius:var(--r-md);padding:8px 12px;font-size:var(--fs-sm);font-weight:600;color:var(--gold);text-align:center">✓ ${why}</div>`:`<div class="hint" style="margin-top:9px">${why}</div>`}`;
}

function teamCard(t){
  const draft=S.mode==='draft';
  // 팀장 접속 여부. presence가 아직 없으면(첫 프레임) 아무것도 그리지 않습니다.
  const tOn=teamOn(t.id);
  const pdot=`<i class="pdot${presence?(tOn?' on':''):' idle'}"${presence&&tOn?' role="img" title="팀장 접속 중" aria-label="팀장 접속 중"':' aria-hidden="true"'}></i>`;
  const poff=(presence&&!tOn)?'<span class="poff">미접속</span>':'';
  const mineT=me.teamId===t.id, top=!draft&&S.bid&&S.bid.teamId===t.id;
  const curId=(draft&&S.phase==='live'&&S.draft)?S.draft.seq[S.draft.ptr]:null;
  const turn=curId===t.id;
  const lgBand=draft?gradeBand(t.grade):-1;
  // 드래프트 명단은 풀에서 직접 읽어 등급·라인이 항상 실리게 함(예전 지명분도 티어 표시).
  const roster=draft?S.pool.filter(p=>p.teamId===t.id):t.players;
  const pct=t.start?Math.round(t.points/t.start*100):0;
  const slots=Array.from({length:S.size-1},(_,i)=>{
    const pl=t.players[i];
    return pl?`<div class="slot on" style="color:var(--${(pl.line||'none').toLowerCase()})">${pl.line||'●'}</div>`
             :'<div class="slot">빈자리</div>';
  }).join('');
  const sc=scoreMode();
  const ptBlock=sc
    ? `<div class="team-pt"><b>${teamTotal(t)}</b><i>총점</i></div>`
    : draft
    ? `<div class="team-pt"><b>${t.players.length}${S.draft?'/'+S.draft.picksPerTeam:''}</b></div>`
    : `<div class="team-pt"><b>${t.points}</b><i>POINT</i></div>`;
  // 팀장 줄 부제: 이름은 팀 이름이(‘{팀장} 팀’), 라인은 아래 ★ 명단 줄 아이콘이 이미 말하므로
  // 켠 규칙의 팀장 값(둘 다면 둘 다)·경매의 다른 시작 포인트만 남깁니다.
  const leadMeta=(draft
    ? [tierMode()&&lgBand>=0?`클랜티어 ${lgBand+1}`:'', sc?`클랜점수 ${t.score??0}`:'']
    : [t.start!==S.base?`시작 ${t.start}P`:'']).filter(Boolean).join(' · ');
  // 명단 오른쪽 값: 켠 규칙이 요구하는 값을 보여줍니다. 둘 다 켜면 클랜티어 태그 + 클랜점수 —
  // 누가 어느 밴드를 채웠는지 알 수 없으면 남은 지명을 계획할 수 없습니다.
  const tier=tierMode();
  const rosterVal=(o,line,price='')=>{
    if(!draft) return price+posIcon(line);
    if(tier&&sc) return tierTag(o.grade)+(o.score??0)+posIcon(line);
    if(sc) return (o.score??0)+posIcon(line);
    return tierTag(o.grade)+posIcon(line);
  };
  const tierRow=tier
    ? `<div class="tierrow">${[0,1,2,3,4].map(b=>{
        const filled=teamBandsClient(t).has(b);
        const st=filled?` style="background:${GRADE_COLORS[b]};border-color:${GRADE_COLORS[b]};color:#0A1017"`:'';
        return `<span class="tchip ${filled?'on':''}"${st}>${b+1}</span>`;
      }).join('')}</div>` : '';
  const dropAttr=(me.role==='host'&&!draft&&t.open>0&&!S.current)?`data-team-drop="${t.id}"`:'';
  return `<div class="team ${mineT?'me':''} ${top?'top':''} ${turn?'turn':''} ${t.open<=0&&!allDone()?'full':''}" ${dropAttr}>
    <div class="team-hd">
      <div><div class="team-nm"${mineT?' style="color:var(--gold)"':''}>${pdot}<span class="tn">${esc(t.name)}</span>${mineT?'<span class="my-badge">MY</span>':''}${turn?'<span class="turn-badge">지명중</span>':''}${top?`<span class="turn-badge" style="background:var(--ok)">최고 ${S.bid.amount}P</span>`:''}${poff}</div>
      <div class="team-lead">${leadMeta}</div></div>
      ${ptBlock}
    </div>
    ${draft?'':`<div class="gauge"><i style="width:${pct}%"></i></div>`}
    ${tierRow}
    <div class="slots">${slots}</div>
    <div class="roster">
      <div class="lead"><b><i class="lead-star">★</i>${esc(t.leader)}</b><span>${rosterVal(t,t.leaderLine)}</span></div>
      ${roster.map(p=>`<div><b>${esc(p.name)}</b><span>${rosterVal(p,p.line,p.price)}</span></div>`).join('')}
      ${(!draft&&t.open>0)?`<div style="font-size:var(--fs-2xs)">한도 ${t.cap}P · ${t.open}자리 남음</div>`:''}
    </div>
  </div>`;
}

// 드래프트 첫 순서 상태를 팀 구성과 맞춰 초기화(서버 baseOrder 우선, 없으면 등록 순서).
function ensureDraftOrder(){
  const ids=S.teams.map(t=>t.id);
  const valid=draftOrder&&draftOrder.length===ids.length&&new Set(draftOrder).size===ids.length&&draftOrder.every(id=>ids.includes(id));
  if(!valid){
    const b=S.draft&&S.draft.baseOrder;
    draftOrder=(b&&b.length===ids.length&&new Set(b).size===ids.length&&b.every(id=>ids.includes(id)))?b.slice():ids;
  }
}

// 진행 중 '지명 차례' 띠. 현재 지명 중인 팀부터 8칩을 라운드 경계와 무관하게 쭉 이어서 보여줍니다.
// 순번·라운드 같은 부가 정보는 싣지 않습니다 — 칩의 나열 순서가 곧 지명 순서이고,
// 전체 진행도는 위의 ROUND/PICK이, '내 차례까지 몇 픽'은 아래 안내문이 담당합니다.
// 점수 모드는 예외로 확정된 라운드까지만 보여줍니다 — 다음 라운드 순서는 라운드가 끝나야
// 총점으로 확정되므로, 그 전의 '예상 순서'는 픽마다 바뀌는 미확정 정보라 싣지 않습니다.
function nextTurnBar(d){
  const all=totalPicks(d);
  const SHOW=8;   // 현재 포함 8칩 — 그 뒤는 +N픽으로 줄입니다
  const ids=[];
  for(let i=d.ptr;i<d.seq.length&&ids.length<SHOW;i++) ids.push({id:d.seq[i],now:i===d.ptr});
  const items=ids.map(({id,now})=>{
    const t=S.teams.find(x=>x.id===id);
    if(!t) return '';
    const mine=me.teamId===t.id;
    return `<span class="turn-item${now?' now':''}${mine?' mine':''}">${esc(t.leader)}${mine?'<i class="turn-me">나</i>':''}</span>`;
  }).filter(Boolean);
  if(!items.length) return `<div class="turnbar"><span class="turn-lb">순서</span><span class="turn-more">마지막 지명입니다</span></div>`;
  const more=all-(d.ptr+items.length);
  return `<div class="turnbar"><span class="turn-lb">순서</span>${
    items.join('')}${more>0?`<span class="turn-more">+${more}픽</span>`:''}</div>`;
}

// 서버 scoreOrder와 동일 규칙 — 총점 오름차순, 동점은 주어진 우선순위(baseOrder) 순.
function scoreOrderClient(base){
  return S.teams.slice()
    .sort((a,b)=>teamTotal(a)-teamTotal(b)||base.indexOf(a.id)-base.indexOf(b.id))
    .map(t=>t.id);
}

// 내 차례가 몇 픽 뒤인지(팀장 화면 안내용). 현재 차례거나 남은 차례가 없으면 0.
function picksUntilMyTurn(d){
  if(!me.teamId) return 0;
  for(let i=d.ptr+1;i<d.seq.length;i++) if(d.seq[i]===me.teamId) return i-d.ptr;
  return 0;
}

// 대진 패널 — 팀 구성이 끝난 뒤(done) 무작위 1:1 대진을 보여줍니다. 추첨·재추첨은 진행자만.
function bracketPanel(){
  const host=me.role==='host';
  if(!S.bracket){
    if(!host||S.teams.length<2) return '';
    return `<div class="row mt-2"><button class="btn gold" id="bBracket" style="flex:1">🎲 대진 추첨</button></div>`;
  }
  const rows=S.bracket.pairs.map(([a,b],i)=>`<div class="match-row" style="--i:${i}">
      <i class="match-no">${i+1}</i>
      <span class="match-t${me.teamId===a?' me':''}">${esc(teamName(a))}</span>
      <b class="match-vs">VS</b>
      <span class="match-t r${me.teamId===b?' me':''}">${esc(teamName(b))}</span>
    </div>`).join('');
  const bye=S.bracket.bye?`<div class="match-row bye" style="--i:${S.bracket.pairs.length}">
      <i class="match-no">·</i>
      <span class="match-t${me.teamId===S.bracket.bye?' me':''}">${esc(teamName(S.bracket.bye))}</span>
      <b class="match-vs">부전승</b>
    </div>`:'';
  return `<div class="mt-3">
    <div class="lbl" style="margin-bottom:6px">대진표</div>
    ${rows}${bye}
    ${host?`<div class="row end"><button class="btn ghost sm" id="bBracket">🎲 다시 추첨</button></div>`:''}
  </div>`;
}

// 총점 동점 정리 화면. 진행자는 주사위를 굴리거나 특정 팀장을 먼저 뽑게 지정할 수 있고,
// 팀장·관전자는 누가 동점인지와 대기 중임을 봅니다. 정리 전에는 지명이 막힙니다.
function tieBody(d){
  const host=me.role==='host';
  const nm=id=>{ const t=S.teams.find(x=>x.id===id); return t?t.leader:id; };
  const groups=d.tie.groups.map((g,gi)=>{
    const chosen=tiePick[gi]||[];
    const rows=g.ids.map(id=>{
      const n=chosen.indexOf(id);
      const mine=me.teamId===id;
      return `<div class="ord-row${mine?' me':''}">
        <span class="ord-n">${n>=0?n+1:'·'}</span>
        <span class="ord-nm">${esc(nm(id))} 팀${mine?' <b style="color:var(--gold)">(나)</b>':''}</span>
        ${host?`<span class="ord-btns"><button class="btn ghost" data-tiefirst="${gi}:${id}" ${n>=0?'disabled':''}>먼저</button></span>`:''}
      </div>`;
    }).join('');
    return `<div style="margin-bottom:12px">
      <div class="lbl" style="margin-bottom:6px">총점 <b class="num" style="color:var(--gold)">${g.total}</b> 동점 ${g.ids.length}팀</div>
      <div class="ord-list">${rows}</div>
      ${host&&chosen.length?`<div class="row" style="margin-top:6px"><button class="btn ghost" data-tieclear="${gi}" style="padding:4px 12px;font-size:var(--fs-xs)">지정 취소</button></div>`:''}
    </div>`;
  }).join('');
  const anyPick=tiePick.some(a=>a&&a.length);
  return `<div class="lot-empty" style="padding:16px 20px">🎲 총점 동점<br>ROUND ${d.tie.round} 지명 순서를 정해야 합니다</div>
    ${groups}
    ${host
      ? `<p class="hint" style="margin:9px 0 12px">주사위를 굴리면 동점 팀 순서를 무작위로 정합니다. <b>먼저</b>를 눌러 특정 팀장을 앞에 지정할 수도 있고, 지정하지 않은 팀은 주사위로 정해집니다.</p>
         <div class="row">
           <button class="btn gold" style="flex:1" id="bTieRoll">🎲 주사위 굴리기</button>
           ${anyPick?'<button class="btn gold" style="flex:1" id="bTieApply">지정한 순서로 진행</button>':''}
         </div>`
      : `<p class="hint" style="margin:9px 0">총점이 같은 팀이 있어 진행자가 순서를 정하는 중입니다.</p>`}`;
}

// 드래프트 진행판(경매의 lotBody 자리). 준비/진행/완료 단계별로 그립니다.
function draftBody(){
  const d=S.draft||{seq:[],ptr:0,balance:'free',picksPerTeam:0};
  if(S.phase==='ready'){
    ensureDraftOrder();
    const host=me.role==='host';
    const nm=id=>{ const t=S.teams.find(x=>x.id===id); return t?t.leader:id; };
    const sc=scoreMode();
    let list;
    if(sc){
      // 점수 모드: 실제 첫 라운드 순서(총점 낮은 순)를 리스트 하나로 보여줍니다.
      // 동점 팀은 골드 브래킷으로만 표시합니다 — 순서 조정 UI를 여기 두지 않는 이유:
      // 서버는 총점이 같으면 무조건 동점 정리 화면(주사위·지정)에서 공개적으로 정하므로,
      // 준비 화면에서 미리 정한 순서는 실제 지명에 반영되지 않습니다.
      const sorted=scoreOrderClient(draftOrder);
      const totals=new Map(S.teams.map(t=>[t.id,teamTotal(t)]));
      const cnt={}; sorted.forEach(id=>{ const v=totals.get(id); cnt[v]=(cnt[v]||0)+1; });
      list=sorted.map((id,i)=>{
        const v=totals.get(id);
        const tied=cnt[v]>1;
        return `<div class="ord-row${tied?' tied':''}">
          <span class="ord-n">${i+1}</span>
          <span class="ord-nm">${esc(nm(id))} 팀${me.teamId===id?' <b style="color:var(--gold)">(나)</b>':''}</span>
          ${tied?'<span class="tie-badge">동점</span>':''}
          <span class="ord-pt">${v}</span>
        </div>`;
      }).join('');
    }else{
      list=draftOrder.map((id,i)=>`<div class="ord-row">
        <span class="ord-n">${i+1}</span>
        <span class="ord-nm">${esc(nm(id))} 팀${me.teamId===id?' <b style="color:var(--gold)">(나)</b>':''}</span>
        ${host?`<span class="ord-btns"><button class="btn ghost" data-ordup="${i}" ${i===0?'disabled':''}>▲</button><button class="btn ghost" data-orddn="${i}" ${i===draftOrder.length-1?'disabled':''}>▼</button></span>`:''}
      </div>`).join('');
    }
    const anyTie=sc&&(()=>{ const seen={}; return S.teams.some(t=>{ const v=teamTotal(t); if(seen[v]) return true; seen[v]=1; return false; }); })();
    return `<div class="lot-empty" style="padding:16px 20px">${rulesLabel(d)} 드래프트<br>${S.pool.length}명 · ${S.teams.length}팀 · 팀당 ${d.picksPerTeam}명</div>
      <div class="row" style="align-items:center;margin-bottom:8px"><span class="lbl" style="margin:0">${sc?'첫 라운드 지명 순서 (총점 낮은 순)':'첫 지명 순서'}</span>${host&&!sc?`<button class="btn ghost sm" id="bDraw" style="margin-left:auto">🎲 추첨</button>`:''}</div>
      <div class="ord-list">${list}</div>
      ${host
        ? `<p class="hint" style="margin:9px 0 12px">${sc
            ? `매 라운드 <b>총점이 낮은 팀부터</b> 지명합니다.${anyTie?' 총점이 같은 팀이 있어 <b>시작하면 동점 정리 화면</b>이 뜹니다 — 🎲 주사위나 <b>먼저</b> 지정으로 모두가 보는 앞에서 순서를 정합니다.':' 총점이 같아지면 진행이 멈추고 그 자리에서 🎲 주사위나 지정으로 순서를 정합니다.'}`
            : '추첨을 누르면 모두가 보는 앞에서 순서가 정해집니다. ▲▼로 직접 조정도 가능하고, 이후는 스네이크(다음 라운드부터 역순)로 진행됩니다.'}</p>
           ${presLine()}
           <div class="row"><button class="btn gold" style="flex:1" id="bStartDraft">${sc?'드래프트 시작':'이 순서로 드래프트 시작'}</button></div>
           <div class="row mt-2"><button class="btn ghost sm" id="bEdit">⚙ 방 설정 수정</button></div>`
        : `<p class="hint" style="margin:9px 0">진행자가 순서를 정하고 곧 시작합니다.</p>`}`;
  }
  if(S.phase==='done'){
    return `<div class="lot-empty">드래프트 완료<br>아래 팀 구성을 확인하세요</div>
      ${bracketPanel()}
      <div class="row mt-2"><button class="btn gold" id="bResultImg" style="flex:1">결과 이미지 저장</button></div>
      ${me.role==='host'?`<div class="row end" style="margin-top:8px">
        <button class="btn" id="bUndo">되돌리기</button>
        <button class="btn danger-soft sm" id="bReset">드래프트 초기화</button>
      </div>`:''}`;
  }
  // 총점 동점 정리 대기 — 순서가 아직 정해지지 않아 지명을 받지 않습니다.
  if(d.tie) return tieBody(d);
  // 진행 중
  const curId=d.seq[d.ptr];
  const t=S.teams.find(x=>x.id===curId);
  const myTurn=!!me.teamId&&me.teamId===curId;
  const ms=leftMs(), over=ms<=0, pct=Math.max(0,Math.min(100,ms/(S.clock*1000)*100));
  const round=Math.floor(d.ptr/S.teams.length)+1;
  const wait=picksUntilMyTurn(d);
  let need='';
  if(tierMode()&&t){
    const rem=[0,1,2,3,4].filter(b=>!teamBandsClient(t).has(b)).map(b=>b+1);
    need=` · 지명할 클랜티어 <b style="color:var(--gold)">${rem.join('·')}</b>`;
  }
  return `<div class="lot-no">ROUND ${round}/${d.picksPerTeam} · PICK ${d.ptr+1}/${totalPicks(d)}</div>
    <div class="lot-name" style="font-size:clamp(26px,4vw,42px)">${esc(t?t.leader:'')} <span style="font-size:.5em;color:var(--muted)">팀 차례</span></div>
    <div class="hint" style="margin-bottom:12px">${rulesLabel(d)} 드래프트${need}</div>
    <div class="clock ${ms<=5000?'hot':''}">
      <b class="num" id="clockVal">${Math.max(0,Math.ceil(ms/1000))}</b>
      <div class="bar"><i id="clockBar" style="width:${pct}%"></i></div>
      ${S.pausedLeft!=null?'<span class="hint" style="color:var(--gold)">일시정지</span>':over?'<span class="hint" style="color:var(--danger)">시간 초과 · 지명 대기</span>':''}
    </div>
    ${nextTurnBar(d)}
    <div class="hint" style="margin-top:14px">${
      myTurn?'<b style="color:var(--gold)">내 차례입니다.</b> 오른쪽 남은 매물에서 선수를 눌러 지명하세요.'
      :me.role==='host'?'현재 팀장이 고르는 중입니다. 오른쪽 매물을 클릭하면 진행자가 대신 지명합니다.'
      :wait>0?`다른 팀 차례입니다. <b style="color:var(--gold)">내 차례까지 ${wait}픽</b> 남았습니다.`
      :'다른 팀 차례입니다. 남은 매물을 살펴보세요.'}</div>
    ${me.role==='host'?`<div class="row end mt-3">
      <button class="btn sm" id="bPause">${S.pausedLeft!=null?'재개':'일시정지'}</button>
      <button class="btn sm" id="bUndo">되돌리기</button>
      <button class="btn danger-soft sm" id="bReset">초기화</button>
    </div>${hostClockCtl()}`:''}`;
}

// 순서대로 다음에 나올 매물 목록(현재 제외). 추첨(draw)이면 확정 순서, 아니면 pool 순서.
// 대기 매물을 앞에, 유찰(재상정 예정) 매물을 뒤에 붙여 남은 매물 수와 목록이 일치하게 합니다.
function nextUpList(){
  const byId={}; S.pool.forEach(p=>byId[p.id]=p);
  const seq=((S.orderMode==='draw'&&S.order)?S.order:S.pool.map(p=>p.id)).map(id=>byId[id]).filter(Boolean);
  const wait=seq.filter(p=>p.status==='wait'&&p.id!==S.current);
  const pass=seq.filter(p=>p.status==='pass'&&p.id!==S.current);
  return wait.concat(pass);
}

// 남은 매물 패널 — 모든 역할이 봅니다(진행자만 클릭해 상정, 나머지는 미리보기).
// 칩에 티어(색)·모스트 챔피언·실력 등급을 함께 보여주고, 순서/포지션/티어로 정렬·그룹.
function poolPanel(){
  const host=me.role==='host';
  const live=!!S.current;
  const draft=S.mode==='draft';
  // 동점 정리 중에는 순서가 없어 서버가 지명을 거부합니다. 카드를 누를 수 있게 두면 안 됩니다.
  const dLive=draft&&S.phase==='live'&&!!S.draft&&!S.draft.tie;
  const curId=dLive?S.draft.seq[S.draft.ptr]:null;
  const iCanPick=dLive&&(host||me.teamId===curId);   // 지금 지명할 수 있는 사람인가
  const curTeam=curId?S.teams.find(x=>x.id===curId):null;
  const draw=S.orderMode==='draw';
  const rem=remaining().filter(p=>p.id!==S.current);
  const posline=LINES.map(l=>`${l} ${rem.filter(p=>p.line===l).length}`).join(' · ');
  const noline=rem.filter(p=>!p.line).length;
  const sc=scoreMode(), tier=tierMode();
  // 챔피언·한마디 줄은 방에 그 데이터가 하나라도 있을 때만 전 칩에 깔립니다(비어도 자리 유지 →
  // 카드 크기 통일). 아무도 안 쓰는 방은 옛 2줄 칩 그대로 — 빈 줄로 세로 공간을 낭비하지 않게.
  const anyCh=S.pool.some(p=>p.champs&&p.champs.length), anyMsg=S.pool.some(p=>p.msg);
  const chip=p=>{
    // 2줄 카드: 윗줄 닉네임·값, 아랫줄 주포/부포·솔랭티어.
    // 테두리 색 = 클랜티어색 우선, 없으면 솔랭티어색, 둘 다 없으면 무채색.
    const gc=gradeColor(p.grade);
    const hasG=p.grade!=null&&p.grade!=='';
    const bc=gc||tierColor(p.tier)||'var(--line)';
    // 오른쪽 위 값: 켠 규칙이 요구하는 것을 보여줍니다. 둘 다 켜면 둘 다 —
    // 클랜티어는 지명 가능 여부를 결정하므로 점수만 보여주면 왜 못 뽑는지 알 수 없습니다.
    const tv=tier&&hasG?`<span class="pc-gr" style="color:${gc}">${esc(p.grade)}</span>`:'';
    const svv=sc?`<span class="pc-gr" style="color:var(--gold)">${p.score??0}</span>`:'';
    const topVal=(tv||svv)?tv+svv
      :hasG?`<span class="pc-gr" style="color:${gc}">${esc(p.grade)}</span>`
      :p.status==='pass'?'<span class="pc-pass">유찰</span>':'';
    const inner=`<div class="pc-top">
        <span class="pc-nm">${esc(p.name)}</span>
        ${topVal}
      </div>
      <div class="pc-bot">
        <span class="pc-line">${esc(p.line)||'-'}${p.sub?`<span class="pc-sub">/${esc(subLabel(p.sub))}</span>`:''}${topVal&&p.status==='pass'?' <span class="pc-pass">유찰</span>':''}</span>
        <span class="pc-tier">${esc(p.tier)||'-'}</span>
      </div>${
      // 말줄임으로 잘릴 수 있는 줄은 title로 전문을 답니다. 빈 칸은 &nbsp;로 높이만 유지.
      anyCh?(()=>{ const chs=(p.champs||[]).join(' · ');
        return `<div class="pc-ch"${chs?` title="${esc(chs)}"`:''}>${chs?esc(chs):'&nbsp;'}</div>`; })():''}${
      anyMsg?`<div class="pc-msg"${p.msg?` title="${esc(p.msg)}"`:''}>${p.msg?`“${esc(p.msg)}”`:'&nbsp;'}</div>`:''}`;
    const bst=`style="border-color:${bc};border-left-width:4px"`;
    // 진행자는 매물이 없을 때 카드를 팀으로 드래그해 배정할 수 있습니다.
    const drag=(host&&!live&&!draft)?`draggable="true" data-dpid="${p.id}"`:'';
    if(draft){
      // 드래프트: 내 차례(또는 진행자)면 적격 매물에 지명 버튼, 아니면 표시만.
      let eligible=iCanPick&&p.status!=='sold';
      if(eligible&&tierMode()&&curTeam){ const b=gradeBand(p.grade); eligible=b>=0&&!teamBandsClient(curTeam).has(b); }
      return eligible
        ? `<button class="pcard pick" data-pick="${p.id}" ${bst}>${inner}</button>`
        : `<span class="pcard" ${bst}>${inner}</span>`;
    }
    return host
      ? `<button class="pcard" data-lot="${p.id}" ${drag} ${bst} ${live?'disabled':''}>${inner}</button>`
      : `<span class="pcard" ${bst}>${inner}</span>`;
  };
  const poolDiv=arr=>`<div class="pool">${arr.length?arr.map(chip).join(''):'<span class="hint">남은 매물이 없습니다</span>'}</div>`;
  // 그룹 렌더 공용: [[라벨, 배열], …] → 헤더+칩. 빈 그룹은 숨김.
  const renderGroups=groups=>{ const shown=groups.filter(([,a])=>a.length);
    return shown.length?shown.map(([label,a])=>`<div class="pgroup">${label} · ${a.length}</div>${poolDiv(a)}`).join(''):'<span class="hint">남은 매물이 없습니다</span>'; };

  // 점수순 보기는 점수 드래프트에만 있습니다. 다른 방으로 넘어와 버튼이 없는데도 남아 있으면
  // 헤더가 잘못 표시되므로, 파생값을 고치는 대신 전역 자체를 등록순으로 되돌립니다.
  if(poolView==='score'&&!sc) poolView='order';
  // 그룹 안 기본 정렬: 강한 순(높→낮) — 클랜티어(1이 상위, 없으면 뒤) → 클랜점수(높은 순, 없으면 뒤)
  // → 솔랭(상위 순). 옵션 없이 모든 그룹 보기가 이 순서를 씁니다. 등록순(순서) 보기만 예외.
  const byStrong=(a,b)=>{
    // ''는 구데이터에 남을 수 있는 "없음" 값 — gradeBand·chip의 hasG 가드와 같게 뒤로 보냅니다.
    const ga=a.grade==null||a.grade===''?99:Number(a.grade), gb=b.grade==null||b.grade===''?99:Number(b.grade);
    if(ga!==gb) return ga-gb;
    const sa=a.score==null?-1:a.score, sb=b.score==null?-1:b.score;
    if(sa!==sb) return sb-sa;
    return tierRank(b.tier)-tierRank(a.tier);
  };
  let body;
  if(poolView==='pos'){
    body=renderGroups(LINES.map(l=>[l,rem.filter(p=>p.line===l).sort(byStrong)])
         .concat([['미지정',rem.filter(p=>!p.line).sort(byStrong)]]));
  }else if(poolView==='tier'){
    // 티어별 그룹(상위→하위), 그룹 내 LP·단수 정렬(동순위는 강한 순). 못 알아본 티어는 '미분류'.
    const tg=TIERS.map((t,i)=>[t.k[0], rem.filter(p=>tierIdx(p.tier)===i).sort((a,b)=>tierRank(b.tier)-tierRank(a.tier)||byStrong(a,b))])
             .concat([['미분류', rem.filter(p=>tierIdx(p.tier)<0).sort(byStrong)]]);
    body=renderGroups(tg);
  }else if(poolView==='grade'){
    // 등급 구간별 그룹(1티어 상위), 그룹 내 강한 순(소수 오름차순 → 같으면 점수 높은 순).
    // gradeBand로 완전분할 → 범위 밖·구데이터 등 어떤 값도 누락 없이 한 그룹에만 속함(카운트=목록 일치).
    const gg=[0,1,2,3,4].map(b=>[`클랜티어 ${b+1}`, rem.filter(p=>gradeBand(p.grade)===b).sort(byStrong)])
             .concat([['클랜티어 미정', rem.filter(p=>gradeBand(p.grade)<0).sort(byStrong)]]);
    body=renderGroups(gg);
  }else if(poolView==='score'){
    // 점수 내림차순(높을수록 강함, 동점은 강한 순). 점수 없는 매물은 뒤로 모읍니다.
    const has=rem.filter(p=>p.score!=null).sort((a,b)=>b.score-a.score||byStrong(a,b));
    body=renderGroups([['클랜점수순',has],['클랜점수 미정',rem.filter(p=>p.score==null).sort(byStrong)]]);
  }else{
    body=poolDiv(draw?nextUpList():rem);
  }
  return `<div class="panel" style="margin-top:12px">
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <span class="lbl" style="margin:0">${draw&&poolView==='order'?'매물 순서':'남은 매물'} <b class="num" style="color:var(--gold);font-size:var(--fs-md)">${rem.length}</b></span>
      <div class="psort" role="group" aria-label="매물 정렬">
        <button id="pv-order" data-pv="order" aria-pressed="${poolView==='order'}" class="${poolView==='order'?'on':''}">${draw?'순서':'등록순'}</button>
        <button id="pv-pos" data-pv="pos" aria-pressed="${poolView==='pos'}" class="${poolView==='pos'?'on':''}">포지션</button>
        <button id="pv-tier" data-pv="tier" aria-pressed="${poolView==='tier'}" class="${poolView==='tier'?'on':''}">솔랭</button>
        <button id="pv-grade" data-pv="grade" aria-pressed="${poolView==='grade'}" class="${poolView==='grade'?'on':''}">클랜티어</button>
        ${sc?`<button id="pv-score" data-pv="score" aria-pressed="${poolView==='score'}" class="${poolView==='score'?'on':''}">클랜점수</button>`:''}
      </div>
    </div>
    <div style="display:flex;gap:9px;flex-wrap:wrap;align-items:center;font-size:var(--fs-2xs);color:var(--muted);margin:8px 0 2px"><b style="letter-spacing:.06em">클랜티어색</b>${GRADE_COLORS.map((c,i)=>`<span><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${c};vertical-align:-1px"></i> ${i+1}</span>`).join('')}<span style="color:#5A6B7C">·</span><span>낮을수록 상위</span></div>
    <div class="hint" style="margin:4px 0 8px">${posline}${noline?` · 미지정 ${noline}`:''}${host&&live?' · <span style="color:var(--gold)">현재 매물 마무리 후 선택 가능</span>':(host&&!draft)?' · <span style="color:var(--gold)">카드를 팀으로 끌어다 놓으면 0P로 배정됩니다</span>':''}</div>
    ${body}
  </div>`;
}

// 진행자 전용: 진행 중에도 제한 시간을 5초 단위로 조정.
function hostClockCtl(){
  return `<div class="row" style="margin-top:8px;align-items:center;gap:8px">
    <span class="hint" style="text-transform:none;letter-spacing:0">제한시간 <b style="color:var(--gold)">${S.clock}</b>초</span>
    <button class="btn ghost" id="bClkDn" style="padding:4px 12px" ${S.clock<=5?'disabled':''}>−5</button>
    <button class="btn ghost" id="bClkUp" style="padding:4px 12px" ${S.clock>=300?'disabled':''}>+5</button>
  </div>`;
}

// A-4: 최종 결과를 한 장 이미지(PNG)로 저장.
// 경매는 낙찰가·잔여 포인트, 드래프트는 지명 수·티어를 싣습니다.
function saveResultImage(){
  // 드래프트는 포인트 개념이 없습니다(price 0, base 더미). 웹 팀 명단과 같은 표기를 씁니다.
  const draft=S.mode==='draft';
  const perTeam=(draft&&S.draft)?S.draft.picksPerTeam:0;
  // 드래프트 명단은 teamCard와 같이 풀에서 읽습니다(t.players에 등급이 없는 예전 지명분 대비).
  const rosterOf=t=>draft?S.pool.filter(p=>p.teamId===t.id):t.players;
  const sc=scoreMode();
  const teams=S.teams, dpr=2, colW=300, pad=28, headH=96, rowH=30, gap=16;
  const cols=Math.min(teams.length,4), rowsN=Math.ceil(teams.length/cols);
  const maxP=Math.max(0,...teams.map(t=>rosterOf(t).length));
  const cardH=64+(1+maxP)*rowH+16;
  // 대진표가 있으면 팀 카드 아래에 한 구역을 더 그립니다.
  const br=S.bracket;
  const brRows=br?br.pairs.length+(br.bye?1:0):0;
  const brH=br?(14+22+brRows*26):0;
  const W=pad*2+cols*colW+(cols-1)*gap, H=headH+rowsN*cardH+(rowsN-1)*gap+brH+pad;
  const cv=document.createElement('canvas'); cv.width=W*dpr; cv.height=H*dpr;
  const x=cv.getContext('2d'); x.scale(dpr,dpr); x.textBaseline='top';
  const rr=(X,Y,w,h,r)=>{x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();};
  // 색은 전부 :root 토큰에서 읽습니다 — CSS 팔레트를 바꾸면 결과 이미지도 함께 바뀝니다.
  const C={bg:cssVar('--bg'),panel:cssVar('--panel'),line:cssVar('--line'),
    text:cssVar('--text'),muted:cssVar('--none'),gold:cssVar('--gold')};
  x.fillStyle=C.bg; x.fillRect(0,0,W,H);
  x.fillStyle=C.text; x.font='700 26px sans-serif'; x.fillText(S.title,pad,26,W-pad*2);
  x.fillStyle=C.gold; x.font='700 13px sans-serif';
  x.fillText((draft?'드래프트 결과 · ':'경매 결과 · ')+new Date().toLocaleString('ko-KR',{year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}),pad,62);
  const POS=Object.fromEntries(LINES.map(l=>[l,cssVar('--'+l.toLowerCase())]));
  teams.forEach((t,i)=>{
    const cx=pad+(i%cols)*(colW+gap), cy=headH+Math.floor(i/cols)*(cardH+gap);
    x.fillStyle=C.panel; rr(cx,cy,colW,cardH,10); x.fill();
    x.strokeStyle=C.line; x.lineWidth=1; x.stroke();
    x.fillStyle=C.text; x.font='700 17px sans-serif'; x.fillText(t.name,cx+16,cy+13,colW-32);
    x.font='12px sans-serif'; x.fillStyle=C.gold; x.textAlign='right';
    x.fillText(sc?('총점 '+teamTotal(t))
      :draft?(rosterOf(t).length+(perTeam?'/'+perTeam:'')+' 지명')
      :('잔여 '+t.points+'P'),cx+colW-16,cy+38,90); x.textAlign='left';
    const tier=tierMode();
    let ry=cy+64;
    // 오른쪽 끝 값: 경매는 낙찰가, 드래프트는 켠 규칙의 값(둘 다면 클랜티어 + 클랜점수).
    // 팀 카드의 rosterVal과 같은 선택 규칙입니다(엔티티에서 직접 읽습니다).
    const rightVal=(o,ry2)=>{
      x.font='600 13px sans-serif'; x.textAlign='right';
      if(!draft){ x.fillStyle=C.gold; x.fillText(o.price+'P',cx+colW-16,ry2,80); x.textAlign='left'; return; }
      let right=cx+colW-16;
      if(sc){ x.fillStyle=C.gold; x.fillText((o.score??0)+'점',right,ry2,60); right-=46; }
      if(tier){ const b=gradeBand(o.grade); if(b>=0){ x.fillStyle=GRADE_COLORS[b]; x.fillText('T'+(b+1),right,ry2,34); } }
      x.textAlign='left';
    };
    x.fillStyle=C.gold; x.font='600 13px sans-serif'; x.fillText('★ '+t.leader,cx+16,ry,colW-70);
    if(draft) rightVal(t,ry);
    ry+=rowH;
    rosterOf(t).forEach(pl=>{
      x.fillStyle=POS[pl.line]||C.muted; x.fillRect(cx+16,ry+3,3,13);
      x.fillStyle=C.text; x.font='13px sans-serif'; x.fillText(pl.name,cx+26,ry,colW-130);
      rightVal(pl,ry);
      ry+=rowH;
    });
  });
  if(br){
    let by=headH+rowsN*cardH+(rowsN-1)*gap+14;
    x.fillStyle=C.gold; x.font='700 13px sans-serif'; x.fillText('대진표',pad,by); by+=22;
    br.pairs.forEach(([a,b],i)=>{
      x.fillStyle=C.text; x.font='13px sans-serif';
      x.fillText(`${i+1}.  ${teamName(a)}   VS   ${teamName(b)}`,pad,by,W-pad*2); by+=26;
    });
    if(br.bye){ x.fillStyle=C.muted; x.font='13px sans-serif'; x.fillText(`·  ${teamName(br.bye)} — 부전승`,pad,by,W-pad*2); }
  }
  cv.toBlob(b=>{
    if(!b) return toast('이미지를 만들지 못했습니다',true);
    const url=URL.createObjectURL(b), a=document.createElement('a');
    a.href=url; a.download=`${draft?'드래프트결과':'경매결과'}_${S.code}.png`; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    toast('결과 이미지를 저장했습니다');
  },'image/png');
}

function wire(){
  const on=(id,fn)=>{ const el=$(id); if(el) el.onclick=fn; };
  // 대기 상태에서 첫 매물을 올리는 순간이 사실상 '시작'입니다. 안 들어온 팀장이 있으면 한 번 물어봅니다.
  on('bNext',async()=>{
    const first=S&&S.phase==='ready';   // 브금은 '시작'에만 — 매물마다 다시 틀지 않습니다
    if(!await confirmStart('경매를 시작할까요?')) return;
    if(first) bgmStart();   // 클릭 흐름 안에서 재생해야 브라우저 자동재생 차단에 걸리지 않습니다
    send('lot');
  });
  on('bUndo',()=>send('undo'));
  on('bSfx',()=>{
    sfxMuted=!sfxMuted;
    try{ localStorage.setItem('sfxMuted',sfxMuted?'1':'0'); }catch{}
    const b=$('bSfx'); if(b){ b.textContent=sfxMuted?'🔇':'🔊'; b.classList.toggle('off',sfxMuted); b.setAttribute('aria-label','소리 '+(sfxMuted?'꺼짐':'켜짐')); }
    // 켤 때: 사용자 제스처로 오디오 잠금을 풀고, 컨텍스트가 running이 되면 짧은 확인음.
    if(!sfxMuted){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); const blip=()=>tone(880,0,.09,.05); actx.state==='running'?blip():actx.resume().then(blip).catch(()=>{}); }catch{} }
    bgmSync();   // 음소거하면 브금도 멈추고, 다시 켜면 멈춘 자리에서 이어집니다
  });
  on('bReset',()=>{ const draft=S&&S.mode==='draft';
    const msg=draft
      ? '드래프트를 처음 상태로 초기화할까요?\n\n모든 지명 기록이 지워지고 지명 순서가 새로 추첨됩니다.\n(매물·팀·소개 카드·링크는 그대로 유지됩니다. 초기화 직후에는 되돌리기로 복구할 수 있습니다.)'
      : '경매를 처음 상태로 초기화할까요?\n\n모든 낙찰·유찰·입찰 기록이 지워지고 팀 포인트가 원래대로 돌아갑니다.\n(매물·팀·소개 카드·링크는 그대로 유지됩니다. 초기화 직후에는 되돌리기로 복구할 수 있습니다.)';
    askConfirm({title:(S&&S.mode==='draft')?'드래프트를 초기화할까요?':'경매를 초기화할까요?',msg,confirmLabel:'초기화'}).then(ok=>{ if(ok) send('reset'); }); });
  on('bStartDraft',async()=>{
    if(!await confirmStart('드래프트를 시작할까요?')) return;
    bgmStart();
    send('startdraft',{order:draftOrder});
  });
  on('bEdit',openRoomEdit);
  on('bBracket',()=>{
    if(S.bracket){
      askConfirm({title:'대진을 다시 추첨할까요?',msg:'현재 대진표가 지워지고 새로 추첨됩니다.\n(직후 되돌리기로 이전 대진을 복구할 수 있습니다.)',confirmLabel:'다시 추첨'})
        .then(ok=>{ if(ok) send('bracket'); });
    } else send('bracket');
  });
  on('bDraw',()=>send('draworder'));
  on('bLinks',openLinksModal);
  // 음량은 onclick이 아니라 oninput으로 받습니다 — 끌면서 바로 귀로 확인해야 맞출 수 있습니다.
  // 놓는 처리는 window 리스너(volDragEnd)가 맡습니다.
  const wireVol=(id,label,apply)=>{
    const v=$(id); if(!v) return;
    v.oninput=()=>{ apply(+v.value); v.title=`${label} ${v.value}%`; };
    v.onpointerdown=()=>{ volDrag=true; };
  };
  wireVol('bVol','브금 음량',n=>bgmSetVol(bgmSliderToVol(n)));
  wireVol('bSVol','연출음 음량',n=>sfxSetVol(n/100*SFX_MAX));
  on('bPres',openLinksModal);   // 접속 현황 칩 → 미접속 팀 링크를 바로 다시 보낼 수 있게
  document.querySelectorAll('[data-ordup]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.ordup; if(draftOrder&&i>0){ [draftOrder[i-1],draftOrder[i]]=[draftOrder[i],draftOrder[i-1]]; paint(); } });
  document.querySelectorAll('[data-orddn]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.orddn; if(draftOrder&&i<draftOrder.length-1){ [draftOrder[i],draftOrder[i+1]]=[draftOrder[i+1],draftOrder[i]]; paint(); } });
  // 동점 정리: '먼저'로 지정한 순서를 모아두고, 주사위나 지정 적용으로 서버에 보냅니다.
  document.querySelectorAll('[data-tiefirst]').forEach(b=>b.onclick=()=>{
    const [gi,id]=b.dataset.tiefirst.split(':');
    (tiePick[+gi]=tiePick[+gi]||[]).push(id); paint();
  });
  document.querySelectorAll('[data-tieclear]').forEach(b=>b.onclick=()=>{ tiePick[+b.dataset.tieclear]=[]; paint(); });
  on('bTieRoll',()=>{ tiePick=[]; send('tiebreak'); });
  on('bTieApply',()=>{ send('tiebreak',{order:tiePick.flat().filter(Boolean)}); tiePick=[]; });
  on('bSell',()=>send('sell'));
  on('bPass',()=>{ if(S.bid){ askConfirm({title:'유찰 처리할까요?',msg:`최고 입찰 ${S.bid.amount}P가 있습니다. 유찰하면 이 매물은 뒤로 밀립니다.`,confirmLabel:'유찰'}).then(ok=>{ if(ok) send('pass'); }); return; } send('pass'); });
  on('bPause',()=>send(S.pausedLeft!=null?'resume':'pause'));
  on('bClkDn',()=>send('setclock',{clock:Math.max(5,S.clock-5)}));
  on('bClkUp',()=>send('setclock',{clock:Math.min(300,S.clock+5)}));
  on('bResultImg',saveResultImage);
  const doCustom=()=>{
    const v=+$('custom').value;
    if(!v) return toast('금액을 입력하세요',true);
    send('bid',{amount:v});
  };
  on('bCustom',doCustom);
  const custom=$('custom');
  if(custom) custom.onkeydown=e=>{ if(e.key==='Enter') doCustom(); };
  document.querySelectorAll('[data-bid]').forEach(b=>b.onclick=()=>send('bid',{amount:+b.dataset.bid}));
  document.querySelectorAll('[data-lot]').forEach(b=>b.onclick=()=>send('lot',{id:b.dataset.lot}));
  document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>send('pick',{playerId:b.dataset.pick,ptr:S.draft?S.draft.ptr:-1}));
  // 유찰/대기 카드 → 팀 카드로 드래그해 0P 배정 (진행자, 매물 없을 때)
  // 전용 타입(application/x-dpid)을 실어, 외부 텍스트·링크 드래그는 무시합니다.
  const isCard=e=>e.dataTransfer.types.includes('application/x-dpid');
  document.querySelectorAll('[data-dpid]').forEach(el=>{
    el.addEventListener('dragstart',e=>{ e.dataTransfer.setData('application/x-dpid',el.dataset.dpid); e.dataTransfer.setData('text/plain',el.dataset.dpid); e.dataTransfer.effectAllowed='move'; document.body.classList.add('dragging'); });
    el.addEventListener('dragend',()=>{ document.body.classList.remove('dragging'); document.querySelectorAll('.drop-ok').forEach(x=>x.classList.remove('drop-ok'));
      if(presDirty){ presDirty=false; repaintPresence(); } });
  });
  document.querySelectorAll('[data-team-drop]').forEach(el=>{
    el.addEventListener('dragover',e=>{ if(!isCard(e)) return; e.preventDefault(); e.dataTransfer.dropEffect='move'; el.classList.add('drop-ok'); });
    el.addEventListener('dragleave',()=>el.classList.remove('drop-ok'));
    el.addEventListener('drop',e=>{ el.classList.remove('drop-ok'); if(!isCard(e)) return; e.preventDefault();
      const pid=e.dataTransfer.getData('application/x-dpid');
      if(/^p\d+$/.test(pid)) send('assign',{playerId:pid,teamId:el.dataset.teamDrop});
    });
  });
  document.querySelectorAll('[data-pv]').forEach(b=>b.onclick=()=>{
    // 정렬 토글은 전체 재렌더라, 팀장이 입력 중이던 커스텀 금액을 보존합니다.
    const c=$('custom'), cv=c?c.value:'', cs=c?c.selectionStart:null;
    poolView=b.dataset.pv; paint();
    const c2=$('custom');
    if(c2&&cv){ c2.value=cv; try{ if(cs!=null) c2.setSelectionRange(cs,cs); }catch{} }
    const bb=$('pv-'+poolView); if(bb) bb.focus();
  });
  // 업로드 대상 pid를 "버튼 클릭 시점"에 고정합니다. 파일 탐색기를 여는 사이
  // 매물이 바뀌어도 엉뚱한 선수에게 사진이 붙지 않게 합니다.
  on('bImg',()=>{ const f=$('imgFile'); if(f){ f.dataset.pid=S.current||''; f.click(); } });
  const imgFile=$('imgFile');
  if(imgFile) imgFile.onchange=e=>{ const f=e.target.files[0]; const pid=e.target.dataset.pid; if(f) uploadImg(f,pid); e.target.value=''; };
  on('bCards',openCardModal);
  on('bSavedImg',()=>{ const p=S.pool.find(x=>x.id===S.current); if(p) uploadSaved([p]); });
  const li=$('lotImg');
  if(li){ li.onclick=()=>openImg(li.src,li.alt); li.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openImg(li.src,li.alt); } }; }
  on('bImgDel',()=>{ if(S.current) deleteCard(S.current); });
}

async function deleteCard(pid){
  const p=S.pool.find(x=>x.id===pid);
  if(!p) return;
  if(!await askConfirm({title:`${p.name}의 소개 카드를 지울까요?`,msg:'업로드한 카드와 이 브라우저에 저장된 카드가 함께 삭제됩니다.',confirmLabel:'삭제'})) return;
  try{
    const r=await fetch(`/api/room/${S.code}/img/${pid}?${wsAuth}`,{method:'DELETE'});
    if(!r.ok) throw new Error((await r.json().catch(()=>({}))).error||'삭제하지 못했습니다');
    // 서버 방송이 이 응답보다 먼저 와서 이미 다시 그렸을 수 있어, 보관함에서 뺀 뒤 한 번 더 그립니다.
    if(window.indexedDB){ forgetPhoto(p); paint(); }
    toast('카드를 지웠습니다');
  }catch(e){ toast(e.message,true); }
}

/* ═══ 소개 카드 관리 (진행자) ═══
   경매 전·매물 사이에 선수별 카드를 미리 올리는 창. #app 밖(body)에 붙어 있어 방송 재렌더에도
   열린 채로 남고, paint()가 끝날 때 renderCardModal()로 내용만 새로 그립니다. */
let cardReport=null, bulkMsg='';
const cardRows=()=>S.pool.filter(p=>p.status!=='sold');   // 낙찰된 선수는 다시 화면에 나오지 않으므로 제외
const cardNorm=s=>String(s||'').toLowerCase().replace(/\s+/g,'');   // 파일 이름 매칭용: 대소문자·띄어쓰기 무시
function openCardModal(){
  if(!S||me.role!=='host') return;
  ensurePhotoKeys();
  let m=$('cardmodal');
  if(!m){ m=document.createElement('div'); m.id='cardmodal'; m.className='modal-bg'; m.tabIndex=-1; document.body.appendChild(m);
    m.onclick=e=>{ if(e.target===m) closeCardModal(); };
    // 크게 보기가 위에 떠 있으면 Esc는 그것만 닫습니다.
    m.onkeydown=e=>{ if(e.key==='Escape'&&!document.querySelector('.img-lb')) closeCardModal(); }; }
  renderCardModal();
  m.focus();
}
function closeCardModal(){
  if(bulkBusy) return toast('카드를 올리는 중입니다. 끝난 뒤 닫아주세요',true);
  const m=$('cardmodal'); if(m) m.remove(); cardReport=null;
}
function renderCardModal(){
  const m=$('cardmodal'); if(!m||!S) return;
  if(me.role!=='host'||S.mode==='draft'){ m.remove(); return; }
  const old=m.querySelector('.modal'), st=old?old.scrollTop:0;
  const rows=cardRows(), have=rows.filter(p=>p.imgV).length, nSaved=savedTargets().length, busy=bulkBusy?'disabled':'';
  const list=a=>a.map(x=>`<code>${esc(x)}</code>`).join(' ');
  const rep=cardReport;
  m.innerHTML=`<div class="modal" style="max-width:640px">
    <div class="modal-hd"><b>소개 카드 관리 <span class="hint" style="font-weight:400">· 카드 ${have}/${rows.length}명</span></b><button class="btn ghost sm" id="cmClose">닫기</button></div>
    <ul class="cm-help hint">
      <li>카드는 경매 화면에서 선수 이름 위에 표시되고, 누르면 크게 보입니다. <b>가로 16:9 (예: 1200×675)</b>를 권장하며, 올리면 자동으로 줄여서 저장합니다.</li>
      <li><b>여러 장 한꺼번에</b>: 파일 이름을 선수 닉네임으로 맞춘 뒤 여러 파일을 함께 고르면 이름이 맞는 선수에게 자동으로 붙습니다. 예) <code>Alpha.png</code> 또는 <code>Alpha#KR1.png</code>. 같은 닉네임이 두 명 이상이면 <code>#태그</code>까지 써야 합니다. 대소문자·띄어쓰기는 구분하지 않고, 이미 카드가 있는 선수는 새 파일로 바뀝니다.</li>
      <li><b>다음 경매에서는 다시 올릴 필요 없음</b>: 한 번 올린 카드는 지금 쓰는 컴퓨터에 자동으로 보관됩니다. 다음 경매 명단에 같은 선수(닉네임#태그가 같은 선수)가 있으면 <b>저장된 카드 불러오기</b> 버튼 하나로 한꺼번에 붙습니다. 단, 다른 컴퓨터·다른 브라우저(예: 크롬 → 엣지)·시크릿 창에서 진행하면 보관된 카드가 없으니 새로 올려야 합니다.</li>
    </ul>
    <div class="row" style="margin:12px 0 10px">
      <button class="btn gold sm" id="cmMulti" ${busy}>여러 장 한꺼번에 올리기</button>
      <button class="btn sm" id="cmSaved" ${bulkBusy||!nSaved?'disabled':''}>저장된 카드 ${nSaved}장 불러오기</button>
      <input type="file" id="cmFiles" accept="image/jpeg,image/png,image/webp" multiple hidden>
      <input type="file" id="cmFile" accept="image/jpeg,image/png,image/webp" hidden>
    </div>
    ${bulkBusy?`<p class="cm-report" style="color:var(--gold)">${esc(bulkMsg||'카드를 올리는 중…')}</p>`:''}
    ${rep?`<div class="cm-report">
      <b style="color:${rep.fail.length||rep.miss.length||rep.amb.length?'var(--gold)':'var(--ok)'}">${rep.ok}장을 올렸습니다${rep.dup?` (같은 선수의 파일이 여러 개라 ${rep.dup}개는 건너뜀)`:''}</b>
      ${rep.amb.length?`<div>닉네임이 같은 선수가 여러 명이라 <b>#태그</b>를 붙여야 합니다: ${list(rep.amb)}</div>`:''}
      ${rep.miss.length?`<div>이름이 맞는 선수가 없습니다(낙찰된 선수 제외): ${list(rep.miss)}</div>`:''}
      ${rep.fail.length?`<div style="color:var(--danger)">올리지 못했습니다: ${list(rep.fail)}</div>`:''}
    </div>`:''}
    <div class="cm-list">${rows.length?rows.map(p=>{
      const saved=!p.imgV&&photoKeys.has(photoKey(p));
      return `<div class="cm-row">
        ${p.imgV?`<img class="cm-th" data-cmview="${p.id}" tabindex="0" src="/api/room/${S.code}/img/${p.id}?v=${p.imgV}" alt="${esc(p.name)} 소개 카드 (누르면 크게 보기)">`:'<span class="cm-th none">카드 없음</span>'}
        <div class="cm-nm"><b>${esc(p.name)}${p.tag?`<span class="hint" style="font-weight:400"> #${esc(p.tag)}</span>`:''}</b><span class="hint">${esc(p.line)||'라인 미지정'}${p.id===S.current?' · <b style="color:var(--gold)">경매 중</b>':''}${p.status==='pass'?' · 유찰':''}</span></div>
        <div class="cm-act">
          ${saved?`<button class="btn sm" data-cmsaved="${p.id}" ${busy}>저장본 쓰기</button>`:''}
          <button class="btn ghost sm" data-cmup="${p.id}" ${busy}>${p.imgV?'변경':'올리기'}</button>
          ${p.imgV?`<button class="btn ghost sm" data-cmdel="${p.id}" ${busy}>삭제</button>`:''}
        </div>
      </div>`; }).join(''):'<span class="hint">남은 매물이 없습니다</span>'}</div>
  </div>`;
  $('cmClose').onclick=closeCardModal;
  $('cmMulti').onclick=()=>$('cmFiles').click();
  $('cmFiles').onchange=e=>{ const fs=[...e.target.files]; e.target.value=''; if(fs.length) uploadMany(fs); };
  $('cmSaved').onclick=()=>uploadSaved(savedTargets());
  // 대상 pid는 버튼을 누른 시점에 고정합니다(파일 탐색기를 여는 사이 목록이 다시 그려져도 안전).
  m.querySelectorAll('[data-cmup]').forEach(b=>b.onclick=()=>{ const f=$('cmFile'); f.dataset.pid=b.dataset.cmup; f.click(); });
  $('cmFile').onchange=e=>{ const f=e.target.files[0], pid=e.target.dataset.pid; e.target.value=''; if(f&&pid) uploadImg(f,pid); };
  m.querySelectorAll('[data-cmsaved]').forEach(b=>b.onclick=()=>{ const p=S.pool.find(x=>x.id===b.dataset.cmsaved); if(p) uploadSaved([p]); });
  m.querySelectorAll('[data-cmdel]').forEach(b=>b.onclick=()=>deleteCard(b.dataset.cmdel));
  m.querySelectorAll('[data-cmview]').forEach(im=>{ const go=()=>openImg(im.src,im.alt);
    im.onclick=go; im.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); } }; });
  m.querySelector('.modal').scrollTop=st;
}
// 파일 이름(확장자 제외)으로 선수를 찾아 차례로 올립니다. '닉네임#태그'면 정확히, '닉네임'이면 동명이인이 없을 때만.
async function uploadMany(files){
  if(bulkBusy) return;
  const rows=cardRows(), byFull=new Map(), byName=new Map();
  rows.forEach(p=>{ byFull.set(cardNorm(p.name+'#'+(p.tag||'')),p); const k=cardNorm(p.name); byName.set(k,(byName.get(k)||[]).concat(p)); });
  const miss=[], amb=[], jobs=new Map();
  let matched=0;
  for(const f of files){
    const k=cardNorm(f.name.replace(/\.[^.]+$/,''));
    let p=null;
    if(k.includes('#')) p=byFull.get(k)||null;
    else{ const c=byName.get(k)||[]; if(c.length>1){ amb.push(f.name); continue; } p=c[0]||null; }
    if(!p){ miss.push(f.name); continue; }
    matched++; jobs.set(p.id,[f,p]);   // 같은 선수 파일이 여러 개면 마지막 것
  }
  bulkBusy=true; cardReport=null;
  let ok=0, i=0; const fail=[];
  for(const [f,p] of jobs.values()){
    bulkMsg=`카드를 올리는 중… ${++i}/${jobs.size} · ${p.name}`; renderCardModal();
    try{ await uploadCardFile(f,p.id); ok++; }catch(e){ fail.push(`${f.name} — ${e.message}`); }
  }
  bulkBusy=false; bulkMsg='';
  cardReport={ok,miss,amb,fail,dup:matched-jobs.size};
  paint(); renderCardModal();
  toast(`카드 ${ok}장을 올렸습니다${miss.length+amb.length+fail.length?` · 확인 필요 ${miss.length+amb.length+fail.length}개`:''}`,ok===0);
}

/* 소개 카드 크게 보기. 아무 데나 누르거나 Esc로 닫습니다.
   재렌더(입찰 방송)는 #app만 다시 그리므로 body에 붙인 이 창은 유지됩니다. */
function openImg(src,alt){
  if(document.querySelector('.img-lb')) return;
  const m=document.createElement('div'); m.className='img-lb'; m.tabIndex=-1;
  m.innerHTML='<img>'; const im=m.querySelector('img'); im.src=src; im.alt=alt||'';
  const close=()=>{ m.remove(); document.removeEventListener('keydown',onKey); };
  const onKey=e=>{ if(e.key==='Escape') close(); };
  m.onclick=close; document.addEventListener('keydown',onKey);
  document.body.appendChild(m); m.focus();
}

/* 진행자 브라우저 사진 보관함(IndexedDB). 키는 닉네임#태그라서 새 방에서도 같은 사람이면 다시 씁니다.
   서버로 보내지 않고 이 브라우저에만 남습니다. Safari 호환을 위해 Blob 대신 {type, ArrayBuffer}로 저장합니다. */
const photoKey=p=>(p.name+'#'+(p.tag||'')).trim().toLowerCase();
const photoDB=(()=>{
  let dbp=null;
  const open=()=>dbp||(dbp=new Promise((res,rej)=>{
    const r=indexedDB.open('lol-auction',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('photos');
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>{ dbp=null; rej(r.error); };
  }));
  const run=(mode,fn)=>open().then(db=>new Promise((res,rej)=>{
    const tx=db.transaction('photos',mode), q=fn(tx.objectStore('photos'));
    tx.oncomplete=()=>res(q.result); tx.onerror=tx.onabort=()=>rej(tx.error);
  }));
  return {
    get:k=>run('readonly',s=>s.get(k)),
    put:(k,v)=>run('readwrite',s=>s.put(v,k)),
    del:k=>run('readwrite',s=>s.delete(k)),
    keys:()=>run('readonly',s=>s.getAllKeys()),
  };
})();
// 렌더는 동기라서 저장된 키 목록을 메모리에 들고 있습니다. 진행자 화면에서 처음 그릴 때 한 번 읽습니다.
let photoKeys=new Set(), photoKeysLoaded=false, bulkBusy=false;
function ensurePhotoKeys(){
  if(photoKeysLoaded||!window.indexedDB) return;
  photoKeysLoaded=true;
  photoDB.keys().then(ks=>{ photoKeys=new Set(ks); if(ks.length) paint(); }).catch(()=>{});
}
const savedTargets=()=>S.pool.filter(p=>!p.imgV&&p.status!=='sold'&&photoKeys.has(photoKey(p)));
function savePhoto(p,blob){
  const k=photoKey(p);
  blob.arrayBuffer().then(buf=>photoDB.put(k,{type:blob.type,buf})).then(()=>photoKeys.add(k)).catch(()=>{});
}
function forgetPhoto(p){
  const k=photoKey(p);
  photoKeys.delete(k);
  photoDB.del(k).catch(()=>{});
}
async function postImg(pid,blob){
  const r=await fetch(`/api/room/${S.code}/img/${pid}?${wsAuth}`,
    {method:'POST',headers:{'content-type':blob.type},body:blob});
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error||'업로드에 실패했습니다');
}
// 저장된 사진을 순서대로 올립니다. 한 장마다 방송이 와서 화면의 남은 장수가 줄어듭니다.
async function uploadSaved(list){
  if(bulkBusy||!list.length) return;
  bulkBusy=true; cardReport=null; paint();
  let ok=0, fail=0, i=0;
  for(const p of list){
    bulkMsg=`저장된 카드를 올리는 중… ${++i}/${list.length} · ${p.name}`; renderCardModal();
    try{
      const rec=await photoDB.get(photoKey(p));
      if(!rec){ photoKeys.delete(photoKey(p)); fail++; continue; }
      await postImg(p.id,new Blob([rec.buf],{type:rec.type}));
      ok++;
    }catch{ fail++; }
  }
  bulkBusy=false; bulkMsg=''; paint(); renderCardModal();
  toast(fail?`카드 ${ok}장을 올렸습니다 (${fail}장 실패)`:`저장된 카드 ${ok}장을 올렸습니다`,fail>0&&!ok);
}

/* 진행자 전용: 소개 카드를 브라우저에서 줄여서(최대 1200px·195KB) 올리고, 이 브라우저 보관함에도 저장합니다 */
async function uploadCardFile(file,pid){
  const blob=await shrinkImage(file);
  await postImg(pid,blob);
  const p=S.pool.find(x=>x.id===pid);
  if(p&&window.indexedDB) savePhoto(p,blob);
}
async function uploadImg(file,pid){
  pid=pid||(S&&S.current);
  if(!pid) return toast('경매 중인 매물이 없습니다',true);
  try{ await uploadCardFile(file,pid); toast('카드를 올렸습니다'); }
  catch(e){ toast(e.message,true); }
}
// 카드에는 글자가 있어 JPEG 저화질에서 번집니다. WebP 저장을 지원하면 WebP로, 아니면(일부 Safari) JPEG로.
// 지원하지 않는 브라우저는 요청을 무시하고 PNG를 돌려주므로 결과 형식으로 판별합니다.
const IMG_FMT=(()=>{ try{ const c=document.createElement('canvas'); c.width=c.height=1;
  return c.toDataURL('image/webp').startsWith('data:image/webp')?'image/webp':'image/jpeg'; }catch{ return 'image/jpeg'; } })();
const IMG_MAX_SIDE=1200, IMG_MAX_BYTES=195*1024;   // 서버 한도 200KB보다 살짝 작게
function shrinkImage(file){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{
      URL.revokeObjectURL(img.src);
      const sc=Math.min(1,IMG_MAX_SIDE/Math.max(img.width,img.height));
      const cv=document.createElement('canvas');
      cv.width=Math.max(1,Math.round(img.width*sc));
      cv.height=Math.max(1,Math.round(img.height*sc));
      const ctx=cv.getContext('2d');
      // JPEG는 투명도가 없으므로 PNG/WebP 투명 배경을 흰색으로 채웁니다(검게 나오는 것 방지). WebP도 같은 결과로 맞춥니다.
      ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height);
      ctx.drawImage(img,0,0,cv.width,cv.height);
      const tryQ=qs=>{
        if(!qs.length) return rej(new Error('이미지를 충분히 줄이지 못했습니다. 더 작거나 단순한 카드로 올려주세요'));
        cv.toBlob(b=>{ b&&b.type===IMG_FMT&&b.size<=IMG_MAX_BYTES ? res(b) : tryQ(qs.slice(1)); },IMG_FMT,qs[0]);
      };
      tryQ([.85,.7,.5,.35]);
    };
    img.onerror=()=>{ URL.revokeObjectURL(img.src); rej(new Error('이미지 파일을 읽지 못했습니다')); };
    img.src=URL.createObjectURL(file);
  });
}

/* 시계는 다시 그리지 않고 숫자만 갱신 */
let lastTick=0;
setInterval(()=>{
  // 경매(현재 매물) 또는 진행 중 드래프트에서 초읽기 갱신.
  const running = S && (S.current || (S.mode==='draft' && S.phase==='live'));
  if(!running){ lastTick=0; return; }
  const v=$('clockVal'), bar=$('clockBar');
  if(!v) return;
  const ms=leftMs();
  const sec=Math.max(0,Math.ceil(ms/1000));
  v.textContent=sec;
  if(bar) bar.style.width=Math.max(0,Math.min(100,ms/(S.clock*1000)*100))+'%';
  v.parentElement.classList.toggle('hot',ms<=5000);
  // 마지막 3·2·1초 긴장 틱(진행자 화면, 음소거 아닐 때). 입찰로 시간이 늘면 다시 울립니다.
  if(S.pausedLeft==null && sec>=1 && sec<=3 && sec!==lastTick && sfxOn()){ lastTick=sec; tickSound(); }
  else if(sec>3) lastTick=0;
},200);

/* ═══ 관리자 ═══ */
const store={
  get(){ try{ return sessionStorage.getItem('adm')||''; }catch{ return mem; } },
  set(v){ mem=v; try{ sessionStorage.setItem('adm',v); }catch{} },
  clear(){ mem=''; try{ sessionStorage.removeItem('adm'); }catch{} }
};
let mem='';

async function api(path,opt={}){
  const r=await fetch(path,{...opt,headers:{'content-type':'application/json',
    Authorization:'Bearer '+store.get(),...(opt.headers||{})}});
  const d=await r.json().catch(()=>({}));
  if(r.status===401){ store.clear(); renderLogin('세션이 만료되었습니다. 다시 로그인해주세요.'); throw new Error('unauth'); }
  if(!r.ok) throw new Error(d.error||'요청에 실패했습니다');
  return d;
}

function renderAdmin(){ store.get()?renderRooms():renderLogin(); }

function renderLogin(msg){
  $('app').innerHTML=`<div class="landing" style="max-width:420px">
    <h1>관리자</h1>
    <p class="hint">${msg?esc(msg):'경매방을 만들고 관리하려면 로그인하세요.'}</p>
    <div class="panel" style="text-align:left;margin-top:20px">
      <label class="lbl" for="pw">비밀번호</label>
      <input type="password" id="pw" autocomplete="current-password" style="padding:12px 13px;font-size:var(--fs-md)">
      <button class="btn gold" id="bLogin" style="width:100%;margin-top:10px;padding:12px 13px;font-size:var(--fs-md)">로그인</button>
    </div>
    <button class="btn ghost" id="bBack" style="margin-top:14px;font-size:var(--fs-sm)">돌아가기</button>
  </div>`;
  const go=async()=>{
    const pw=$('pw').value;
    if(!pw) return toast('비밀번호를 입력하세요',true);
    $('bLogin').disabled=true;
    try{
      const r=await fetch('/api/admin/login',{method:'POST',
        headers:{'content-type':'application/json'},body:JSON.stringify({password:pw})});
      const d=await r.json();
      if(!r.ok) throw new Error(d.error);
      store.set(d.token); renderRooms();
    }catch(e){ toast(e.message,true); $('bLogin').disabled=false; }
  };
  $('bLogin').onclick=go;
  $('pw').onkeydown=e=>{ if(e.key==='Enter') go(); };
  $('bBack').onclick=()=>{ go(''); renderLanding(); };
}

  };
  // 그룹으로 묶기: 대소문자·띄어쓰기만 다른 이름은 같은 그룹으로 봅니다. 최근에 만든 방이 있는 그룹이 위,

/* 관리자: 랜랜내 챔피언 데이터 상태 · 지금 갱신 · 파일 올리기 · 기본값으로 */

  if(!$('rrdPanel')) return;
  const fmt=t=>t?new Date(t).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'-';
  const BY={auto:'자동 갱신',manual:'지금 갱신',upload:'파일 올리기',reset:'기본값으로 되돌림'};
  const KR=['탑','정글','미드','원딜','서폿'], c=d.current, L=d.last;

    <div class="rrd-body">
      <span>사용 중 <b>${esc(c.patch)} 패치</b> · ${d.using==='stored'?`${esc(c.updated)} 갱신 데이터`:'기본값(배포에 든 데이터)'}</span>
      <span>뽑힐 수 있는 챔피언 (기본 / 메타픽) · ${KR.map((k,i)=>`${k} ${c.base[i]}/${c.meta[i]}`).join(' · ')}</span>

    catch(e){ if(e.message!=='unauth') toast('갱신 실패: '+e.message,true); }
    loadRRStatus();
  };
  $('rrdFile').onchange=async e=>{
    const f=e.target.files[0]; e.target.value=''; if(!f) return;
    try{ const r=await api('/api/admin/rr/upload',{method:'POST',body:await f.text()}); toast(`데이터 파일을 적용했습니다 (${r.patch} 패치)`); }
    catch(err){ if(err.message!=='unauth') toast('파일 올리기 실패: '+err.message,true); }
    loadRRStatus();
  };
  const rs=$('rrdReset');
  if(rs) rs.onclick=async()=>{
    if(!await askConfirm({title:'기본값으로 되돌릴까요?',msg:`갱신된 데이터를 지우고 배포에 든 기본값(${d.def.patch} 패치)을 씁니다.
다음 자동 갱신 때 다시 최신 데이터로 바뀝니다.`,confirmLabel:'되돌리기'})) return;
    try{ await api('/api/admin/rr/reset',{method:'POST'}); toast('기본값으로 되돌렸습니다'); }
    catch(e){ if(e.message!=='unauth') toast(e.message,true); }

  };
}
let roomSrc='';   // 관리자 목록: '만든 곳' 표시로 모아 보는 중이면 그 값

// 방 목록 공용: [pill 클래스, 라벨, 카드 클래스]
function roomState(r){
  return r.missing?['p-gone','삭제됨','st-gone']
    :r.filled||r.phase==='done'?['p-done','종료','st-done']
    :r.phase==='live'?['p-live','진행 중','st-live']:['p-ready','대기','st-ready'];
}
const modePill=r=>r.mode==='random'?'<span class="pill mode-random">랜랜내</span>':`<span class="pill ${r.mode==='draft'?'mode-draft':'mode-auction'}">${r.mode==='draft'?('드래프트 · '+rulesLabel({rules:r.draftRules,balance:r.draftBalance}).replace('클랜티어 균형','클랜티어')):'경매'}</span>`;

// 진행자로 방에 들어갑니다. edit이면 접속 직후 바로 방 설정 수정 화면을 엽니다(pendingEdit).
function enterRoom(code,k,edit){
  pendingEdit=!!edit;
  if(adminEntry) markAdminRoom(code);
  history.replaceState(null,'',`/#/r/${code}?k=${k}`);
  $('app').innerHTML=`<div class="landing"><p class="hint">${edit?'수정 화면을 여는 중입니다…':'입장하는 중입니다…'}</p></div>`;
  connect(code,'k='+k);
}

/* ═══ 내가 만든 방 (이 브라우저에만 기억) ═══
   누구나 방을 만들 수 있게 되면서, 만든 사람이 자기 방을 다시 찾는 열쇠는 진행자 키뿐입니다.
   이 브라우저에 [방 코드, 진행자 키]를 적어두고 첫 화면에 보여줍니다. 서버에는 저장하지 않습니다.
   진행자 링크로 들어온 방도 함께 적으므로, 다른 기기에서도 진행자 링크로 한 번 들어오면 목록에 생깁니다. */
const CREATE_MAX=5;          // 서버 CREATE_MAX와 같은 값 (안내 문구용)
const MY_KEY='myRooms', MY_MAX=10, ROOM_MS=14*86400e3;   // MY_MAX는 서버 MY_ROOMS_MAX와 같은 값
function myRoomsGet(){
  try{
    const a=JSON.parse(localStorage.getItem(MY_KEY)||'[]');
    if(!Array.isArray(a)) return [];
    const now=Date.now();
    return a.filter(r=>r&&/^[A-Z0-9]{6}$/.test(r.code)&&r.k&&!(r.at&&now-r.at>=ROOM_MS)).slice(0,MY_MAX);
  }catch{ return []; }
}
function myRoomsSet(a){ try{ localStorage.setItem(MY_KEY,JSON.stringify(a.slice(0,MY_MAX))); }catch{} }
function rememberRoom(code,k,title,at,group){
  if(!code||!k) return;
  const a=myRoomsGet(), i=a.findIndex(r=>r.code===code), old=i>=0?a[i]:null;
  const rec={code,k,title:String(title||'').slice(0,40),at:at||(old&&old.at)||Date.now(),g:String(group||'').slice(0,20)};
  if(old&&old.k===rec.k&&old.title===rec.title&&old.at===rec.at&&(old.g||'')===rec.g) return;   // 바뀐 게 없으면 쓰지 않음
  if(old) a[i]=rec; else a.unshift(rec);   // 새 방은 맨 앞 — MY_MAX개를 넘으면 가장 오래된 것이 빠집니다
  const out=a.length>MY_MAX?a[a.length-1]:null;
  myRoomsSet(a);
  // 빠진 방도 서버에는 그대로 있습니다. 진행자 링크가 없으면 다시 찾을 수 없으니 알려줍니다.
  if(out) toast(`내가 만든 방은 ${MY_MAX}개까지 기억합니다. 가장 오래된 ${out.code}${out.title?` (${out.title})`:''} 방이 목록에서 빠졌습니다. 그 방은 진행자 링크로 들어갈 수 있습니다.`,true);
}
function recentGroups(){
  const seen=new Set(), out=[];
  for(const r of myRoomsGet()){ const g=String(r.g||'').trim(), k=g.toLowerCase().replace(/\s+/g,'');
    if(g&&!seen.has(k)){ seen.add(k); out.push(g); } }
  return out.slice(0,6);
}
function forgetRoom(code){ myRoomsSet(myRoomsGet().filter(r=>r.code!==code)); }
// 진행자로 접속한 방을 기억합니다. 관리자가 목록에서 들어간 남의 방은 제외합니다.
// adminEntry는 메모리 값이라 새로고침하면 사라집니다. 관리자로 들어간 방 코드를 이 탭(sessionStorage)에 남겨둡니다.
function markAdminRoom(code){
  try{ const a=JSON.parse(sessionStorage.getItem('admRooms')||'[]'); if(!a.includes(code)){ a.push(code); sessionStorage.setItem('admRooms',JSON.stringify(a.slice(-50))); } }catch{}
}
function isAdminRoom(code){
  try{ return JSON.parse(sessionStorage.getItem('admRooms')||'[]').includes(code); }catch{ return false; }
}
function rememberHostRoom(){
  if(!S||!me||me.role!=='host'||adminEntry||isAdminRoom(S.code)) return;
  rememberRoom(S.code,new URLSearchParams(wsAuth).get('k')||'',S.title,S.createdAt,S.group);
}

async function renderMyRooms(){
  const box=$('myRooms'); if(!box) return;
  const mine=myRoomsGet();
  if(!mine.length){ box.innerHTML=''; return; }
  const shell=inner=>`<div class="panel" style="text-align:left;margin-top:14px">
    <div style="display:flex;align-items:center;gap:8px"><span class="lbl" style="margin:0">내가 만든 방</span>
      <button class="btn ghost sm" id="mrRe" style="margin-left:auto">새로고침</button></div>
    ${inner}
    <p class="hint" style="margin:10px 0 0">이 브라우저에만 기억됩니다. 다른 기기에서는 진행자 링크로 한 번 들어오면 그 기기 목록에도 생깁니다.</p>
  </div>`;
  box.innerHTML=shell('<div class="hint" style="margin:8px 0 0">불러오는 중…</div>');
  $('mrRe').onclick=renderMyRooms;
  let data;
  try{
    const r=await fetch('/api/my-rooms',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({rooms:mine.map(({code,k})=>({code,k}))})});
    data=await r.json().catch(()=>({}));
    if(!r.ok||!Array.isArray(data.rooms)) throw new Error(r.status===429?'busy':(data.error||'불러오지 못했습니다'));
  }catch(e){
    if(!$('myRooms')) return;
    box.innerHTML=shell(`<div class="hint" style="margin:8px 0 0;color:var(--danger)">${e.message==='busy'?'너무 자주 불러왔습니다. 1분쯤 뒤에 새로고침해주세요.':'방 목록을 불러오지 못했습니다. 새로고침해주세요.'}</div>`);
    $('mrRe').onclick=renderMyRooms;
    return;
  }
  if(!$('myRooms')) return;   // 기다리는 사이 다른 화면으로 넘어갔으면 그리지 않습니다
  // 삭제됐거나 기간이 지난 방은 목록에서 걷어냅니다. 일시적 오류(error)는 남겨둡니다.
  const byCode=new Map(data.rooms.map(x=>[x.code,x]));
  const gone=data.rooms.filter(x=>x.missing).map(x=>x.code);
  if(gone.length) myRoomsSet(myRoomsGet().filter(r=>!gone.includes(r.code)));
  const list=myRoomsGet().filter(r=>byCode.has(r.code)&&!byCode.get(r.code).missing);
  if(!list.length){ box.innerHTML=''; return; }

  box.innerHTML=shell(`<div class="myrooms">${list.map((m,i)=>{
    const r=byCode.get(m.code);
    if(r.error) return `<div class="myroom"><div class="mr-hd"><span class="rc">${m.code}</span><span class="rt">${esc(m.title)}</span></div>
      <div class="rs"><span>상태를 불러오지 못했습니다</span></div>
      <div class="row"><button class="btn gold" data-mrenter="${i}">진행자로 입장</button></div></div>`;
    const st=roomState(r);
    const d=Math.ceil(((r.createdAt||m.at)+ROOM_MS-Date.now())/86400e3);
    return `<div class="myroom ${st[2]}">
      <div class="mr-hd"><span class="rc">${m.code}</span><span class="rt">${esc(r.title)}</span>${r.group?`<span class="pill p-grp">${esc(r.group)}</span>`:''}${modePill(r)}<span class="pill ${st[0]}">${st[1]}</span></div>
      <div class="rs">
        ${r.mode==='random'?`<span>${r.rrGame||1}판째 · 확정 ${r.sold}/10</span>${r.pres&&r.pres.view?`<span>관전 ${r.pres.view}</span>`:''}`:`<span>${r.teams}팀 · 참가자 ${r.players}명</span>
        <span>${r.mode==='draft'?'지명':'낙찰'} ${r.sold}/${r.players}</span>
        <span>${connSummary(r)}</span>`}
        <span class="${d<=3?'warn':''}">삭제까지 ${Math.max(0,d)}일</span>
      </div>
      <div class="row">
        <button class="btn gold" data-mrenter="${i}">진행자로 입장</button>
        <button class="btn" data-mrlinks="${i}">링크</button>
        ${r.phase==='ready'&&r.mode!=='random'?`<button class="btn" data-mredit="${i}">수정</button>`:''}
        <button class="btn danger-soft" data-mrdel="${i}" style="margin-left:auto">삭제</button>
      </div>
    </div>`;
  }).join('')}</div>`);
  $('mrRe').onclick=renderMyRooms;
  document.querySelectorAll('[data-mrenter]').forEach(b=>b.onclick=()=>{ const m=list[+b.dataset.mrenter]; enterRoom(m.code,m.k,false); });
  document.querySelectorAll('[data-mredit]').forEach(b=>b.onclick=()=>{ const m=list[+b.dataset.mredit]; enterRoom(m.code,m.k,true); });
  document.querySelectorAll('[data-mrlinks]').forEach(b=>b.onclick=async()=>{
    const m=list[+b.dataset.mrlinks];
    try{
      const r=await fetch(`/api/room/${m.code}/links?k=${encodeURIComponent(m.k)}`);
      const d=await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d.error||'링크를 불러오지 못했습니다');
      setupMode='open'; d.mode=(byCode.get(m.code)||{}).mode; links=d; renderLinks(d,true);
    }catch(e){ toast(e.message,true); }
  });
  document.querySelectorAll('[data-mrdel]').forEach(b=>b.onclick=async()=>{
    const m=list[+b.dataset.mrdel];
    if(!await askConfirm({title:`${m.code} 방을 삭제할까요?`,msg:'진행 기록과 링크가 모두 사라지고 되돌릴 수 없습니다.\n확인을 위해 방 코드를 입력하세요.',confirmLabel:'삭제',danger:'solid',code:m.code})) return;
    try{
      const r=await fetch(`/api/room/${m.code}?k=${encodeURIComponent(m.k)}`,{method:'DELETE'});
      const d=await r.json().catch(()=>({}));
      if(!r.ok&&r.status!==404) throw new Error(d.error||'삭제하지 못했습니다');
      forgetRoom(m.code); toast('삭제했습니다'); renderMyRooms();
    }catch(e){ toast(/fetch|network|failed/i.test(e.message)?'네트워크 오류입니다. 다시 시도해주세요.':e.message,true); }
  });
}

/* 방 설정 수정: 현재 방 상태(S)를 생성 폼의 전역들에 역매핑합니다.
   grade/score는 서버가 숫자로 저장하지만 폼 검증(gnum/snum)은 문자열을 기대하므로 변환합니다.
   leaders의 id는 서버가 팀 토큰(=배포된 링크)을 보존하는 열쇠입니다 — drawLeaders는 id를 건드리지 않습니다. */
function seedSetupFromRoom(S0){
  gameMode=S0.mode==='draft'?'draft':'auction';
  const rl=S0.draft
    ? (Array.isArray(S0.draft.rules)?S0.draft.rules
       :(S0.draft.balance&&S0.draft.balance!=='free'?[S0.draft.balance]:[]))
    : [];
  draftRules={tier:rl.includes('tier'),score:rl.includes('score')};
  rules={title:S0.title,group:S0.group||'',clock:S0.clock,base:S0.base,minBid:S0.minBid,order:S0.orderMode==='draw'?'draw':'random'};
  clockTouched=true;   // 모드 토글이 기존 제한시간을 기본값으로 덮지 않게
  leaders=S0.teams.map(t=>({id:t.id,name:t.leader,line:t.leaderLine||'',
    points:t.start===S0.base?null:t.start,
    grade:t.grade==null?'':String(t.grade),
    score:t.score==null?'':String(t.score)}));
  players=S0.pool.map(p=>({name:p.name,tag:p.tag,tier:p.tier,line:p.line,sub:p.sub,
    grade:p.grade==null?'':String(p.grade),
    score:p.score==null?'':String(p.score),
    champs:(p.champs||[]).slice(),
    msg:p.msg||''}));
  poolText='';
}

// 방 안(진행자)에서 수정 화면 열기. hostKey는 접속에 쓴 키에서 얻습니다(openLinksModal과 동일).

}

  // 정렬 토글(1327행)과 같이 재렌더 뒤 그 자리로 포커스를 돌려준다.
